<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>宠物纪念墓碑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cemetery-page">

    <a href="index.html" class="back-link">← 返回首页</a>

    <section class="memorial-scene">

      <div class="sky-note">
        愿每一次想念，都像一片花瓣，轻轻落在它身边。
      </div>

      <div class="grave-area">

        <div id="petals"></div>

        <div class="stone">
          <div class="photo-frame">🐾</div>
          <h1>小星星</h1>
          <p class="date">2016 - 2024</p>
          <p class="memory">谢谢你陪我们走过那么多温柔的日子。</p>
        </div>

        <div id="placedItems" class="placed-items"></div>

        <div id="animals" class="animals"></div>

      </div>

      <div class="gift-buttons">
        <button onclick="placeGift('flower')">献一束花</button>
        <button onclick="placeGift('can')">送一罐猫罐头</button>
        <button onclick="placeGift('ball')">放一个小球</button>
        <button onclick="placeGift('catstick')">放一根逗猫棒</button>
      </div>

      <div class="message-box">
        <textarea id="messageInput" placeholder="写下一句想对它说的话..."></textarea>
        <button onclick="addMessage()">留下留言</button>
      </div>

      <div class="message-area">
        <h3>留言</h3>
        <div id="messageList"></div>
      </div>

    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
