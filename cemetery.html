<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pet Memorial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #0d1110;
      color: #fffaf5;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(7, 11, 19, 0.05) 0%, rgba(7, 11, 19, 0.13) 55%, rgba(7, 11, 19, 0.30) 100%),
        url("cemetery-bg.png") center center / cover no-repeat;
      transform: scale(1.08);
      transform-origin: center center;
      z-index: 0;
    }

    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center 62%, rgba(255, 231, 190, 0.08), transparent 20%),
        radial-gradient(circle at center 64%, rgba(255, 255, 255, 0.04), transparent 32%);
      pointer-events: none;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .memorial-header {
      position: relative;
      z-index: 30;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 34px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .memorial-logo {
      color: rgba(255, 250, 245, 0.96);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.36);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .soft-button,
    .bottom-button,
    .language-select {
      border: 1px solid rgba(255, 250, 245, 0.30);
      background: rgba(255, 250, 245, 0.08);
      color: #fffaf5;
      padding: 10px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
      font-family: inherit;
    }

    .soft-button:hover,
    .bottom-button:hover,
    .language-select:hover {
      background: rgba(255, 250, 245, 0.16);
      border-color: rgba(255, 250, 245, 0.42);
    }

    .language-select {
      min-width: 146px;
    }

    .language-select option {
      color: #2d2520;
      background: #fffaf5;
    }

    .main-stage {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 104px;
    }

    .stone-scene-wrap {
      position: relative;
      width: min(390px, 48vw);
      height: min(500px, 62vh);
      min-width: 280px;
      min-height: 380px;
      transform: translateY(72px);
    }

    #stoneScene {
      position: absolute;
      inset: 0;
      border-radius: 24px;
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 999px;
      background: rgba(20, 22, 20, 0.36);
      border: 1px solid rgba(255, 250, 245, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.24);
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: rgba(5, 7, 8, 0.64);
    }

    .modal-layer.show {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: min(760px, 92vw);
      max-height: 82vh;
      overflow-y: auto;
      padding: 30px;
      border-radius: 30px;
      background: rgba(255, 250, 245, 0.95);
      color: #4b3d35;
      box-shadow: 0 26px 80px rgba(0,0,0,0.45);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(75, 61, 53, 0.10);
      color: #4b3d35;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-card h2 {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 500;
      color: #4b3d35;
    }

    .modal-card p {
      margin: 0;
      line-height: 1.8;
      color: rgba(75, 61, 53, 0.75);
      font-size: 15px;
    }

    .photo-block {
      margin-bottom: 26px;
    }

    .photo-block h3 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 500;
      color: #4b3d35;
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .gallery-photo {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(120, 95, 70, 0.08);
      border: 1px solid rgba(134, 103, 75, 0.16);
      cursor: zoom-in;
    }

    .gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty-text {
      color: rgba(75, 61, 53, 0.46);
      font-size: 14px;
    }

    .gift-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gift-buttons button,
    .message-box button {
      border: none;
      background: #715843;
      color: #fffaf5;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    .animal-status {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 18px;
      background: rgba(118, 91, 66, 0.08);
      color: rgba(75, 61, 53, 0.66);
      font-size: 13px;
      line-height: 1.6;
    }

    .placed-items {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 28px;
    }

    .placed-item-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(113, 88, 67, 0.10);
      color: rgba(75, 61, 53, 0.72);
      font-size: 13px;
    }

    .message-box textarea {
      width: 100%;
      height: 108px;
      border: 1px solid rgba(134, 103, 75, 0.22);
      background: rgba(255,255,255,0.72);
      color: #4b3d35;
      padding: 14px;
      border-radius: 18px;
      font-size: 14px;
      resize: none;
      font-family: inherit;
    }

    .message-list {
      margin-top: 14px;
    }

    .message-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(134, 103, 75, 0.14);
      color: rgba(75, 61, 53, 0.72);
      line-height: 1.6;
      font-size: 14px;
    }

    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5, 7, 8, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .photo-lightbox.show {
      display: flex;
    }

    .photo-lightbox img {
      max-width: min(92vw, 1100px);
      max-height: 86vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 26px 80px rgba(0,0,0,0.55);
    }

    .lightbox-close {
      position: fixed;
      top: 22px;
      right: 24px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.32);
      background: rgba(255,255,255,0.10);
      color: #fffaf5;
      border-radius: 50%;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 210;
    }

    @media (max-width: 760px) {
      .memorial-header {
        padding: 22px 16px 0;
        align-items: flex-start;
      }

      .header-actions {
        flex-direction: column;
        align-items: flex-end;
      }

      .stone-scene-wrap {
        width: min(90vw, 360px);
        height: min(56vh, 440px);
        transform: translateY(56px);
      }

      .bottom-dock {
        width: calc(100vw - 24px);
        justify-content: center;
        flex-wrap: wrap;
        border-radius: 28px;
        bottom: 18px;
      }

      .photo-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="page-bg"></div>

  <div class="page-shell">
    <header class="memorial-header">
      <a href="index.html" class="memorial-logo" data-key="logo">Starlit Pet Memorial Garden</a>

      <div class="header-actions">
        <a href="create.html" class="soft-button" data-key="editBtn">Edit Info</a>
        <a href="select-stone.html" class="soft-button" data-key="changeStoneBtn">Change Stone</a>

        <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="th">ไทย</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>

    <main class="main-stage">
      <div class="stone-scene-wrap">
        <div id="stoneScene"></div>
      </div>
    </main>
  </div>

  <div class="bottom-dock">
    <button class="bottom-button" onclick="openPanel('storyPanel')" data-key="storyBtn">Story</button>
    <button class="bottom-button" onclick="openPanel('photosPanel')" data-key="photosBtn">Photos</button>
    <button class="bottom-button" onclick="openPanel('giftPanel')" data-key="giftBtn">Gift</button>
    <button class="bottom-button" onclick="openPanel('messagePanel')" data-key="messageBtnShort">Messages</button>
  </div>

  <div class="modal-layer" id="storyPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="storyTitle">Pet Story</h2>
      <p id="petStoryDisplay" class="empty-text">No story has been written yet.</p>
    </div>
  </div>

  <div class="modal-layer" id="photosPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="photosTitle">Memory Photos</h2>

      <div class="photo-block">
        <h3 data-key="publicPhotosTitle">Public Memory Photos</h3>
        <div id="publicPhotosDisplay" class="photo-gallery"></div>
      </div>

      <div class="photo-block">
        <h3 data-key="privatePhotosTitle">Private Memory Photos</h3>
        <p class="empty-text" style="margin-bottom:12px;" data-key="privatePhotosDesc">
          These photos are currently shown only in your browser demo.
        </p>
        <div id="privatePhotosDisplay" class="photo-gallery"></div>
      </div>
    </div>
  </div>

  <div class="modal-layer" id="giftPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="giftTitle">Offer a small gift</h2>

      <div class="gift-buttons">
        <button onclick="placeGift('can')" data-key="giftCan">Place a can</button>
        <button onclick="placeGift('ball')" data-key="giftBall">Place a ball</button>
        <button onclick="placeGift('seed')" data-key="giftSeed">Place seeds</button>
        <button onclick="placeGift('flower')" data-key="giftFlower">Place flowers</button>
      </div>

      <div class="animal-status" id="animalStatus" data-key="animalStatus">
        Quiet gifts may bring gentle visitors.
      </div>

      <div class="placed-items" id="placedItemsList"></div>
    </div>
  </div>

  <div class="modal-layer" id="messagePanel" onclick="closePanels(event)">
    <div class="modal-card message-box">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="messageTitle">Leave a message</h2>
      <textarea id="messageInput" data-placeholder-key="messagePlaceholder" placeholder="Write a few quiet words..."></textarea>
      <br /><br />
      <button onclick="addMessage()" data-key="messageSendBtn">Leave message</button>
      <div id="messageList" class="message-list"></div>
    </div>
  </div>

  <div class="photo-lightbox" id="photoLightbox" onclick="closePhotoLightbox()">
    <button class="lightbox-close" onclick="closePhotoLightbox()">×</button>
    <img id="lightboxImage" src="" alt="" />
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    let currentLang = "en";
    let scene, camera, renderer, stoneGroup, textPlane;

    const translations = {

      },

        changeStoneBtn: "更换墓碑",
        storyBtn: "故事",

        giftBtn: "礼物",
        messageBtnShort: "留言",

        photosTitle: "回忆相册",
        publicPhotosTitle: "公开回忆照片",
        privatePhotosTitle: "私密回忆照片",
        privatePhotosDesc: "这些照片目前只会显示在你的浏览器演示中。",
        giftTitle: "放置一个小礼物",
        giftCan: "放一个罐头",
        giftBall: "放一个球",
        giftSeed: "放一些鸟食",
        giftFlower: "放一些花",
        animalStatus: "安静的小礼物，可能会吸引温柔的访客。",
        messageTitle: "留言",

        noPhotos: "还没有照片。",

        defaultName: "露娜",
        defaultWords: "永远爱你。",

        placedBall: "已放置球",

      },
      "zh-TW": {
        logo: "星眠寵物紀念園",
        editBtn: "修改資訊",
        changeStoneBtn: "更換墓碑",
        storyBtn: "故事",
        photosBtn: "相冊",
        giftBtn: "禮物",
        messageBtnShort: "留言",
        storyTitle: "寵物故事",
        photosTitle: "回憶相冊",
        publicPhotosTitle: "公開回憶照片",
        privatePhotosTitle: "私密回憶照片",
        privatePhotosDesc: "這些照片目前只會顯示在你的瀏覽器演示中。",
        giftTitle: "放置一個小禮物",
        giftCan: "放一個罐頭",
        giftBall: "放一個球",
        giftSeed: "放一些鳥食",
        giftFlower: "放一些花",
        animalStatus: "安靜的小禮物，可能會吸引溫柔的訪客。",
        messageTitle: "留言",
        messagePlaceholder: "寫幾句安靜的話...",
        messageSendBtn: "留下留言",
        noStory: "還沒有寫下故事。",
        noPhotos: "還沒有照片。",
        noMessages: "還沒有留言。",
        defaultName: "露娜",
        defaultWords: "永遠愛你。",
        publicText: "公開",
        privateText: "私密",
        inviteText: "邀請可見",
        placedCan: "已放置罐頭",
        placedBall: "已放置球",
        placedSeed: "已放置鳥食",
        placedFlower: "已放置花"
      }
    };

    ["ja","ko","es","fr","de","pt","it","th","vi","id","ms","hi","ar"].forEach(function(lang) {
      translations[lang] = translations.en;
    });

    function getText() {
      return translations[currentLang] || translations.en;
    }

    function getMemorialData() {
      return JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
    }

    function normalizeStyle(style) {
      if (style === "square") return "square";
      if (style === "arch") return "arch";
      return "rounded";
    }

    function getVisibilityText(value) {
      const text = getText();
      if (value === "private") return text.privateText;
      if (value === "invite") return text.inviteText;
      return text.publicText;
    }

    function changeLanguage(lang) {
      currentLang = translations[lang] ? lang : "en";
      localStorage.setItem("siteLanguage", currentLang);

      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      const select = document.getElementById("languageSelect");
      if (select) select.value = currentLang;

      const text = getText();

      document.querySelectorAll("[data-key]").forEach(function(el) {
        const key = el.getAttribute("data-key");
        if (text[key]) el.textContent = text[key];
      });

      document.querySelectorAll("[data-placeholder-key]").forEach(function(el) {
        const key = el.getAttribute("data-placeholder-key");
        if (text[key]) el.placeholder = text[key];
      });

      loadExtraMemorialInfo();
      renderPlacedItems();
      rebuildTextTexture();
    }

    function createStoneTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#77716a";
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 2600; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const alpha = Math.random() * 0.075;
        const light = Math.random() > 0.5 ? 255 : 0;
        ctx.fillStyle = "rgba(" + light + "," + light + "," + light + "," + alpha + ")";
        ctx.fillRect(x, y, Math.random() * 2.2 + 0.5, Math.random() * 2.2 + 0.5);
      }

      for (let i = 0; i < 22; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const w = Math.random() * 180 + 60;
        const h = Math.random() * 2 + 0.6;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((Math.random() - 0.5) * 0.8);
        ctx.fillStyle = "rgba(255,255,255,0.035)";
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.restore();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1.2, 1.2);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function createStoneMaterial() {
      const texture = createStoneTexture();

      return new THREE.MeshStandardMaterial({
        color: 0x77716a,
        map: texture,
        roughness: 0.98,
        metalness: 0.0,
        bumpMap: texture,
        bumpScale: 0.035
      });
    }

    function createSideMaterial() {
      const texture = createStoneTexture();

      return new THREE.MeshStandardMaterial({
        color: 0x5f5a54,
        map: texture,
        roughness: 0.99,
        metalness: 0.0,
        bumpMap: texture,
        bumpScale: 0.04
      });
    }

    function createBaseMaterial() {
      const texture = createStoneTexture();

      return new THREE.MeshStandardMaterial({
        color: 0x625d57,
        map: texture,
        roughness: 0.99,
        metalness: 0.0,
        bumpMap: texture,
        bumpScale: 0.035
      });
    }

    function buildRoundedShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.18, -1.75);
      s.lineTo(-1.18, 0.62);
      s.quadraticCurveTo(-1.18, 1.72, 0, 1.72);
      s.quadraticCurveTo(1.18, 1.72, 1.18, 0.62);
      s.lineTo(1.18, -1.75);
      s.closePath();
      return s;
    }

    function buildSquareShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.24, -1.75);
      s.lineTo(-1.24, 1.45);
      s.quadraticCurveTo(-1.24, 1.72, -0.98, 1.72);
      s.lineTo(0.98, 1.72);
      s.quadraticCurveTo(1.24, 1.72, 1.24, 1.45);
      s.lineTo(1.24, -1.75);
      s.closePath();
      return s;
    }

    function buildArchShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.22, -1.78);
      s.lineTo(-1.22, 0.45);
      s.absarc(0, 0.45, 1.22, Math.PI, 0, true);
      s.lineTo(1.22, -1.78);
      s.closePath();
      return s;
    }

    function buildTombstoneShape(style) {
      const normalized = normalizeStyle(style);
      if (normalized === "square") return buildSquareShape();
      if (normalized === "arch") return buildArchShape();
      return buildRoundedShape();
    }

    function createTextTexture(memorial) {
      const text = getText();
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 1024, 1024);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "rgba(30, 27, 24, 0.24)";
      ctx.font = "600 46px Arial";
      ctx.fillText("🐾", 512, 178);

      ctx.fillStyle = "rgba(28, 25, 22, 0.25)";
      ctx.beginPath();
      roundRect(ctx, 400, 238, 224, 52, 26);
      ctx.fill();

      ctx.fillStyle = "rgba(22, 19, 17, 0.45)";
      ctx.font = "500 26px 'Microsoft YaHei', Arial";
      ctx.fillText(getVisibilityText(memorial.visibility), 512, 264);

      ctx.fillStyle = "rgba(21, 19, 17, 0.68)";
      ctx.font = "500 76px 'Microsoft YaHei', Arial";
      ctx.fillText(memorial.name || text.defaultName, 512, 440);

      ctx.fillStyle = "rgba(22, 20, 18, 0.52)";
      ctx.font = "400 34px 'Microsoft YaHei', Arial";
      const birth = memorial.birthDate || "----";
      const leave = memorial.leaveDate || "----";
      ctx.fillText(birth + " — " + leave, 512, 540);

      ctx.fillStyle = "rgba(23, 21, 19, 0.50)";
      ctx.font = "italic 32px 'Microsoft YaHei', Arial";
      drawWrappedText(ctx, memorial.epitaph || memorial.memory || text.defaultWords, 512, 660, 460, 44, 3);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawWrappedText(ctx, value, x, y, maxWidth, lineHeight, maxLines) {
      const chars = String(value || "").split("");
      const lines = [];
      let current = "";

      for (let i = 0; i < chars.length; i++) {
        const test = current + chars[i];
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = chars[i];
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);

      const finalLines = lines.slice(0, maxLines);
      if (lines.length > maxLines && finalLines.length) {
        finalLines[finalLines.length - 1] = finalLines[finalLines.length - 1].slice(0, -1) + "…";
      }

      finalLines.forEach(function(line, index) {
        ctx.fillText(line, x, y + index * lineHeight);
      });
    }

    function makeShadowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(256, 256, 12, 256, 256, 215);

      gradient.addColorStop(0, "rgba(0,0,0,0.42)");
      gradient.addColorStop(0.42, "rgba(0,0,0,0.22)");
      gradient.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createStoneGroup(style) {
      const group = new THREE.Group();
      const shape = buildTombstoneShape(style);

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.42,
        bevelEnabled: true,
        bevelThickness: 0.042,
        bevelSize: 0.042,
        bevelSegments: 4,
        curveSegments: 30
      });

      geometry.center();

      const stoneMesh = new THREE.Mesh(geometry, createStoneMaterial());
      stoneMesh.position.y = 0.30;
      stoneMesh.rotation.y = 0;
      group.add(stoneMesh);

      const backGeo = new THREE.BoxGeometry(2.50, 3.28, 0.16);
      const backMesh = new THREE.Mesh(backGeo, createSideMaterial());
      backMesh.position.set(0, 0.30, -0.31);
      backMesh.rotation.y = 0;
      group.add(backMesh);

      const baseGeo = new THREE.BoxGeometry(3.28, 0.38, 1.08);
      const baseMesh = new THREE.Mesh(baseGeo, createBaseMaterial());
      baseMesh.position.set(0, -1.78, -0.02);
      group.add(baseMesh);

      const lipGeo = new THREE.BoxGeometry(2.95, 0.16, 0.92);
      const lipMesh = new THREE.Mesh(lipGeo, createBaseMaterial());
      lipMesh.position.set(0, -1.49, 0.02);
      group.add(lipMesh);

      const textTexture = createTextTexture(getMemorialData());
      const textMat = new THREE.MeshBasicMaterial({
        map: textTexture,
        transparent: true,
        depthWrite: false,
        opacity: 0.78
      });

      textPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.28, 2.88), textMat);
      textPlane.position.set(0, 0.26, 0.245);
      textPlane.rotation.y = 0;
      group.add(textPlane);

      group.scale.set(0.64, 0.64, 0.64);
      group.position.y = -0.55;

      return group;
    }

    function rebuildTextTexture() {
      if (!textPlane) return;

      const texture = createTextTexture(getMemorialData());

      if (textPlane.material.map) {
        textPlane.material.map.dispose();
      }

      textPlane.material.map = texture;
      textPlane.material.needsUpdate = true;
      renderScene();
    }

    function initThreeScene() {
      const container = document.getElementById("stoneScene");
      if (!container || !window.THREE) return;

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 0.08, 7.7);

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      container.innerHTML = "";
      container.appendChild(renderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 1.12);
      scene.add(ambient);

      const hemi = new THREE.HemisphereLight(0xbfd0ff, 0x4e453d, 0.86);
      scene.add(hemi);

      const moonLight = new THREE.DirectionalLight(0xd4ddff, 1.18);
      moonLight.position.set(-4.2, 7.2, 6.2);
      scene.add(moonLight);

      const warmLight = new THREE.PointLight(0xffd3a0, 1.25, 18, 2);
      warmLight.position.set(2.4, -0.9, 5.5);
      scene.add(warmLight);

      const fill = new THREE.PointLight(0xffffff, 0.22, 18, 2);
      fill.position.set(-2.5, 1.0, 4.5);
      scene.add(fill);

      const shadowMat = new THREE.MeshBasicMaterial({
        map: makeShadowTexture(),
        transparent: true,
        depthWrite: false,
        opacity: 0.78
      });

      const groundShadow = new THREE.Mesh(new THREE.PlaneGeometry(3.9, 1.24), shadowMat);
      groundShadow.position.set(0, -1.95, -0.45);
      scene.add(groundShadow);

      const data = getMemorialData();
      const style = normalizeStyle(data.tombstoneStyle || "rounded");

      stoneGroup = createStoneGroup(style);
      scene.add(stoneGroup);

      renderScene();

      window.addEventListener("resize", resizeScene);
    }

    function renderScene() {
      if (!renderer || !scene || !camera) return;
      renderer.render(scene, camera);
    }

    function resizeScene() {
      const container = document.getElementById("stoneScene");
      if (!container || !renderer || !camera) return;

      renderer.setSize(container.clientWidth, container.clientHeight);
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderScene();
    }

    function openPanel(id) {
      closeAllPanels();
      const panel = document.getElementById(id);
      if (panel) panel.classList.add("show");
    }

    function closeAllPanels() {
      document.querySelectorAll(".modal-layer").forEach(function(panel) {
        panel.classList.remove("show");
      });
    }

    function closePanels(event) {
      if (event.target.classList.contains("modal-layer")) {
        closeAllPanels();
      }
    }

    function showPhotos(containerId, photos) {
      const container = document.getElementById(containerId);
      const text = getText();

      if (!container) return;

      container.innerHTML = "";

      if (!photos || photos.length === 0) {
        container.innerHTML = '<p class="empty-text">' + text.noPhotos + '</p>';
        return;
      }

      photos.forEach(function(photo) {
        const box = document.createElement("div");
        box.className = "gallery-photo";
        box.onclick = function() {
          openPhotoLightbox(photo);
        };

        const img = document.createElement("img");
        img.src = photo;

        box.appendChild(img);
        container.appendChild(box);
      });
    }

    function openPhotoLightbox(src) {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      image.src = src;
      lightbox.classList.add("show");
    }

    function closePhotoLightbox() {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      lightbox.classList.remove("show");
      image.src = "";
    }

    function loadExtraMemorialInfo() {
      const data = getMemorialData();
      const text = getText();

      const storyDisplay = document.getElementById("petStoryDisplay");

      if (storyDisplay) {
        if (data.story) {
          storyDisplay.textContent = data.story;
          storyDisplay.classList.remove("empty-text");
        } else {
          storyDisplay.textContent = text.noStory;
          storyDisplay.classList.add("empty-text");
        }
      }

      const publicPhotos = (data.publicPhotos && data.publicPhotos.length) ? data.publicPhotos : (data.photo ? [data.photo] : []);
      const privatePhotos = data.privatePhotos || [];

      showPhotos("publicPhotosDisplay", publicPhotos);
      showPhotos("privatePhotosDisplay", privatePhotos);

      renderMessages();
    }

    function getMessages() {
      return JSON.parse(localStorage.getItem("memorialMessages") || "[]");
    }

    function renderMessages() {
      const list = document.getElementById("messageList");
      const text = getText();

      if (!list) return;

      const messages = getMessages();
      list.innerHTML = "";

      if (!messages.length) {
        list.innerHTML = '<div class="message-item empty-text">' + text.noMessages + '</div>';
        return;
      }

      messages.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "message-item";
        div.textContent = item;
        list.appendChild(div);
      });
    }

    function addMessage() {
      const input = document.getElementById("messageInput");
      if (!input) return;

      const value = input.value.trim();
      if (!value) return;

      const messages = getMessages();
      messages.unshift(value);
      localStorage.setItem("memorialMessages", JSON.stringify(messages.slice(0, 20)));

      input.value = "";
      renderMessages();
    }

    function getPlacedItems() {
      return JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]");
    }

    function renderPlacedItems() {
      const box = document.getElementById("placedItemsList");
      const text = getText();

      if (!box) return;

      const items = getPlacedItems();
      box.innerHTML = "";

      items.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "placed-item-badge";

        if (item === "can") div.textContent = "🥫 " + text.placedCan;
        if (item === "ball") div.textContent = "🎾 " + text.placedBall;
        if (item === "seed") div.textContent = "🌾 " + text.placedSeed;
        if (item === "flower") div.textContent = "🌸 " + text.placedFlower;

        box.appendChild(div);
      });
    }

    function placeGift(type) {
      const items = getPlacedItems();
      items.unshift(type);
      localStorage.setItem("memorialPlacedItems", JSON.stringify(items.slice(0, 8)));
      renderPlacedItems();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePhotoLightbox();
        closeAllPanels();
      }
    });

    window.addEventListener("DOMContentLoaded", function() {
      initThreeScene();

      const savedLanguage = localStorage.getItem("siteLanguage") || "en";
      changeLanguage(savedLanguage);
    });
  </script>
</body>
