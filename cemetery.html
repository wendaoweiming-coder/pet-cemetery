<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Pet Memorial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #0d1110;
      color: #fffaf5;
    }

    button, a, select, textarea {
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(7, 11, 19, 0.05) 0%,
          rgba(7, 11, 19, 0.13) 55%,
          rgba(7, 11, 19, 0.30) 100%
        ),
        url("cemetery-bg.png") center center / cover no-repeat;
      transform: scale(1.08);
      transform-origin: center center;
      z-index: 0;
    }

    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center 62%, rgba(255, 231, 190, 0.08), transparent 20%),
        radial-gradient(circle at center 64%, rgba(255, 255, 255, 0.04), transparent 32%);
      pointer-events: none;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .memorial-header {
      position: relative;
      z-index: 30;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 30px 34px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .memorial-logo {
      color: rgba(255, 250, 245, 0.96);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.36);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .soft-button,
    .language-select,
    .bottom-button {
      border: 1px solid rgba(255, 250, 245, 0.30);
      background: rgba(255, 250, 245, 0.08);
      color: #fffaf5;
      padding: 10px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .soft-button:hover,
    .language-select:hover,
    .bottom-button:hover {
      background: rgba(255, 250, 245, 0.16);
      border-color: rgba(255, 250, 245, 0.42);
    }

    .language-select {
      min-width: 146px;
    }

    .language-select option {
      color: #2d2520;
      background: #fffaf5;
    }

    .main-stage {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 34px 116px;
    }

    .stone-scene-wrap {
      position: relative;
      width: min(350px, 43vw);
      height: min(445px, 55vh);
      min-width: 300px;
      min-height: 390px;
      transform: translate(-72px, 4px);
    }

    #stoneScene {
      position: absolute;
      inset: 0;
      border-radius: 26px;
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(0);
      z-index: 40;
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 999px;
      background: rgba(20, 22, 20, 0.36);
      border: 1px solid rgba(255, 250, 245, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.24);
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: rgba(5, 7, 8, 0.64);
    }

    .modal-layer.show { display: flex; }

    .modal-card {
      position: relative;
      width: min(760px, 92vw);
      max-height: 82vh;
      overflow-y: auto;
      padding: 30px;
      border-radius: 30px;
      background: rgba(255, 250, 245, 0.95);
      color: #4b3d35;
      box-shadow: 0 26px 80px rgba(0,0,0,0.45);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(75, 61, 53, 0.10);
      color: #4b3d35;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-card h2 {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 500;
      color: #4b3d35;
    }

    .modal-card p {
      margin: 0;
      line-height: 1.8;
      color: rgba(75, 61, 53, 0.75);
      font-size: 15px;
    }

    .empty-text {
      color: rgba(75, 61, 53, 0.46);
      font-size: 14px;
    }

    .photo-block { margin-bottom: 26px; }

    .photo-block h3 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 500;
      color: #4b3d35;
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .gallery-photo {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(120, 95, 70, 0.08);
      border: 1px solid rgba(134, 103, 75, 0.16);
      cursor: zoom-in;
    }

    .gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gift-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gift-buttons button,
    .message-box button {
      border: none;
      background: #715843;
      color: #fffaf5;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .animal-status {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 18px;
      background: rgba(118, 91, 66, 0.08);
      color: rgba(75, 61, 53, 0.66);
      font-size: 13px;
      line-height: 1.6;
    }

    .placed-items {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 28px;
    }

    .placed-item-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(113, 88, 67, 0.10);
      color: rgba(75, 61, 53, 0.72);
      font-size: 13px;
    }

    .message-box textarea {
      width: 100%;
      height: 108px;
      border: 1px solid rgba(134, 103, 75, 0.22);
      background: rgba(255,255,255,0.72);
      color: #4b3d35;
      padding: 14px;
      border-radius: 18px;
      font-size: 14px;
      resize: none;
    }

    .message-list { margin-top: 14px; }

    .message-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(134, 103, 75, 0.14);
      color: rgba(75, 61, 53, 0.72);
      line-height: 1.6;
      font-size: 14px;
    }

    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5, 7, 8, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .photo-lightbox.show { display: flex; }

    .photo-lightbox img {
      max-width: min(92vw, 1100px);
      max-height: 86vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 26px 80px rgba(0,0,0,0.55);
    }

    .lightbox-close {
      position: fixed;
      top: 22px;
      right: 24px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.32);
      background: rgba(255,255,255,0.10);
      color: #fffaf5;
      border-radius: 50%;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 210;
    }

    @media (max-width: 760px) {
      .memorial-header {
        padding: 22px 16px 0;
        align-items: flex-start;
      }

      .header-actions {
        flex-direction: column;
        align-items: flex-end;
      }

      .stone-scene-wrap {
        width: min(90vw, 360px);
        height: min(56vh, 440px);
        transform: translateY(56px);
      }

      .bottom-dock {
        width: calc(100vw - 24px);
        justify-content: center;
        flex-wrap: wrap;
        border-radius: 28px;
        bottom: 18px;
      }

      .photo-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="page-bg"></div>

  <div class="page-shell">
    <header class="memorial-header">
      <a href="index.html" class="memorial-logo" data-key="logo">Starlit Pet Memorial Garden</a>

      <div class="header-actions">
        <a href="create.html" class="soft-button" data-key="editBtn">Edit Info</a>
        <a href="select-stone.html" class="soft-button" data-key="changeStoneBtn">Change Stone</a>

        <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="th">ไทย</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>

    <main class="main-stage">
      <div class="stone-scene-wrap">
        <div id="stoneScene"></div>
      </div>
    </main>
  </div>

  <div class="bottom-dock">
    <button class="bottom-button" onclick="openPanel('storyPanel')" data-key="storyBtn">Story</button>
    <button class="bottom-button" onclick="openPanel('photosPanel')" data-key="photosBtn">Photos</button>
    <button class="bottom-button" onclick="openPanel('giftPanel')" data-key="giftBtn">Gift</button>
    <button class="bottom-button" onclick="openPanel('messagePanel')" data-key="messageBtnShort">Messages</button>
  </div>

  <div class="modal-layer" id="storyPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="storyTitle">Pet Story</h2>
      <p id="petStoryDisplay" class="empty-text">No story has been written yet.</p>
    </div>
  </div>

  <div class="modal-layer" id="photosPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="photosTitle">Memory Photos</h2>

      <div class="photo-block">
        <h3 data-key="publicPhotosTitle">Public Memory Photos</h3>
        <div id="publicPhotosDisplay" class="photo-gallery"></div>
      </div>

      <div class="photo-block">
        <h3 data-key="privatePhotosTitle">Private Memory Photos</h3>
        <p class="empty-text" style="margin-bottom:12px;" data-key="privatePhotosDesc">
          These photos are currently shown only in your browser demo.
        </p>
        <div id="privatePhotosDisplay" class="photo-gallery"></div>
      </div>
    </div>
  </div>

  <div class="modal-layer" id="giftPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="giftTitle">Offer a small gift</h2>

      <div class="gift-buttons">
        <button onclick="placeGift('can')" data-key="giftCan">Place a can</button>
        <button onclick="placeGift('ball')" data-key="giftBall">Place a ball</button>
        <button onclick="placeGift('seed')" data-key="giftSeed">Place seeds</button>
        <button onclick="placeGift('flower')" data-key="giftFlower">Place flowers</button>
      </div>

      <div class="animal-status" id="animalStatus" data-key="animalStatus">
        Quiet gifts may bring gentle visitors.
      </div>

      <div class="placed-items" id="placedItemsList"></div>
    </div>
  </div>

  <div class="modal-layer" id="messagePanel" onclick="closePanels(event)">
    <div class="modal-card message-box">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="messageTitle">Leave a message</h2>
      <textarea id="messageInput" data-placeholder-key="messagePlaceholder" placeholder="Write a few quiet words..."></textarea>
      <br /><br />
      <button onclick="addMessage()" data-key="messageSendBtn">Leave message</button>
      <div id="messageList" class="message-list"></div>
    </div>
  </div>

  <div class="photo-lightbox" id="photoLightbox" onclick="closePhotoLightbox()">
    <button class="lightbox-close" onclick="closePhotoLightbox()">×</button>
    <img id="lightboxImage" src="" alt="" />
  </div>

    ["ko", "es", "fr", "de", "pt", "it", "th", "vi", "id", "ms", "hi", "ar"].forEach(function(lang) {
      translations[lang] = translations.en;
    });

    function getText() {
      return translations[currentLang] || translations.en;
    }

    function getMemorialData() {
      try {
        return JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
      } catch (error) {
        return {};
      }
    }

    function normalizeStyle(style) {
      if (style === "square") return "square";
      if (style === "arch") return "arch";
      return "rounded";
    }

    function changeLanguage(lang) {
      currentLang = translations[lang] ? lang : "en";
      localStorage.setItem("siteLanguage", currentLang);
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      const select = document.getElementById("languageSelect");
      if (select) select.value = currentLang;

      const text = getText();

      document.querySelectorAll("[data-key]").forEach(function(el) {
        const key = el.getAttribute("data-key");
        if (text[key]) el.textContent = text[key];
      });

      document.querySelectorAll("[data-placeholder-key]").forEach(function(el) {
        const key = el.getAttribute("data-placeholder-key");
        if (text[key]) el.placeholder = text[key];
      });

      rebuildTextTexture();
      loadExtraMemorialInfo();
      renderPlacedItems();
    }

    function createStoneTexture(baseColor) {
      const canvas = document.createElement("canvas");
      canvas.width = 768;
      canvas.height = 768;
      const ctx = canvas.getContext("2d");

      // 冷灰石材底色，不再是死黑色
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const vertical = ctx.createLinearGradient(0, 0, 0, canvas.height);
      vertical.addColorStop(0, "rgba(255, 255, 255, 0.075)");
      vertical.addColorStop(0.42, "rgba(255, 255, 255, 0.018)");
      vertical.addColorStop(1, "rgba(0, 0, 0, 0.105)");
      ctx.fillStyle = vertical;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const side = ctx.createLinearGradient(0, 0, canvas.width, 0);
      side.addColorStop(0, "rgba(0, 0, 0, 0.085)");
      side.addColorStop(0.48, "rgba(255, 255, 255, 0.035)");
      side.addColorStop(1, "rgba(0, 0, 0, 0.055)");
      ctx.fillStyle = side;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 细颗粒：模拟花岗岩点状纹理
      for (let i = 0; i < 5200; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const size = Math.random() * 1.35 + 0.28;
        const light = Math.random() > 0.52 ? 255 : 0;
        const a = Math.random() * 0.055 + 0.012;
        ctx.fillStyle = "rgba(" + light + "," + light + "," + light + "," + a + ")";
        ctx.fillRect(x, y, size, size);
      }

      // 长石纹：低对比，不像贴图脏污
      for (let i = 0; i < 58; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const len = Math.random() * 260 + 80;
        const alpha = Math.random() * 0.030 + 0.010;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((Math.random() - 0.5) * 0.55);
        ctx.strokeStyle = "rgba(230, 236, 232," + alpha + ")";
        ctx.lineWidth = Math.random() * 1.2 + 0.35;
        ctx.beginPath();
        ctx.moveTo(-len / 2, 0);
        ctx.bezierCurveTo(-len * 0.18, Math.random() * 14 - 7, len * 0.18, Math.random() * 14 - 7, len / 2, 0);
        ctx.stroke();
        ctx.restore();
      }

      // 少量暗裂纹，不能太明显
      for (let i = 0; i < 10; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const len = Math.random() * 95 + 32;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((Math.random() - 0.5) * 1.2);
        ctx.strokeStyle = "rgba(25, 28, 28, 0.055)";
        ctx.lineWidth = Math.random() * 0.9 + 0.35;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.35, Math.random() * 18 - 9, len, Math.random() * 22 - 11);
        ctx.stroke();
        ctx.restore();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1.0, 1.0);

      if (THREE.SRGBColorSpace) texture.colorSpace = THREE.SRGBColorSpace;

      return texture;
    }

    function createStoneMaterial() {
      const texture = createStoneTexture("#898d89");
      return new THREE.MeshStandardMaterial({
        color: 0xa4a7a1,
        map: texture,
        roughness: 0.96,
        metalness: 0,
        bumpMap: texture,
        bumpScale: 0.030,
        emissive: 0x171a1a,
        emissiveIntensity: 0.13
      });
    }

    function createBaseMaterial() {
      const texture = createStoneTexture("#747873");
      return new THREE.MeshStandardMaterial({
        color: 0x888b85,
        map: texture,
        roughness: 0.98,
        metalness: 0,
        bumpMap: texture,
        bumpScale: 0.026,
        emissive: 0x121514,
        emissiveIntensity: 0.10
      });
    }

    function buildRoundedShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.14, -1.72);
      s.lineTo(-1.14, 0.58);
      s.bezierCurveTo(-1.14, 1.32, -0.68, 1.66, 0, 1.66);
      s.bezierCurveTo(0.68, 1.66, 1.14, 1.32, 1.14, 0.58);
      s.lineTo(1.14, -1.72);
      s.closePath();
      return s;
    }

    function buildSquareShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.20, -1.72);
      s.lineTo(-1.20, 1.34);
      s.quadraticCurveTo(-1.20, 1.64, -0.90, 1.64);
      s.lineTo(0.90, 1.64);
      s.quadraticCurveTo(1.20, 1.64, 1.20, 1.34);
      s.lineTo(1.20, -1.72);
      s.closePath();
      return s;
    }

    function buildArchShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.18, -1.75);
      s.lineTo(-1.18, 0.38);
      s.bezierCurveTo(-1.18, 1.34, -0.64, 1.78, 0, 1.78);
      s.bezierCurveTo(0.64, 1.78, 1.18, 1.34, 1.18, 0.38);
      s.lineTo(1.18, -1.75);
      s.closePath();
      return s;
    }

    function buildTombstoneShape(style) {
      const normalized = normalizeStyle(style);
      if (normalized === "square") return buildSquareShape();
      if (normalized === "arch") return buildArchShape();
      return buildRoundedShape();
    }

    function normalizeEngravingData(data) {
      const text = getText();
      const memorial = data || {};

      const name =
        memorial.name ||
        memorial.petName ||
        memorial.pet ||
        text.defaultName ||
        "豆豆";

      const birth =
        memorial.birthDate ||
        memorial.birth ||
        memorial.startDate ||
        "";

      const death =
        memorial.deathDate ||
        memorial.leaveDate ||
        memorial.passDate ||
        memorial.leave ||
        memorial.endDate ||
        "";

      const epitaph =
        memorial.epitaph ||
        memorial.memory ||
        memorial.words ||
        memorial.message ||
        text.defaultWords ||
        "谢谢你陪我走过这段人生";

      let dateText = "";
      if (birth && death) {
        dateText = birth + " - " + death;
      } else if (birth || death) {
        dateText = birth || death;
      } else {
        dateText = "2015.08.20 - 2026.05.12";
      }

      return {
        name: String(name).trim(),
        dateText: String(dateText).trim(),
        epitaph: String(epitaph).trim()
      };
    }

    function drawSoftEngravingPanel(ctx) {
      // 只做极轻微的压暗区域，避免像一张透明贴纸
      const gradient = ctx.createRadialGradient(512, 455, 70, 512, 455, 390);
      gradient.addColorStop(0, "rgba(0, 0, 0, 0.020)");
      gradient.addColorStop(0.58, "rgba(0, 0, 0, 0.010)");
      gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(160, 170, 704, 640);
    }

    function drawEngravedLine(ctx, options) {
      ctx.save();

      ctx.font = options.font;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // 先画一层柔和暗痕，让字像压进石头
      ctx.save();
      ctx.globalAlpha = 0.46;
      ctx.filter = "blur(0.65px)";
      ctx.fillStyle = options.shadowColor;
      ctx.fillText(options.text, options.x + 1.45, options.y + 1.65);
      ctx.restore();

      // 左上高光，模拟刻痕边缘受光
      ctx.fillStyle = options.highlightColor;
      ctx.fillText(options.text, options.x - 0.95, options.y - 1.05);

      // 主刻痕：冷灰，不用白色
      ctx.fillStyle = options.mainColor;
      ctx.fillText(options.text, options.x, options.y);

      // 很浅的二次暗压，不让字浮在表面
      ctx.globalAlpha = 0.20;
      ctx.fillStyle = "rgba(0, 0, 0, 0.30)";
      ctx.fillText(options.text, options.x + 0.50, options.y + 0.70);

      ctx.restore();
    }

    function wrapTextToLines(ctx, text, maxWidth, maxLines, font) {
      ctx.save();
      ctx.font = font;

      const value = String(text || "").trim();
      if (!value) {
        ctx.restore();
        return [];
      }

      const lines = [];
      const hasSpace = /\s/.test(value);
      const units = hasSpace ? value.split(/\s+/) : value.split("");
      let current = "";

      for (let i = 0; i < units.length; i++) {
        const unit = units[i];
        const test = hasSpace ? (current ? current + " " + unit : unit) : current + unit;

        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = unit;
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);

      const finalLines = lines.slice(0, maxLines);

      if (lines.length > maxLines && finalLines.length) {
        let last = finalLines[finalLines.length - 1];
        while (ctx.measureText(last + "…").width > maxWidth && last.length > 0) {
          last = last.slice(0, -1);
        }
        finalLines[finalLines.length - 1] = last + "…";
      }

      ctx.restore();
      return finalLines;
    }

    function applyTextWear(ctx, width, height, amount) {
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;

      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];

        if (alpha > 12) {
          const random = Math.random();

          if (random < amount) {
            data[i + 3] = Math.floor(alpha * 0.42);
          } else if (random < amount * 2.15) {
            data[i + 3] = Math.floor(alpha * 0.76);
          }

          // 让文字颜色轻微不均匀，像石头吃进去的刻痕
          if (Math.random() < ENGRAVING_CONFIG.grainAmount) {
            data[i] = Math.max(0, data[i] - 10);
            data[i + 1] = Math.max(0, data[i + 1] - 10);
            data[i + 2] = Math.max(0, data[i + 2] - 10);
          }
        }
      }

      ctx.putImageData(image, 0, 0);

      // 轻微横向划痕，破坏“电脑字”的完美边缘
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      for (let i = 0; i < 24; i++) {
        const x = 250 + Math.random() * 520;
        const y = 250 + Math.random() * 420;
        const w = Math.random() * 85 + 18;
        ctx.globalAlpha = Math.random() * 0.040 + 0.012;
        ctx.fillRect(x, y, w, 1);
      }
      ctx.restore();
    }

    function updateEngravingTexture(data) {
      const config = ENGRAVING_CONFIG;
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const safeData = normalizeEngravingData(data);
      const fontStack = "'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Noto Sans JP', 'Hiragino Sans', Arial, sans-serif";

      drawSoftEngravingPanel(ctx);

      drawEngravedLine(ctx, {
        text: safeData.name,
        x: 512,
        y: config.nameY,
        font: "600 " + config.nameSize + "px " + fontStack,
        mainColor: config.mainColor,
        shadowColor: config.shadowColor,
        highlightColor: config.highlightColor
      });

      drawEngravedLine(ctx, {
        text: safeData.dateText,
        x: 512,
        y: config.dateY,
        font: "400 " + config.dateSize + "px " + fontStack,
        mainColor: config.dateColor,
        shadowColor: "rgba(3, 5, 6, 0.16)",
        highlightColor: "rgba(220, 230, 226, 0.08)"
      });

      const epitaphFont = "400 " + config.epitaphSize + "px " + fontStack;
      const epitaphLines = wrapTextToLines(
        ctx,
        safeData.epitaph,
        config.epitaphMaxWidth,
        config.maxEpitaphLines,
        epitaphFont
      );

      epitaphLines.forEach(function(line, index) {
        drawEngravedLine(ctx, {
          text: line,
          x: 512,
          y: config.epitaphStartY + index * config.epitaphLineHeight,
          font: epitaphFont,
          mainColor: config.epitaphColor,
          shadowColor: "rgba(3, 5, 6, 0.14)",
          highlightColor: "rgba(220, 230, 226, 0.075)"
        });
      });

      applyTextWear(ctx, canvas.width, canvas.height, config.wearAmount);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      if (THREE.SRGBColorSpace) {
        texture.colorSpace = THREE.SRGBColorSpace;
      }
      return texture;
    }

    function createTextTexture(memorial) {
      return updateEngravingTexture(memorial || getMemorialData());
    }

    function makeShadowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createRadialGradient(256, 256, 12, 256, 256, 215);
      gradient.addColorStop(0, "rgba(0,0,0,0.42)");
      gradient.addColorStop(0.45, "rgba(0,0,0,0.22)");
      gradient.addColorStop(0.72, "rgba(0,0,0,0.07)");
      gradient.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createStoneGroup(style) {
      const group = new THREE.Group();
      const rotator = new THREE.Group();
      const shape = buildTombstoneShape(style);

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.42,
        bevelEnabled: true,
        bevelThickness: 0.050,
        bevelSize: 0.050,
        bevelSegments: 12,
        curveSegments: 72
      });

      geometry.center();
      geometry.computeVertexNormals();

      const stoneMesh = new THREE.Mesh(geometry, createStoneMaterial());
      stoneMesh.position.y = 0.30;
      rotator.add(stoneMesh);

      const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(3.24, 0.34, 1.02), createBaseMaterial());
      baseMesh.position.set(0, -1.78, -0.02);
      rotator.add(baseMesh);

      const lipMesh = new THREE.Mesh(new THREE.BoxGeometry(2.88, 0.15, 0.86), createBaseMaterial());
      lipMesh.position.set(0, -1.49, 0.02);
      rotator.add(lipMesh);

      const textTexture = createTextTexture(getMemorialData());
      const textMat = new THREE.MeshBasicMaterial({
        map: textTexture,
        transparent: true,
        depthWrite: false,
        depthTest: true,
        opacity: ENGRAVING_CONFIG.opacity
      });

      textMat.polygonOffset = true;
      textMat.polygonOffsetFactor = -1;
      textMat.polygonOffsetUnits = -1;

      textPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(ENGRAVING_CONFIG.planeWidth, ENGRAVING_CONFIG.planeHeight),
        textMat
      );

      textPlane.position.set(
        ENGRAVING_CONFIG.positionX,
        ENGRAVING_CONFIG.positionY,
        ENGRAVING_CONFIG.positionZ
      );
      textPlane.renderOrder = 3;
      rotator.add(textPlane);

      rotator.rotation.y = FINAL_ANGLE;
      group.add(rotator);

      const shadowMat = new THREE.MeshBasicMaterial({
        map: makeShadowTexture(),
        transparent: true,
        depthWrite: false,
        opacity: 0.86
      });

      const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.80, 1.18), shadowMat);
      shadow.position.set(0, -1.95, -0.50);
      group.add(shadow);

      group.scale.set(FINAL_SCALE, FINAL_SCALE, FINAL_SCALE);
      group.position.y = FINAL_Y;

      group.userData.parts = {
        rotator: rotator,
        stoneMesh: stoneMesh,
        baseMesh: baseMesh,
        lipMesh: lipMesh,
        textPlane: textPlane
      };

      return group;
    }

    function initStoneScene() {
      const container = document.getElementById("stoneScene");
      if (!container || !window.THREE) return;

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        30,
        container.clientWidth / container.clientHeight,
        0.1,
        100
      );
      camera.position.set(0, 0.08, 7.7);

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      if (THREE.SRGBColorSpace) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      }

      container.innerHTML = "";
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xd7d6d0, 0.82));

      const hemi = new THREE.HemisphereLight(0xb9c9f0, 0x3b2e24, 0.82);
      scene.add(hemi);

      const moonLight = new THREE.DirectionalLight(0xcbd8ff, 1.08);
      moonLight.position.set(-5.1, 7.8, 5.7);
      scene.add(moonLight);

      const warmRight = new THREE.PointLight(0xffc98b, 0.82, 18, 2);
      warmRight.position.set(2.8, -1.0, 5.0);
      scene.add(warmRight);

      const warmLeft = new THREE.PointLight(0xffd29a, 0.34, 14, 2);
      warmLeft.position.set(-3.1, -1.2, 4.6);
      scene.add(warmLeft);

      buildStoneFromSavedData();
      renderScene();
      window.addEventListener("resize", resizeStoneScene);
    }

    function buildStoneFromSavedData() {
      if (!scene) return;

      if (stoneGroup) {
        scene.remove(stoneGroup);
      }

      textPlane = null;
      const data = getMemorialData();
      stoneGroup = createStoneGroup(normalizeStyle(data.tombstoneStyle || "rounded"));
      scene.add(stoneGroup);
      renderScene();
    }

    function renderScene() {
      if (!renderer || !scene || !camera) return;
      renderer.render(scene, camera);
    }

    function resizeStoneScene() {
      const container = document.getElementById("stoneScene");
      if (!container || !renderer || !camera) return;

      renderer.setSize(container.clientWidth, container.clientHeight);
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderScene();
    }

    function rebuildTextTexture() {
      if (!textPlane || !textPlane.material) return;

      const texture = updateEngravingTexture(getMemorialData());

      if (textPlane.material.map) {
        textPlane.material.map.dispose();
      }

      textPlane.material.map = texture;
      textPlane.material.needsUpdate = true;
      renderScene();
    }

    function openPanel(id) {
      closeAllPanels();
      const panel = document.getElementById(id);
      if (panel) panel.classList.add("show");
    }

    function closeAllPanels() {
      document.querySelectorAll(".modal-layer").forEach(function(panel) {
        panel.classList.remove("show");
      });
    }

    function closePanels(event) {
      if (event.target.classList.contains("modal-layer")) {
        closeAllPanels();
      }
    }

    function showPhotos(containerId, photos) {
      const container = document.getElementById(containerId);
      const text = getText();
      if (!container) return;

      container.innerHTML = "";

      if (!photos || photos.length === 0) {
        container.innerHTML = '<p class="empty-text">' + text.noPhotos + '</p>';
        return;
      }

      photos.forEach(function(photo) {
        const box = document.createElement("div");
        box.className = "gallery-photo";
        box.onclick = function() { openPhotoLightbox(photo); };

        const img = document.createElement("img");
        img.src = photo;

        box.appendChild(img);
        container.appendChild(box);
      });
    }

    function openPhotoLightbox(src) {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      image.src = src;
      lightbox.classList.add("show");
    }

    function closePhotoLightbox() {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      lightbox.classList.remove("show");
      image.src = "";
    }

    function loadExtraMemorialInfo() {
      const data = getMemorialData();
      const text = getText();
      const storyDisplay = document.getElementById("petStoryDisplay");

      if (storyDisplay) {
        if (data.story) {
          storyDisplay.textContent = data.story;
          storyDisplay.classList.remove("empty-text");
        } else {
          storyDisplay.textContent = text.noStory;
          storyDisplay.classList.add("empty-text");
        }
      }

      const publicPhotos = data.publicPhotos && data.publicPhotos.length ? data.publicPhotos : (data.photo ? [data.photo] : []);
      const privatePhotos = data.privatePhotos || [];

      showPhotos("publicPhotosDisplay", publicPhotos);
      showPhotos("privatePhotosDisplay", privatePhotos);
      renderMessages();
    }

    function getMessages() {
      try {
        return JSON.parse(localStorage.getItem("memorialMessages") || "[]");
      } catch (error) {
        return [];
      }
    }

    function renderMessages() {
      const list = document.getElementById("messageList");
      const text = getText();
      if (!list) return;

      const messages = getMessages();
      list.innerHTML = "";

      if (!messages.length) {
        list.innerHTML = '<div class="message-item empty-text">' + text.noMessages + '</div>';
        return;
      }

      messages.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "message-item";
        div.textContent = item;
        list.appendChild(div);
      });
    }

    function addMessage() {
      const input = document.getElementById("messageInput");
      if (!input) return;

      const value = input.value.trim();
      if (!value) return;

      const messages = getMessages();
      messages.unshift(value);
      localStorage.setItem("memorialMessages", JSON.stringify(messages.slice(0, 20)));

      input.value = "";
      renderMessages();
    }

    function getPlacedItems() {
      try {
        return JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]");
      } catch (error) {
        return [];
      }
    }

    function renderPlacedItems() {
      const box = document.getElementById("placedItemsList");
      const text = getText();
      if (!box) return;

      const items = getPlacedItems();
      box.innerHTML = "";

      items.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "placed-item-badge";

        if (item === "can") div.textContent = "🥫 " + text.placedCan;
        if (item === "ball") div.textContent = "🎾 " + text.placedBall;
        if (item === "seed") div.textContent = "🌾 " + text.placedSeed;
        if (item === "flower") div.textContent = "🌸 " + text.placedFlower;

        box.appendChild(div);
      });
    }

    function placeGift(type) {
      const items = getPlacedItems();
      items.unshift(type);
      localStorage.setItem("memorialPlacedItems", JSON.stringify(items.slice(0, 8)));
      renderPlacedItems();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePhotoLightbox();
        closeAllPanels();
      }
    });

    window.addEventListener("storage", function(event) {
      if (event.key === "myPetMemorial") {
        buildStoneFromSavedData();
        loadExtraMemorialInfo();
      }
    });

    window.addEventListener("DOMContentLoaded", function() {
      initStoneScene();

      const savedLanguage = localStorage.getItem("siteLanguage") || "en";
      changeLanguage(savedLanguage);

      loadExtraMemorialInfo();
      renderPlacedItems();
    });
  </script>
</body>
