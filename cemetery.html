<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星眠宠物纪念园</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #fff;
      background: #08111f;
    }

    body {
      background:
        linear-gradient(rgba(5, 10, 18, 0.18), rgba(5, 10, 18, 0.34)),
        url("./cemetery-bg.png") center center / cover no-repeat;
    }

    .page { position: relative; width: 100%; height: 100%; overflow: hidden; }

    .brand {
      position: absolute;
      top: 34px;
      left: 44px;
      z-index: 20;
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,.95);
      text-shadow: 0 2px 12px rgba(0,0,0,.35);
      text-decoration: none;
    }

    .top-actions {
      position: absolute;
      top: 30px;
      right: 42px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .glass-btn,
    .lang-select {
      height: 50px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(8,12,18,.68);
      color: rgba(255,255,255,.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.18);
      font-size: 15px;
      font-weight: 650;
    }

    .glass-btn {
      padding: 0 22px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .lang-select {
      min-width: 132px;
      padding: 0 18px;
      outline: none;
      cursor: pointer;
    }

    .lang-select option { color: #111; background: #fff; }

    #stageWrap {
      position: absolute;
      left: 50.2%;
      top: 63.2%;
      transform: translate(-50%, -50%) scale(0.50);
      transform-origin: 50% 50%;
      width: min(48vw, 860px);
      height: min(84vh, 880px);
      z-index: 9;
      pointer-events: none;
    }

    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #stage canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      pointer-events: none !important;
    }

    .loading-text {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      z-index: 12;
      color: rgba(255,255,255,.92);
      font-size: 18px;
      font-weight: 750;
      text-shadow: 0 4px 16px rgba(0,0,0,.30);
      white-space: nowrap;
      pointer-events: none;
    }

    .bottom-dock {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 999px;
      background: rgba(32, 32, 28, 0.54);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 16px 34px rgba(0,0,0,0.25);
    }

    .dock-btn {
      min-width: 72px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.95);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .dock-btn:hover { background: rgba(255,255,255,.15); }

    .panel {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.58);
    }

    .panel.show { display: flex; }

    .panel-card {
      position: relative;
      width: min(760px, 92vw);
      max-height: 82vh;
      overflow: auto;
      padding: 30px;
      border-radius: 28px;
      background: rgba(255,250,245,.96);
      color: #42362f;
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }

    .panel-card h2 { margin: 0 0 16px; font-size: 25px; }
    .panel-card p { margin: 0; line-height: 1.8; color: rgba(66,54,47,.78); }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 999px;
      background: rgba(66,54,47,.10);
      color: #42362f;
      font-size: 26px;
      cursor: pointer;
    }

    .empty-text {
      color: rgba(66,54,47,.48);
      font-size: 14px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .photo-item {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(66,54,47,.08);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .message-input {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border-radius: 18px;
      border: 1px solid rgba(66,54,47,.18);
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      color: #42362f;
      background: rgba(255,255,255,.64);
    }

    .modal-action {
      margin-top: 14px;
      height: 44px;
      padding: 0 22px;
      border: none;
      border-radius: 999px;
      background: #6d5a4d;
      color: #fffaf5;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }

    .message-list {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .message-item {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(66,54,47,.07);
      color: rgba(66,54,47,.76);
      line-height: 1.7;
      font-size: 14px;
    }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .gift-item {
      height: 92px;
      border: 1px solid rgba(66,54,47,.12);
      border-radius: 20px;
      background: rgba(66,54,47,.06);
      cursor: pointer;
      font-size: 28px;
      color: #42362f;
    }

    .gift-item span {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: rgba(66,54,47,.62);
    }

    .placed-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .placed-item-badge {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(66,54,47,.08);
      color: rgba(66,54,47,.70);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .brand { top: 16px; left: 16px; font-size: 16px; }
      .top-actions { top: 14px; right: 14px; gap: 8px; }
      .glass-btn, .lang-select { height: 44px; font-size: 14px; }
      #stageWrap {
        left: 50%;
        top: 55%;
        width: 86vw;
        height: 58vh;
        transform: translate(-50%, -50%) scale(0.82);
      }
      .bottom-dock { bottom: 16px; gap: 7px; padding: 8px; }
      .dock-btn { min-width: 60px; height: 42px; padding: 0 12px; font-size: 14px; }
      .photo-grid, .gift-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>
  <div class="page">
    <a href="index.html" class="brand" id="brandText">星眠宠物纪念园</a>

    <div class="top-actions">
      <a href="create.html" class="glass-btn" id="editBtn">编辑</a>
      <a href="select-stone.html" class="glass-btn" id="changeStoneBtn">更换墓碑</a>
      <select class="lang-select" id="languageSelect">
        <option value="zh">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>

    <div id="stageWrap">
      <div id="stage"></div>
      <div class="loading-text" id="stageLoading">正在加载纪念碑...</div>
    </div>

    <div class="bottom-dock">
      <button class="dock-btn" onclick="openPanel('storyPanel')" id="storyBtn">故事</button>
      <button class="dock-btn" onclick="openPanel('photosPanel')" id="photosBtn">相册</button>
      <button class="dock-btn" onclick="openPanel('giftPanel')" id="giftBtn">礼物</button>
      <button class="dock-btn" onclick="openPanel('messagePanel')" id="messageBtn">留言</button>
    </div>
  </div>

  <div class="panel" id="storyPanel" onclick="panelBackdrop(event)">
    <div class="panel-card">
      <button class="close-btn" onclick="closePanels()">×</button>
      <h2 id="storyTitle">宠物故事</h2>
      <p id="storyText" class="empty-text">还没有写下故事。</p>
    </div>
  </div>

  <div class="panel" id="photosPanel" onclick="panelBackdrop(event)">
    <div class="panel-card">
      <button class="close-btn" onclick="closePanels()">×</button>
      <h2 id="photosTitle">记忆相册</h2>
      <div id="photosGrid" class="photo-grid"></div>
    </div>
  </div>

  <div class="panel" id="giftPanel" onclick="panelBackdrop(event)">
    <div class="panel-card">
      <button class="close-btn" onclick="closePanels()">×</button>
      <h2 id="giftTitle">献上一份小礼物</h2>
      <p id="giftDesc">选择一个小物件，轻轻放在墓碑旁。</p>
      <div class="gift-grid">
        <button class="gift-item" onclick="placeGift('can')">🥫<span id="giftCan">罐头</span></button>
        <button class="gift-item" onclick="placeGift('ball')">🎾<span id="giftBall">小球</span></button>
        <button class="gift-item" onclick="placeGift('flower')">🌸<span id="giftFlower">花</span></button>
      </div>
      <div id="placedItems" class="placed-items"></div>
    </div>
  </div>

  <div class="panel" id="messagePanel" onclick="panelBackdrop(event)">
    <div class="panel-card">
      <button class="close-btn" onclick="closePanels()">×</button>
      <h2 id="messageTitle">留言</h2>
      <textarea id="messageInput" class="message-input" placeholder="写下一句话..."></textarea>
      <button class="modal-action" onclick="addMessage()" id="sendMessageBtn">留下留言</button>
      <div id="messageList" class="message-list"></div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>

      };

          storyTitle: "寵物故事",
          photosTitle: "記憶相冊",
          giftTitle: "獻上一份小禮物",
          giftDesc: "選擇一個小物件，輕輕放在墓碑旁。",
          giftCan: "罐頭",
          giftBall: "小球",
          giftFlower: "花",
          messageTitle: "留言",
          placeholder: "寫下一句話...",
          send: "留下留言",
          noStory: "還沒有寫下故事。",
          noPhotos: "還沒有上傳照片。",
          noMessages: "還沒有留言。"
        },
        en: {
          brand: "Starlit Pet Memorial Garden",
          edit: "Edit",
          change: "Change Stone",
          loading: "Loading memorial...",
          story: "Story",
          photos: "Photos",
          gift: "Gift",
          message: "Messages",
          storyTitle: "Pet Story",
          photosTitle: "Memory Photos",
          giftTitle: "Leave a Small Gift",
          giftDesc: "Choose a small item and place it gently beside the stone.",
          giftCan: "Can",
          giftBall: "Ball",
          giftFlower: "Flower",
          messageTitle: "Messages",
          placeholder: "Write a message...",
          send: "Leave Message",
          noStory: "No story has been written yet.",
          noPhotos: "No photos have been uploaded yet.",
          noMessages: "No messages yet."
        },
        ja: {
          brand: "星眠ペット記念園",
          edit: "編集",
          change: "墓碑を変更",
          loading: "記念碑を読み込み中...",
          story: "物語",
          photos: "写真",
          gift: "贈り物",
          message: "メッセージ",
          storyTitle: "ペットの物語",
          photosTitle: "思い出の写真",
          giftTitle: "小さな贈り物を置く",
          giftDesc: "小さな品を選んで、墓碑のそばにそっと置きます。",
          giftCan: "缶詰",
          giftBall: "ボール",
          giftFlower: "花",
          messageTitle: "メッセージ",
          placeholder: "ひと言を書いてください...",
          send: "メッセージを残す",
          noStory: "まだ物語は書かれていません。",
          noPhotos: "写真はまだありません。",
          noMessages: "メッセージはまだありません。"
        }
      };

      let renderer, scene, camera, pivot, stoneRoot, engravingPlane, engravingTexture;
      const stageEl = document.getElementById("stage");
      const loadingEl = document.getElementById("stageLoading");

      function lang() {
        const saved = localStorage.getItem("siteLanguage") || "zh";
        if (saved === "zh-CN") return "zh";
        if (TEXTS[saved]) return saved;
        return "zh";
      }

      function t() { return TEXTS[lang()] || TEXTS.zh; }

      function getMemorialData() {
        try {
          const raw = JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
          return {
            name: raw.name || raw.petName || raw.pet_name || "豆豆",
            birthDate: raw.birthDate || raw.birth || raw.birthday || "2015.08.20",
            deathDate: raw.deathDate || raw.death || raw.passingDate || "2026.05.12",
            epitaph: raw.epitaph || raw.message || raw.words || raw.lastWords || "谢谢你陪我走过这段人生",
            story: raw.story || raw.petStory || "",
            photo: raw.photo || "",
            publicPhotos: raw.publicPhotos || raw.photos || [],
            privatePhotos: raw.privatePhotos || []
          };
        } catch (error) {
          return {
            name: "豆豆",
            birthDate: "2015.08.20",
            deathDate: "2026.05.12",
            epitaph: "谢谢你陪我走过这段人生",
            story: "",
            photo: "",
            publicPhotos: [],
            privatePhotos: []
          };
        }
      }

      function formatDate(value) {
        return String(value || "").replace(/-/g, ".").replace(/\//g, ".");
      }

      function wrapText(ctx, text, maxWidth, maxLines) {
        const units = Array.from(String(text || ""));
        const lines = [];
        let line = "";
        for (let i = 0; i < units.length; i += 1) {
          const test = line + units[i];
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = units[i];
            if (lines.length >= maxLines - 1) break;
          } else {
            line = test;
          }
        }
        if (line && lines.length < maxLines) lines.push(line);
        if (lines.length === maxLines) {
          const all = units.join("");
          if (lines.join("").length < all.length) {
            let last = lines[lines.length - 1];
            while (last.length > 1 && ctx.measureText(last + "…").width > maxWidth) last = last.slice(0, -1);
            lines[lines.length - 1] = last + "…";
          }
        }
        return lines;
      }

      function drawEngravedMask(ctx, text, x, y, fontSize, weight) {
        if (!text) return;
        const fontFamily = '"Noto Serif CJK SC", "Noto Serif SC", "Microsoft YaHei", "PingFang SC", "Noto Sans JP", serif';
        ctx.save();
        ctx.font = weight + " " + fontSize + "px " + fontFamily;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255,255,255,0.86)";
        ctx.fillText(text, x, y);
        ctx.lineWidth = Math.max(2, fontSize * 0.035);
        ctx.strokeStyle = "rgba(255,255,255,0.30)";
        ctx.strokeText(text, x, y);

        const metric = ctx.measureText(text);
        const width = metric.width;
        const height = fontSize * 0.86;
        const wearCount = Math.max(10, Math.floor(fontSize * 0.12));
        ctx.globalCompositeOperation = "destination-out";
        for (let i = 0; i < wearCount; i += 1) {
          const rx = x - width / 2 + Math.random() * width;
          const ry = y - height / 2 + Math.random() * height;
          const r = 0.35 + Math.random() * 1.10;
          ctx.beginPath();
          ctx.arc(rx, ry, r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,0,0,0.040)";
          ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
        ctx.restore();
      }

      function createEngravingTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = ENGRAVE.canvasSize;
        canvas.height = ENGRAVE.canvasSize;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const data = getMemorialData();
        const cx = canvas.width / 2;
        const maxWidth = canvas.width * ENGRAVE.maxWidthRatio;
        const dateLine = (formatDate(data.birthDate) + " - " + formatDate(data.deathDate)).trim();

        drawEngravedMask(ctx, data.name, cx, ENGRAVE.nameY, ENGRAVE.nameSize, 700);
        drawEngravedMask(ctx, dateLine, cx, ENGRAVE.dateY, ENGRAVE.dateSize, 500);

        ctx.save();
        ctx.font = "600 " + ENGRAVE.epitaphSize + "px Microsoft YaHei";
        const lines = wrapText(ctx, data.epitaph, maxWidth, ENGRAVE.maxLines);
        ctx.restore();

        const startY = ENGRAVE.epitaphY - ((lines.length - 1) * ENGRAVE.lineGap) / 2;
        lines.forEach(function(line, index) {
          drawEngravedMask(ctx, line, cx, startY + index * ENGRAVE.lineGap, ENGRAVE.epitaphSize, 600);
        });

        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        tex.encoding = THREE.sRGBEncoding;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        return tex;
      }

      function createCarvedMaterial() {
        engravingTexture = createEngravingTexture();
        return new THREE.ShaderMaterial({
          uniforms: {
            map: { value: engravingTexture },
            texel: { value: new THREE.Vector2(1 / ENGRAVE.canvasSize, 1 / ENGRAVE.canvasSize) },
            opacityValue: { value: 0.78 }
          },
          vertexShader: [
            "varying vec2 vUv;",
            "void main() {",
            "  vUv = uv;",
            "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
            "}"
          ].join("\n"),
          fragmentShader: [
            "uniform sampler2D map;",
            "uniform vec2 texel;",
            "uniform float opacityValue;",
            "varying vec2 vUv;",
            "float hash(vec2 p) {",
            "  p = fract(p * vec2(123.34, 456.21));",
            "  p += dot(p, p + 45.32);",
            "  return fract(p.x * p.y);",
            "}",
            "void main() {",
            "  float a = texture2D(map, vUv).a;",
            "  if (a < 0.016) discard;",
            "  float l1 = texture2D(map, vUv - vec2(texel.x * 2.0, 0.0)).a;",
            "  float r1 = texture2D(map, vUv + vec2(texel.x * 2.0, 0.0)).a;",
            "  float u1 = texture2D(map, vUv + vec2(0.0, texel.y * 2.0)).a;",
            "  float d1 = texture2D(map, vUv - vec2(0.0, texel.y * 2.0)).a;",
            "  float l2 = texture2D(map, vUv - vec2(texel.x * 5.0, 0.0)).a;",
            "  float r2 = texture2D(map, vUv + vec2(texel.x * 5.0, 0.0)).a;",
            "  float u2 = texture2D(map, vUv + vec2(0.0, texel.y * 5.0)).a;",
            "  float d2 = texture2D(map, vUv - vec2(0.0, texel.y * 5.0)).a;",
            "  float edgeFine = abs(r1 - l1) + abs(u1 - d1);",
            "  float edgeWide = abs(r2 - l2) + abs(u2 - d2);",
            "  float bevelLight = clamp((l2 + u2 - r2 - d2) * 0.85 + edgeFine * 0.10, 0.0, 1.0);",
            "  float bevelDark = clamp((r2 + d2 - l2 - u2) * 0.95 + edgeFine * 0.18, 0.0, 1.0);",
            "  float grain1 = hash(floor(vUv * 380.0));",
            "  float grain2 = hash(floor(vUv * 910.0));",
            "  float wear = smoothstep(0.08, 0.92, grain1) * 0.16 + smoothstep(0.78, 1.0, grain2) * 0.18;",
            "  vec3 groove = vec3(0.135, 0.140, 0.135);",
            "  vec3 coldDust = vec3(0.300, 0.300, 0.275);",
            "  vec3 brightRim = vec3(0.610, 0.600, 0.540);",
            "  vec3 deepShadow = vec3(0.060, 0.065, 0.062);",
            "  vec3 color = mix(groove, coldDust, grain1 * 0.18);",
            "  color = mix(color, brightRim, bevelLight * 0.42);",
            "  color = mix(color, deepShadow, bevelDark * 0.54);",
            "  color *= 0.92 + grain2 * 0.12;",
            "  float inner = smoothstep(0.08, 0.82, a);",
            "  float edge = clamp(edgeFine * 1.8 + edgeWide * 0.7, 0.0, 1.0);",
            "  float alpha = (inner * 0.30 + edge * 0.36) * opacityValue;",
            "  alpha *= 1.0 - wear;",
            "  gl_FragColor = vec4(color, alpha);",
            "}"
          ].join("\n"),
          transparent: true,
          depthWrite: false,
          depthTest: false,
          side: THREE.DoubleSide
        });
      }

      function createScene() {
        if (!window.THREE || !THREE.GLTFLoader) {
          loadingEl.textContent = "Three.js 加载失败，请刷新页面。";
          return;
        }

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        camera.position.set(0, 1.45, 7.4);
        camera.lookAt(new THREE.Vector3(0, 1.10, 0));

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setClearColor(0x000000, 0);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        stageEl.innerHTML = "";
        stageEl.appendChild(renderer.domElement);

        pivot = new THREE.Group();
        scene.add(pivot);

        scene.add(new THREE.HemisphereLight(0xdce8ff, 0x2b211a, 1.20));
        scene.add(new THREE.AmbientLight(0xffffff, 0.72));

        const moon = new THREE.DirectionalLight(0xbfd6ff, 0.96);
        moon.position.set(-3.8, 5.8, 5.4);
        scene.add(moon);

        const warm = new THREE.DirectionalLight(0xffcf96, 1.08);
        warm.position.set(4.8, 2.4, 3.6);
        scene.add(warm);

        const fill = new THREE.DirectionalLight(0xe9eefc, 0.34);
        fill.position.set(0.0, 2.0, 5.8);
        scene.add(fill);

        resizeScene();
      }

      function resizeScene() {
        if (!renderer || !camera) return;
        const rect = stageEl.getBoundingClientRect();
        const w = Math.max(1, Math.floor(rect.width));
        const h = Math.max(1, Math.floor(rect.height));
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      function centerAndScaleModel(model) {
        model.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);
        model.position.x -= center.x;
        model.position.z -= center.z;
        model.position.y -= box.min.y;

        const scale = VIEW.targetHeight / Math.max(size.y, 0.0001);
        model.scale.setScalar(scale);
        model.updateMatrixWorld(true);
      }

      function tuneMaterial(root) {
        root.traverse(function(child) {
          if (!child.isMesh) return;
          child.castShadow = false;
          child.receiveShadow = false;
          if (!child.material) return;
          const arr = Array.isArray(child.material) ? child.material : [child.material];
          arr.forEach(function(mat) {
            if (mat.map) mat.map.encoding = THREE.sRGBEncoding;
            if (mat.color && mat.color.offsetHSL) mat.color.offsetHSL(0, -0.02, 0.04);
            if ("roughness" in mat) mat.roughness = 0.96;
            if ("metalness" in mat) mat.metalness = 0.02;
            mat.needsUpdate = true;
          });
        });
      }

      function attachEngraving() {
        if (engravingTexture) engravingTexture.dispose();
        const geometry = new THREE.PlaneGeometry(ENGRAVE.planeWidth, ENGRAVE.planeHeight);
        const material = createCarvedMaterial();
        engravingPlane = new THREE.Mesh(geometry, material);
        engravingPlane.renderOrder = 999;
        engravingPlane.position.set(ENGRAVE.planeX, ENGRAVE.planeY, ENGRAVE.planeZ);
        pivot.add(engravingPlane);
      }

      function loadModel() {
        const loader = new THREE.GLTFLoader();
        loader.load(
          MODEL_PATH,
          function(gltf) {
            stoneRoot = gltf.scene;
            tuneMaterial(stoneRoot);
            centerAndScaleModel(stoneRoot);
            pivot.add(stoneRoot);
            attachEngraving();
            pivot.position.set(VIEW.x, VIEW.y, VIEW.z);
            pivot.rotation.set(0, VIEW.rotY, 0);
            pivot.scale.setScalar(VIEW.scale);
            loadingEl.style.display = "none";
          },
          undefined,
          function(error) {
            console.error(error);
            loadingEl.textContent = "墓碑模型加载失败，请检查 assets/models/tombstone-real.glb";
          }
        );
      }

      function loop() {
        requestAnimationFrame(loop);
        if (renderer && scene && camera) renderer.render(scene, camera);
      }

      function applyLanguage() {
        const text = t();
        document.getElementById("brandText").textContent = text.brand;
        document.getElementById("editBtn").textContent = text.edit;
        document.getElementById("changeStoneBtn").textContent = text.change;
        document.getElementById("stageLoading").textContent = text.loading;
        document.getElementById("storyBtn").textContent = text.story;
        document.getElementById("photosBtn").textContent = text.photos;
        document.getElementById("giftBtn").textContent = text.gift;
        document.getElementById("messageBtn").textContent = text.message;
        document.getElementById("storyTitle").textContent = text.storyTitle;
        document.getElementById("photosTitle").textContent = text.photosTitle;
        document.getElementById("giftTitle").textContent = text.giftTitle;
        document.getElementById("giftDesc").textContent = text.giftDesc;
        document.getElementById("giftCan").textContent = text.giftCan;
        document.getElementById("giftBall").textContent = text.giftBall;
        document.getElementById("giftFlower").textContent = text.giftFlower;
        document.getElementById("messageTitle").textContent = text.messageTitle;
        document.getElementById("messageInput").placeholder = text.placeholder;
        document.getElementById("sendMessageBtn").textContent = text.send;
        document.getElementById("languageSelect").value = lang();
        loadPanelData();
      }

      window.changeLanguage = function(value) {
        localStorage.setItem("siteLanguage", value);
        applyLanguage();
      };

      window.openPanel = function(id) {
        closePanels();
        const panel = document.getElementById(id);
        if (panel) panel.classList.add("show");
        loadPanelData();
      };

      window.closePanels = function() {
        document.querySelectorAll(".panel").forEach(function(panel) {
          panel.classList.remove("show");
        });
      };

      window.panelBackdrop = function(event) {
        if (event.target.classList.contains("panel")) closePanels();
      };

      function getMessages() {
        try { return JSON.parse(localStorage.getItem("memorialMessages") || "[]"); }
        catch (error) { return []; }
      }

      window.addMessage = function() {
        const input = document.getElementById("messageInput");
        const value = input.value.trim();
        if (!value) return;
        const messages = getMessages();
        messages.unshift(value);
        localStorage.setItem("memorialMessages", JSON.stringify(messages.slice(0, 20)));
        input.value = "";
        renderMessages();
      };

      window.placeGift = function(type) {
        let items = [];
        try { items = JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]"); }
        catch (error) { items = []; }
        items.unshift(type);
        localStorage.setItem("memorialPlacedItems", JSON.stringify(items.slice(0, 8)));
        renderPlacedItems();
      };

      function renderMessages() {
        const box = document.getElementById("messageList");
        const text = t();
        const messages = getMessages();
        box.innerHTML = "";
        if (!messages.length) {
          box.innerHTML = '<div class="message-item empty-text">' + text.noMessages + '</div>';
          return;
        }
        messages.forEach(function(msg) {
          const div = document.createElement("div");
          div.className = "message-item";
          div.textContent = msg;
          box.appendChild(div);
        });
      }

      function renderPlacedItems() {
        const box = document.getElementById("placedItems");
        box.innerHTML = "";
        let items = [];
        try { items = JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]"); }
        catch (error) { items = []; }
        items.forEach(function(item) {
          const div = document.createElement("div");
          div.className = "placed-item-badge";
          if (item === "can") div.textContent = "🥫";
          if (item === "ball") div.textContent = "🎾";
          if (item === "flower") div.textContent = "🌸";
          box.appendChild(div);
        });
      }

      function loadPanelData() {
        const data = getMemorialData();
        const text = t();

        const story = document.getElementById("storyText");
        if (data.story) {
          story.textContent = data.story;
          story.classList.remove("empty-text");
        } else {
          story.textContent = text.noStory;
          story.classList.add("empty-text");
        }

        const photosBox = document.getElementById("photosGrid");
        photosBox.innerHTML = "";
        const photos = [];
        if (data.photo) photos.push(data.photo);
        if (Array.isArray(data.publicPhotos)) photos.push.apply(photos, data.publicPhotos);
        if (Array.isArray(data.privatePhotos)) photos.push.apply(photos, data.privatePhotos);

        if (!photos.length) {
          photosBox.innerHTML = '<p class="empty-text">' + text.noPhotos + '</p>';
        } else {
          photos.forEach(function(src) {
            const div = document.createElement("div");
            div.className = "photo-item";
            const img = document.createElement("img");
            img.src = src;
            div.appendChild(img);
            photosBox.appendChild(div);
          });
        }

        renderMessages();
        renderPlacedItems();
      }

      document.getElementById("languageSelect").addEventListener("change", function(event) {
        changeLanguage(event.target.value);
      });

      window.addEventListener("resize", resizeScene);
      document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") closePanels();
      });

      createScene();
      loadModel();
      applyLanguage();
      loop();
    })();
  </script>
</body>
</html>
