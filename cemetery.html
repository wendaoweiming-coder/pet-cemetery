<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纪念园 - 星眠宠物纪念园</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #fff;
      background: #08111f;
    }
    body {
      background:
        linear-gradient(rgba(5, 10, 18, 0.18), rgba(5, 10, 18, 0.34)),
        url("./cemetery-bg.png") center center / cover no-repeat;
    }
    .page { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .brand {
      position: absolute; top: 34px; left: 44px; z-index: 20;
      font-size: 18px; font-weight: 700; color: rgba(255,255,255,.95);
      text-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    .top-actions {
      position: absolute; top: 30px; right: 42px; z-index: 20;
      display: flex; align-items: center; gap: 12px;
    }
    .glass-btn, .lang-select {
      height: 50px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18);
      background: rgba(8,12,18,.68); color: rgba(255,255,255,.95);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.18);
      font-size: 15px; font-weight: 650;
    }
    .glass-btn { padding: 0 22px; cursor: pointer; }
    .lang-select { min-width: 132px; padding: 0 18px; outline: none; cursor: pointer; }
    .lang-select option { color: #111; background: #fff; }
    .hero-copy {
      position: absolute; top: 52px; left: 62%; transform: translateX(-50%); z-index: 14;
      width: min(620px, 44vw); text-align: center; pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
    }
    .hero-copy h1 {
      margin: 0; font-size: clamp(46px, 4.2vw, 76px); line-height: 1.05;
      font-weight: 900; letter-spacing: -0.035em; text-shadow: 0 8px 24px rgba(0,0,0,.26);
    }
    .hero-copy p {
      margin: 14px 0 0; font-size: 15px; line-height: 1.65; font-weight: 650;
      color: rgba(255,255,255,.90); text-shadow: 0 4px 16px rgba(0,0,0,.22);
    }
    .left-panel {
      position: absolute; left: 32px; top: 150px; width: 410px; z-index: 18;
      transition: opacity .35s ease, transform .35s ease;
    }
    .panel-title {
      margin: 0 0 8px; font-size: 34px; font-weight: 850;
      text-shadow: 0 6px 20px rgba(0,0,0,.28);
    }
    .panel-subtitle {
      margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.88);
      text-shadow: 0 4px 14px rgba(0,0,0,.22);
    }
    .stone-card {
      width: 100%; min-height: 132px; border-radius: 26px; padding: 24px 26px;
      display: flex; align-items: center; gap: 18px;
      background: rgba(5,10,16,.72); border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 16px 36px rgba(0,0,0,.24);
    }
    .stone-icon { width: 72px; height: 72px; display:flex; align-items:center; justify-content:center; flex: 0 0 auto; }
    .stone-icon svg { width: 56px; height: 56px; display:block; }
    .stone-name { font-size: 21px; font-weight: 850; margin-bottom: 8px; }
    .stone-desc { margin:0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.86); }
    .use-btn {
      width: 100%; height: 68px; margin-top: 24px; border: none; border-radius: 999px;
      color: #3f372f; font-size: 20px; font-weight: 850; cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(244,239,233,.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 12px 32px rgba(0,0,0,.20);
    }
    .use-btn:disabled { opacity: .62; cursor: not-allowed; }

    /* 关键：模型只在这个舞台里渲染，不再占满整个页面 */
    #stageWrap {
      position: absolute;
      left: 50.2%;
      top: 59.8%;
      transform: translate(-50%, -50%) scale(0.68);
      transform-origin: 50% 50%;
      width: min(48vw, 860px);
      height: min(84vh, 880px);
      z-index: 9;
      pointer-events: none;
    }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #stage canvas { width: 100% !important; height: 100% !important; display: block; pointer-events: none !important; }
    .loading-text {
      position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 12;
      color: rgba(255,255,255,.92); font-size: 18px; font-weight: 750;
      text-shadow: 0 4px 16px rgba(0,0,0,.30); white-space: nowrap; pointer-events: none;
    }

    body.final-placing .left-panel,
    body.final-placing .hero-copy,
    body.placed-mode .left-panel,
    body.placed-mode .hero-copy {
      opacity: 0;
      pointer-events: none;
    }

    body.final-placing .hero-copy,
    body.placed-mode .hero-copy {
      transform: translateX(-50%) translateY(-10px);
    }

    .final-dock {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(18px);
      z-index: 32;
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 999px;
      background: rgba(32, 32, 28, 0.54);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 16px 34px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
    }

    body.placed-mode .final-dock {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .final-dock button {
      min-width: 72px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.95);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .final-dock button:hover {
      background: rgba(255,255,255,.15);
    }

    .simple-panel {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.58);
    }

    .simple-panel.show { display: flex; }

    .simple-card {
      position: relative;
      width: min(720px, 92vw);
      max-height: 82vh;
      overflow: auto;
      padding: 30px;
      border-radius: 28px;
      background: rgba(255,250,245,.96);
      color: #42362f;
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }

    .simple-card h2 {
      margin: 0 0 16px;
      font-size: 25px;
    }

    .simple-card p {
      margin: 0;
      line-height: 1.8;
      color: rgba(66,54,47,.78);
    }

    .simple-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 999px;
      background: rgba(66,54,47,.10);
      color: #42362f;
      font-size: 26px;
      cursor: pointer;
    }

    .simple-input {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border-radius: 18px;
      border: 1px solid rgba(66,54,47,.18);
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      color: #42362f;
      background: rgba(255,255,255,.64);
    }

    .simple-action {
      margin-top: 14px;
      height: 44px;
      padding: 0 22px;
      border: none;
      border-radius: 999px;
      background: #6d5a4d;
      color: #fffaf5;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }

    .simple-list {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .simple-item {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(66,54,47,.07);
      color: rgba(66,54,47,.76);
      line-height: 1.7;
      font-size: 14px;
    }

    .simple-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .simple-photo {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(66,54,47,.08);
    }

    .simple-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 900px) {
      .brand { top: 16px; left: 16px; font-size: 16px; }
      .top-actions { top: 14px; right: 14px; gap: 8px; }
      .glass-btn, .lang-select { height: 44px; font-size: 14px; }
      .hero-copy { top: 76px; left: 50%; width: calc(100% - 36px); }
      .hero-copy h1 { font-size: 42px; }
      .hero-copy p { font-size: 14px; }
      .left-panel { top: auto; left: 16px; right: 16px; bottom: 18px; width: auto; }
      .panel-title { font-size: 26px; }
      .panel-subtitle { margin-bottom: 12px; font-size: 14px; }
      .stone-card { min-height: 110px; padding: 18px; border-radius: 22px; }
      .use-btn { height: 58px; margin-top: 14px; font-size: 18px; }
      #stageWrap { left: 50%; top: 42%; width: 86vw; height: 45vh; }
    }
  </style>
</head>
<body class="placed-mode">
  <div class="page">
    <div class="brand" id="brandText">星眠宠物纪念园</div>
    <div class="top-actions">
      <button class="glass-btn" id="backBtn">编辑</button>
      <button class="glass-btn" id="changeStoneBtn">更换墓碑</button>
      <select class="lang-select" id="languageSelect">
        <option value="zh">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>
    <div class="hero-copy">
      <h1 id="heroTitle">选择墓碑</h1>
      <p id="heroSubtitle">墓碑会慢慢转正，并安静地落到纪念园中。</p>
    </div>
    <div class="left-panel">
      <h2 class="panel-title" id="panelTitle">墓碑样式</h2>
      <p class="panel-subtitle" id="panelSubtitle">选择一个墓碑，中间预览会立刻变化。</p>
      <div class="stone-card">
        <div class="stone-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M18 56V18C18 9.716 24.716 3 33 3C41.284 3 48 9.716 48 18V56H18Z" fill="rgba(255,255,255,0.94)" />
            <path d="M12 56H54V62H12V56Z" fill="rgba(255,255,255,0.94)" />
          </svg>
        </div>
        <div>
          <div class="stone-name" id="stoneName">圆顶墓碑</div>
          <p class="stone-desc" id="stoneDesc">真实石材圆顶墓碑。</p>
        </div>
      </div>
      <button class="use-btn" id="useStoneBtn" disabled>使用这个墓碑</button>
    </div>
    <div id="stageWrap">
      <div id="stage"></div>
      <div class="loading-text" id="stageLoading">正在加载墓碑模型...</div>
    </div>

    <div class="final-dock" id="finalDock">
      <button onclick="openFinalPanel('storyPanelFinal')">故事</button>
      <button onclick="openFinalPanel('photosPanelFinal')">相册</button>
      <button onclick="openFinalPanel('giftPanelFinal')">礼物</button>
      <button onclick="openFinalPanel('messagePanelFinal')">留言</button>
    </div>
  </div>

  <div class="simple-panel" id="storyPanelFinal" onclick="closeFinalPanelByBg(event)">
    <div class="simple-card">
      <button class="simple-close" onclick="closeFinalPanels()">×</button>
      <h2>宠物故事</h2>
      <p id="storyTextFinal">还没有写下故事。</p>
    </div>
  </div>

  <div class="simple-panel" id="photosPanelFinal" onclick="closeFinalPanelByBg(event)">
    <div class="simple-card">
      <button class="simple-close" onclick="closeFinalPanels()">×</button>
      <h2>记忆相册</h2>
      <div class="simple-grid" id="photosGridFinal"></div>
    </div>
  </div>

  <div class="simple-panel" id="giftPanelFinal" onclick="closeFinalPanelByBg(event)">
    <div class="simple-card">
      <button class="simple-close" onclick="closeFinalPanels()">×</button>
      <h2>献上一份小礼物</h2>
      <p>选择一个小物件，轻轻放在墓碑旁。</p>
      <div class="simple-list">
        <button class="simple-action" onclick="placeFinalGift('can')">🥫 罐头</button>
        <button class="simple-action" onclick="placeFinalGift('ball')">🎾 小球</button>
        <button class="simple-action" onclick="placeFinalGift('flower')">🌸 花</button>
      </div>
      <div class="simple-list" id="giftListFinal"></div>
    </div>
  </div>

  <div class="simple-panel" id="messagePanelFinal" onclick="closeFinalPanelByBg(event)">
    <div class="simple-card">
      <button class="simple-close" onclick="closeFinalPanels()">×</button>
      <h2>留言</h2>
      <textarea id="messageInputFinal" class="simple-input" placeholder="写下一句话..."></textarea>
      <button class="simple-action" onclick="addFinalMessage()">留下留言</button>
      <div class="simple-list" id="messageListFinal"></div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    (function () {
      const TEXTS = {
        zh: { brand: "星眠宠物纪念园", back: "编辑",
        changeStone: "更换墓碑", title: "选择墓碑", subtitle: "墓碑会慢慢转正，并安静地落到纪念园中。", panelTitle: "墓碑样式", panelSubtitle: "选择一个墓碑，中间预览会立刻变化。", stoneName: "圆顶墓碑", stoneDesc: "真实石材圆顶墓碑。", use: "使用这个墓碑", loading: "正在加载墓碑模型...", loadError: "墓碑模型加载失败，请检查 tombstone-real.glb。" },
        "zh-TW": { brand: "星眠寵物紀念園", back: "編輯",
        changeStone: "更換墓碑", title: "選擇墓碑", subtitle: "墓碑會慢慢轉正，並安靜地落到紀念園中。", panelTitle: "墓碑樣式", panelSubtitle: "選擇一個墓碑，中間預覽會立刻變化。", stoneName: "圓頂墓碑", stoneDesc: "真實石材圓頂墓碑。", use: "使用這個墓碑", loading: "正在載入墓碑模型...", loadError: "墓碑模型載入失敗，請檢查 tombstone-real.glb。" },
        en: { brand: "Starlit Pet Memorial Garden", back: "Edit",
        changeStone: "Change Stone", title: "Choose a Tombstone", subtitle: "The tombstone will gently turn forward and settle into the memorial garden.", panelTitle: "Stone Style", panelSubtitle: "Choose a tombstone and the preview will update immediately.", stoneName: "Rounded Headstone", stoneDesc: "A realistic stone rounded headstone.", use: "Use This Stone", loading: "Loading tombstone model...", loadError: "Failed to load tombstone-real.glb." },
        ja: { brand: "星眠ペット記念園", back: "編集",
        changeStone: "墓碑を変更", title: "墓碑を選ぶ", subtitle: "墓碑はゆっくり正面を向き、静かに記念園へ収まります。", panelTitle: "墓碑スタイル", panelSubtitle: "墓碑を選ぶと中央プレビューがすぐ変わります。", stoneName: "丸型墓碑", stoneDesc: "リアルな石材の丸型墓碑です。", use: "この墓碑を使う", loading: "墓碑モデルを読み込み中...", loadError: "tombstone-real.glb の読み込みに失敗しました。" }
      };

      const MODEL_PATH = "./assets/models/tombstone-real.glb";

      const VIEW = {
        targetHeight: 3.22,
        previewX: 0.00,
        previewY: 0.34,
        previewZ: 0,
        previewScale: 0.90,
        previewRotY: -0.34,
        finalX: 0.00,
        finalY: 0.14,
        finalZ: 0.00,
        finalScale: 0.94,
        finalRotY: 0.00
      };

      const STAGE_POSE = {
        previewLeft: 54.5,
        previewTop: 50.0,
        previewScale: 1.00,
        finalLeft: 50.2,
        finalTop: 59.8,
        finalScale: 0.68
      };

      const ENGRAVE = {
        planeWidth: 1.52,
        planeHeight: 1.78,
        planeX: 0.00,
        planeY: 0.97,
        planeZ: 0.42,
        canvasSize: 1536,
        nameSize: 255,
        dateSize: 96,
        epitaphSize: 104,
        nameY: 500,
        dateY: 720,
        epitaphY: 965,
        lineGap: 128,
        maxLines: 3,
        maxWidthRatio: 0.70
      };

      const stageWrap = document.getElementById("stageWrap");
      const stageEl = document.getElementById("stage");
      const loadingEl = document.getElementById("stageLoading");
      const useBtn = document.getElementById("useStoneBtn");
      const langSelect = document.getElementById("languageSelect");
      const backBtn = document.getElementById("backBtn");

      let renderer, scene, camera, pivot, stoneRoot, engravingPlane, engravingTexture, giftGroup;
      let isLoaded = false;
      let isAnimating = false;

      function lang() { return localStorage.getItem("siteLanguage") || "zh"; }
      function t() { return TEXTS[lang()] || TEXTS.zh; }

      function applyLanguage(value) {
        const text = TEXTS[value] || TEXTS.zh;
        localStorage.setItem("siteLanguage", value);
        document.getElementById("brandText").textContent = text.brand;
        document.getElementById("backBtn").textContent = text.back;
        const changeStoneBtn = document.getElementById("changeStoneBtn");
        if (changeStoneBtn) changeStoneBtn.textContent = text.changeStone || "更换墓碑";
        document.getElementById("heroTitle").textContent = text.title;
        document.getElementById("heroSubtitle").textContent = text.subtitle;
        document.getElementById("panelTitle").textContent = text.panelTitle;
        document.getElementById("panelSubtitle").textContent = text.panelSubtitle;
        document.getElementById("stoneName").textContent = text.stoneName;
        document.getElementById("stoneDesc").textContent = text.stoneDesc;
        document.getElementById("useStoneBtn").textContent = text.use;
        if (!isLoaded) loadingEl.textContent = text.loading;
        langSelect.value = value;
      }

      function getMemorialData() {
        let raw = {};
        try { raw = JSON.parse(localStorage.getItem("myPetMemorial") || "{}"); } catch (e) { raw = {}; }
        return {
          name: raw.name || raw.petName || raw.pet_name || "豆豆",
          birthDate: raw.birthDate || raw.birth || raw.birthday || "2015.08.20",
          deathDate: raw.deathDate || raw.death || raw.passingDate || "2026.05.12",
          epitaph: raw.epitaph || raw.message || raw.words || raw.lastWords || "谢谢你陪我走过这段人生"
        };
      }

      function formatDate(value) {
        return String(value || "").replace(/-/g, ".").replace(/\//g, ".");
      }

      function wrapText(ctx, text, maxWidth, maxLines) {
        const units = Array.from(String(text || ""));
        const lines = [];
        let line = "";
        for (let i = 0; i < units.length; i += 1) {
          const test = line + units[i];
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = units[i];
            if (lines.length >= maxLines - 1) break;
          } else {
            line = test;
          }
        }
        if (line && lines.length < maxLines) lines.push(line);
        if (lines.length === maxLines) {
          let all = units.join("");
          if (lines.join("").length < all.length) {
            let last = lines[lines.length - 1];
            while (last.length > 1 && ctx.measureText(last + "…").width > maxWidth) last = last.slice(0, -1);
            lines[lines.length - 1] = last + "…";
          }
        }
        return lines;
      }

      function drawEngraved(ctx, text, x, y, fontSize, weight) {
        if (!text) return;

        const fontFamily = '"Noto Serif CJK SC", "Noto Serif SC", "Microsoft YaHei", "PingFang SC", "Noto Sans JP", serif';

        ctx.save();
        ctx.font = weight + " " + fontSize + "px " + fontFamily;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // 这里只画“文字形状遮罩”，真正的凹陷、高光、阴影交给下面的 ShaderMaterial 生成
        ctx.fillStyle = "rgba(255,255,255,0.96)";
        ctx.fillText(text, x, y);

        // 轻微扩边，让字槽有厚度
        ctx.lineWidth = Math.max(2, fontSize * 0.035);
        ctx.strokeStyle = "rgba(255,255,255,0.42)";
        ctx.strokeText(text, x, y);

        // 很少量磨损：让边缘不那么数码，但不影响可读性
        const metric = ctx.measureText(text);
        const width = metric.width;
        const height = fontSize * 0.86;
        const wearCount = Math.max(10, Math.floor(fontSize * 0.12));

        ctx.globalCompositeOperation = "destination-out";
        for (let i = 0; i < wearCount; i += 1) {
          const rx = x - width / 2 + Math.random() * width;
          const ry = y - height / 2 + Math.random() * height;
          const r = 0.35 + Math.random() * 1.10;
          ctx.beginPath();
          ctx.arc(rx, ry, r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,0,0,0.040)";
          ctx.fill();
        }

        ctx.globalCompositeOperation = "source-over";
        ctx.restore();
      }

      function createEngravingTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = ENGRAVE.canvasSize;
        canvas.height = ENGRAVE.canvasSize;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const data = getMemorialData();
        const cx = canvas.width / 2;
        const maxWidth = canvas.width * ENGRAVE.maxWidthRatio;
        const dateLine = (formatDate(data.birthDate) + " - " + formatDate(data.deathDate)).trim();

        drawEngraved(ctx, data.name, cx, ENGRAVE.nameY, ENGRAVE.nameSize, 700);
        drawEngraved(ctx, dateLine, cx, ENGRAVE.dateY, ENGRAVE.dateSize, 500);

        ctx.save();
        ctx.font = "600 " + ENGRAVE.epitaphSize + "px Microsoft YaHei";
        const lines = wrapText(ctx, data.epitaph, maxWidth, ENGRAVE.maxLines);
        ctx.restore();
        const startY = ENGRAVE.epitaphY - ((lines.length - 1) * ENGRAVE.lineGap) / 2;
        lines.forEach(function (line, index) {
          drawEngraved(ctx, line, cx, startY + index * ENGRAVE.lineGap, ENGRAVE.epitaphSize, 600);
        });

        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        tex.encoding = THREE.sRGBEncoding;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        return tex;
      }

      function updateEngravingTexture() {
        if (!engravingPlane) return;
        if (engravingTexture) engravingTexture.dispose();
        engravingTexture = createEngravingTexture();
        if (engravingPlane.material.uniforms && engravingPlane.material.uniforms.map) {
          engravingPlane.material.uniforms.map.value = engravingTexture;
        }
        engravingPlane.material.needsUpdate = true;
      }

      function createScene() {
        if (!window.THREE || !THREE.GLTFLoader) {
          loadingEl.textContent = "Three.js 加载失败，请刷新页面。";
          return;
        }
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        camera.position.set(0, 1.45, 7.4);
        camera.lookAt(new THREE.Vector3(0, 1.10, 0));

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setClearColor(0x000000, 0);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        stageEl.innerHTML = "";
        stageEl.appendChild(renderer.domElement);

        pivot = new THREE.Group();
        scene.add(pivot);

        giftGroup = new THREE.Group();
        pivot.add(giftGroup);

        scene.add(new THREE.HemisphereLight(0xdce8ff, 0x2b211a, 1.20));
        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const moon = new THREE.DirectionalLight(0xbfd6ff, 0.96);
        moon.position.set(-3.8, 5.8, 5.4);
        scene.add(moon);
        const warm = new THREE.DirectionalLight(0xffcf96, 1.08);
        warm.position.set(4.8, 2.4, 3.6);
        scene.add(warm);
        const fill = new THREE.DirectionalLight(0xe9eefc, 0.34);
        fill.position.set(0.0, 2.0, 5.8);
        scene.add(fill);

        resizeScene();
      }

      function resizeScene() {
        if (!renderer || !camera) return;
        const rect = stageEl.getBoundingClientRect();
        const w = Math.max(1, Math.floor(rect.width));
        const h = Math.max(1, Math.floor(rect.height));
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      function centerAndScaleModel(model) {
        model.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);
        model.position.x -= center.x;
        model.position.z -= center.z;
        model.position.y -= box.min.y;

        const scale = VIEW.targetHeight / Math.max(size.y, 0.0001);
        model.scale.setScalar(scale);
        model.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(model);
        const scaledSize = new THREE.Vector3();
        scaledBox.getSize(scaledSize);
        return scaledSize;
      }

      function attachEngraving(model, scaledSize) {
        // 关键修正：刻字层不再作为 model 的子对象。
        // 之前刻字会继承 GLB 模型自身缩放/坐标，导致位置失控或被模型吃掉。
        // 现在把刻字层作为 pivot 的子对象，和墓碑一起旋转/缩放/落位，但坐标独立稳定。
        if (engravingTexture) engravingTexture.dispose();
        engravingTexture = createEngravingTexture();

        const geometry = new THREE.PlaneGeometry(ENGRAVE.planeWidth, ENGRAVE.planeHeight);
        const material = new THREE.ShaderMaterial({
          uniforms: {
            map: { value: engravingTexture },
            texel: { value: new THREE.Vector2(1 / ENGRAVE.canvasSize, 1 / ENGRAVE.canvasSize) },
            opacityValue: { value: 0.92 }
          },
          vertexShader: [
            "varying vec2 vUv;",
            "void main() {",
            "  vUv = uv;",
            "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
            "}"
          ].join("\n"),
          fragmentShader: [
            "uniform sampler2D map;",
            "uniform vec2 texel;",
            "uniform float opacityValue;",
            "varying vec2 vUv;",
            "float hash(vec2 p) {",
            "  p = fract(p * vec2(123.34, 456.21));",
            "  p += dot(p, p + 45.32);",
            "  return fract(p.x * p.y);",
            "}",
            "void main() {",
            "  float a = texture2D(map, vUv).a;",
            "  if (a < 0.012) discard;",
            "  float l1 = texture2D(map, vUv - vec2(texel.x * 2.0, 0.0)).a;",
            "  float r1 = texture2D(map, vUv + vec2(texel.x * 2.0, 0.0)).a;",
            "  float u1 = texture2D(map, vUv + vec2(0.0, texel.y * 2.0)).a;",
            "  float d1 = texture2D(map, vUv - vec2(0.0, texel.y * 2.0)).a;",
            "  float l2 = texture2D(map, vUv - vec2(texel.x * 5.0, 0.0)).a;",
            "  float r2 = texture2D(map, vUv + vec2(texel.x * 5.0, 0.0)).a;",
            "  float u2 = texture2D(map, vUv + vec2(0.0, texel.y * 5.0)).a;",
            "  float d2 = texture2D(map, vUv - vec2(0.0, texel.y * 5.0)).a;",
            "  float edgeFine = abs(r1 - l1) + abs(u1 - d1);",
            "  float edgeWide = abs(r2 - l2) + abs(u2 - d2);",
            "  float bevelLight = clamp((l2 + u2 - r2 - d2) * 0.85 + edgeFine * 0.10, 0.0, 1.0);",
            "  float bevelDark = clamp((r2 + d2 - l2 - u2) * 0.95 + edgeFine * 0.18, 0.0, 1.0);",
            "  float grain1 = hash(floor(vUv * 380.0));",
            "  float grain2 = hash(floor(vUv * 910.0));",
            "  float wear = smoothstep(0.08, 0.92, grain1) * 0.16 + smoothstep(0.78, 1.0, grain2) * 0.18;",
            "  vec3 groove = vec3(0.095, 0.100, 0.098);",
            "  vec3 coldDust = vec3(0.210, 0.215, 0.205);",
            "  vec3 brightRim = vec3(0.610, 0.600, 0.540);",
            "  vec3 deepShadow = vec3(0.035, 0.038, 0.038);",
            "  vec3 color = mix(groove, coldDust, grain1 * 0.18);",
            "  color = mix(color, brightRim, bevelLight * 0.42);",
            "  color = mix(color, deepShadow, bevelDark * 0.54);",
            "  color *= 0.92 + grain2 * 0.12;",
            "  float inner = smoothstep(0.08, 0.82, a);",
            "  float edge = clamp(edgeFine * 1.8 + edgeWide * 0.7, 0.0, 1.0);",
            "  float alpha = (inner * 0.48 + edge * 0.44) * opacityValue;",
            "  alpha *= 1.0 - wear * 0.55;",
            "  gl_FragColor = vec4(color, alpha);",
            "}"
          ].join("\n"),
          transparent: true,
          depthWrite: false,
          depthTest: false,
          side: THREE.DoubleSide
        });

        engravingPlane = new THREE.Mesh(geometry, material);
        engravingPlane.renderOrder = 999;
        engravingPlane.position.set(ENGRAVE.planeX, ENGRAVE.planeY, ENGRAVE.planeZ);
        pivot.add(engravingPlane);
      }

      function tuneMaterial(root) {
        root.traverse(function (child) {
          if (!child.isMesh) return;
          child.castShadow = false;
          child.receiveShadow = false;
          if (child.material) {
            const arr = Array.isArray(child.material) ? child.material : [child.material];
            arr.forEach(function (mat) {
              if (mat.map) mat.map.encoding = THREE.sRGBEncoding;
              if (mat.color && mat.color.offsetHSL) mat.color.offsetHSL(0, -0.02, 0.04);
              if ("roughness" in mat) mat.roughness = 0.96;
              if ("metalness" in mat) mat.metalness = 0.02;
              mat.needsUpdate = true;
            });
          }
        });
      }

      function applyStagePose(left, top, scale) {
        stageWrap.style.left = left + "%";
        stageWrap.style.top = top + "%";
        stageWrap.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
      }

      function setPreviewPose() {
        applyStagePose(STAGE_POSE.previewLeft, STAGE_POSE.previewTop, STAGE_POSE.previewScale);
        pivot.position.set(VIEW.previewX, VIEW.previewY, VIEW.previewZ);
        pivot.rotation.set(0, VIEW.previewRotY, 0);
        pivot.scale.setScalar(VIEW.previewScale);
      }

      function setFinalPoseImmediately() {
        applyStagePose(STAGE_POSE.finalLeft, STAGE_POSE.finalTop, STAGE_POSE.finalScale);
        pivot.position.set(VIEW.finalX, VIEW.finalY, VIEW.finalZ);
        pivot.rotation.set(0, VIEW.finalRotY, 0);
        pivot.scale.setScalar(VIEW.finalScale);
        document.body.classList.add("placed-mode");
      }

      function loadModel() {
        const loader = new THREE.GLTFLoader();
        let finished = false;
        const timer = setTimeout(function () {
          if (!finished) loadingEl.textContent = "模型仍在加载，请确认 tombstone-real.glb 没有损坏。";
        }, 12000);

        loader.load(MODEL_PATH, function (gltf) {
          finished = true;
          clearTimeout(timer);
          stoneRoot = gltf.scene;
          tuneMaterial(stoneRoot);
          const scaledSize = centerAndScaleModel(stoneRoot);
          attachEngraving(stoneRoot, scaledSize);
          pivot.add(stoneRoot);
          setFinalPoseImmediately();
          isLoaded = true;
          loadingEl.style.display = "none";
          if (useBtn) useBtn.disabled = false;
          renderFinalPanels();
          syncGiftObjects();
        }, undefined, function (error) {
          finished = true;
          clearTimeout(timer);
          console.error(error);
          loadingEl.textContent = t().loadError;
          useBtn.disabled = true;
        });
      }

      function animateToFinal() {
        if (!isLoaded || isAnimating) return;
        isAnimating = true;
        useBtn.disabled = true;
        document.body.classList.add("final-placing");

        const start = {
          x: pivot.position.x,
          y: pivot.position.y,
          z: pivot.position.z,
          s: pivot.scale.x,
          r: pivot.rotation.y,
          left: STAGE_POSE.previewLeft,
          top: STAGE_POSE.previewTop,
          wrapScale: STAGE_POSE.previewScale
        };
        const end = {
          x: VIEW.finalX,
          y: VIEW.finalY,
          z: VIEW.finalZ,
          s: VIEW.finalScale,
          r: VIEW.finalRotY,
          left: STAGE_POSE.finalLeft,
          top: STAGE_POSE.finalTop,
          wrapScale: STAGE_POSE.finalScale
        };
        const t0 = performance.now();
        const duration = 1080;
        function ease(t) { return 1 - Math.pow(1 - t, 3); }
        function mix(a, b, k) { return a + (b - a) * k; }
        function step(now) {
          const p = Math.min(1, (now - t0) / duration);
          const k = ease(p);
          pivot.position.set(mix(start.x, end.x, k), mix(start.y, end.y, k), mix(start.z, end.z, k));
          pivot.scale.setScalar(mix(start.s, end.s, k));
          pivot.rotation.y = mix(start.r, end.r, k);
          applyStagePose(mix(start.left, end.left, k), mix(start.top, end.top, k), mix(start.wrapScale, end.wrapScale, k));

          if (p < 1) {
            requestAnimationFrame(step);
          } else {
            localStorage.setItem("selectedStoneStyle", "rounded-real-glb");
            localStorage.setItem("selectedStoneModel", MODEL_PATH);
            document.body.classList.remove("final-placing");
            document.body.classList.add("placed-mode");
            useBtn.disabled = false;
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, "", "./cemetery.html");
            }
            renderFinalPanels();
          }
        }
        requestAnimationFrame(step);
      }

      function loop() {
        requestAnimationFrame(loop);
        if (renderer && scene && camera) renderer.render(scene, camera);
      }



      function normalizeGiftType(item) {
        const value = String(item || "");
        if (value === "can" || value.indexOf("罐") >= 0 || value.indexOf("Can") >= 0 || value.indexOf("🥫") >= 0) return "can";
        if (value === "ball" || value.indexOf("球") >= 0 || value.indexOf("Ball") >= 0 || value.indexOf("🎾") >= 0) return "ball";
        if (value === "flower" || value.indexOf("花") >= 0 || value.indexOf("Flower") >= 0 || value.indexOf("🌸") >= 0) return "flower";
        return value || "gift";
      }

      function giftLabel(type) {
        if (type === "can") return "🥫 罐头";
        if (type === "ball") return "🎾 小球";
        if (type === "flower") return "🌸 花";
        return String(type || "");
      }

      function disposeObject3D(object) {
        object.traverse(function(child) {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            const arr = Array.isArray(child.material) ? child.material : [child.material];
            arr.forEach(function(mat) { if (mat) mat.dispose(); });
          }
        });
      }

      function makeCanGift() {
        const g = new THREE.Group();

        const metal = new THREE.MeshStandardMaterial({
          color: 0xb8b2a6,
          roughness: 0.72,
          metalness: 0.15
        });
        const label = new THREE.MeshStandardMaterial({
          color: 0x8a5a48,
          roughness: 0.86,
          metalness: 0.02
        });
        const dark = new THREE.MeshStandardMaterial({
          color: 0x5f5a52,
          roughness: 0.9,
          metalness: 0.05
        });

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.22, 32), metal);
        body.position.y = 0.11;
        g.add(body);

        const band = new THREE.Mesh(new THREE.CylinderGeometry(0.108, 0.108, 0.11, 32, 1, true), label);
        band.position.y = 0.11;
        g.add(band);

        const top = new THREE.Mesh(new THREE.CylinderGeometry(0.108, 0.108, 0.018, 32), dark);
        top.position.y = 0.225;
        g.add(top);

        g.scale.setScalar(0.90);
        return g;
      }

      function makeBallGift() {
        const ball = new THREE.Mesh(
          new THREE.SphereGeometry(0.13, 32, 18),
          new THREE.MeshStandardMaterial({
            color: 0xd7c37a,
            roughness: 0.82,
            metalness: 0.0
          })
        );
        ball.position.y = 0.13;

        const g = new THREE.Group();
        g.add(ball);

        const seam = new THREE.Mesh(
          new THREE.TorusGeometry(0.132, 0.006, 8, 48),
          new THREE.MeshStandardMaterial({
            color: 0xf0e2a2,
            roughness: 0.85,
            metalness: 0.0
          })
        );
        seam.rotation.x = Math.PI / 2;
        seam.position.y = 0.13;
        g.add(seam);

        g.scale.setScalar(0.92);
        return g;
      }

      function makeFlowerGift() {
        const g = new THREE.Group();

        const stemMat = new THREE.MeshStandardMaterial({
          color: 0x4f6b42,
          roughness: 0.9,
          metalness: 0.0
        });
        const petalMat = new THREE.MeshStandardMaterial({
          color: 0xc7b7ad,
          roughness: 0.95,
          metalness: 0.0
        });
        const centerMat = new THREE.MeshStandardMaterial({
          color: 0xb59b5e,
          roughness: 0.92,
          metalness: 0.0
        });

        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.32, 10), stemMat);
        stem.position.y = 0.16;
        stem.rotation.z = -0.45;
        g.add(stem);

        const center = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 10), centerMat);
        center.position.set(0.10, 0.30, 0.00);
        g.add(center);

        for (let i = 0; i < 6; i += 1) {
          const p = new THREE.Mesh(new THREE.SphereGeometry(0.038, 16, 10), petalMat);
          const a = (Math.PI * 2 * i) / 6;
          p.scale.set(1.35, 0.65, 0.45);
          p.position.set(0.10 + Math.cos(a) * 0.052, 0.30 + Math.sin(a) * 0.052, 0);
          g.add(p);
        }

        g.scale.setScalar(0.88);
        return g;
      }

      function makeGiftObject(type) {
        if (type === "can") return makeCanGift();
        if (type === "ball") return makeBallGift();
        if (type === "flower") return makeFlowerGift();
        return makeBallGift();
      }

      function syncGiftObjects() {
        if (!giftGroup) return;

        while (giftGroup.children.length) {
          const child = giftGroup.children.pop();
          disposeObject3D(child);
        }

        const rawItems = getFinalGifts();
        const types = [];
        rawItems.forEach(function(item) {
          const type = normalizeGiftType(item);
          if (types.indexOf(type) === -1) types.push(type);
        });

        const slots = [
          { x: -0.58, y: 0.02, z: 0.68, r: 0.10 },
          { x: 0.56, y: 0.02, z: 0.70, r: -0.18 },
          { x: -0.18, y: 0.02, z: 0.82, r: 0.32 }
        ];

        types.slice(0, 3).forEach(function(type, index) {
          const obj = makeGiftObject(type);
          const slot = slots[index] || slots[0];
          obj.position.set(slot.x, slot.y, slot.z);
          obj.rotation.y = slot.r;
          giftGroup.add(obj);
        });
      }


      function getMemorialForFinal() {
        try {
          return JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
        } catch (error) {
          return {};
        }
      }

      function getFinalMessages() {
        try {
          return JSON.parse(localStorage.getItem("memorialMessages") || "[]");
        } catch (error) {
          return [];
        }
      }

      function getFinalGifts() {
        try {
          return JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]");
        } catch (error) {
          return [];
        }
      }

      window.openFinalPanel = function(id) {
        renderFinalPanels();
        document.querySelectorAll(".simple-panel").forEach(function(panel) {
          panel.classList.remove("show");
        });
        const panel = document.getElementById(id);
        if (panel) panel.classList.add("show");
      };

      window.closeFinalPanels = function() {
        document.querySelectorAll(".simple-panel").forEach(function(panel) {
          panel.classList.remove("show");
        });
      };

      window.closeFinalPanelByBg = function(event) {
        if (event.target.classList.contains("simple-panel")) {
          closeFinalPanels();
        }
      };

      window.addFinalMessage = function() {
        const input = document.getElementById("messageInputFinal");
        const value = input.value.trim();
        if (!value) return;
        const messages = getFinalMessages();
        messages.unshift(value);
        localStorage.setItem("memorialMessages", JSON.stringify(messages.slice(0, 20)));
        input.value = "";
        renderFinalPanels();
      };

      window.placeFinalGift = function(type) {
        const gifts = getFinalGifts().map(normalizeGiftType);
        gifts.unshift(normalizeGiftType(type));
        localStorage.setItem("memorialPlacedItems", JSON.stringify(gifts.slice(0, 8)));
        renderFinalPanels();
        syncGiftObjects();
      };

      function renderFinalPanels() {
        const data = getMemorialForFinal();

        const storyBox = document.getElementById("storyTextFinal");
        if (storyBox) {
          const story = data.story || data.petStory || "";
          storyBox.textContent = story || "还没有写下故事。";
          storyBox.className = story ? "" : "empty-text";
        }

        const photosBox = document.getElementById("photosGridFinal");
        if (photosBox) {
          photosBox.innerHTML = "";
          const photos = [];
          if (data.photo) photos.push(data.photo);
          if (Array.isArray(data.publicPhotos)) photos.push.apply(photos, data.publicPhotos);
          if (Array.isArray(data.privatePhotos)) photos.push.apply(photos, data.privatePhotos);

          if (!photos.length) {
            photosBox.innerHTML = '<p class="empty-text">还没有上传照片。</p>';
          } else {
            photos.forEach(function(src) {
              const div = document.createElement("div");
              div.className = "simple-photo";
              const img = document.createElement("img");
              img.src = src;
              div.appendChild(img);
              photosBox.appendChild(div);
            });
          }
        }

        const messageList = document.getElementById("messageListFinal");
        if (messageList) {
          const messages = getFinalMessages();
          messageList.innerHTML = "";
          if (!messages.length) {
            messageList.innerHTML = '<div class="simple-item empty-text">还没有留言。</div>';
          } else {
            messages.forEach(function(msg) {
              const div = document.createElement("div");
              div.className = "simple-item";
              div.textContent = msg;
              messageList.appendChild(div);
            });
          }
        }

        const giftList = document.getElementById("giftListFinal");
        if (giftList) {
          const gifts = getFinalGifts();
          giftList.innerHTML = "";
          gifts.forEach(function(gift) {
            const div = document.createElement("div");
            div.className = "simple-item";
            div.textContent = giftLabel(normalizeGiftType(gift));
            giftList.appendChild(div);
          });
        }
      }


      function init() {
        applyLanguage(lang());
        backBtn.addEventListener("click", function () { window.location.href = "./create.html"; });
        const changeStoneBtn = document.getElementById("changeStoneBtn");
        if (changeStoneBtn) changeStoneBtn.addEventListener("click", function () { window.location.href = "./select-stone.html"; });
        langSelect.addEventListener("change", function (e) { applyLanguage(e.target.value); updateEngravingTexture(); });
        if (useBtn) useBtn.addEventListener("click", animateToFinal);
        window.addEventListener("resize", resizeScene);
        window.addEventListener("storage", function (event) { if (event.key === "myPetMemorial") updateEngravingTexture(); });
        document.addEventListener("keydown", function(event) { if (event.key === "Escape") closeFinalPanels(); });
        createScene();
        loadModel();
        loop();
      }

      init();
    })();
  </script>
</body>
