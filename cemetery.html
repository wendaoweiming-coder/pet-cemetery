<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>宠物纪念墓碑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cemetery-page">

    <a href="index.html" class="back-link">← 返回首页</a>
    <a href="create.html" class="back-link">编辑墓碑</a>

    <section class="memorial-scene">

      <div class="sky-note">
        愿每一次想念，都轻轻落在它身边。
      </div>

      <div class="grave-area">

        <div id="petals"></div>
        <div id="traces"></div>

        <div class="stone">
          <div class="photo-frame" id="petPhotoDisplay">🐾</div>
          <h1 id="petNameDisplay">小星星</h1>
          <p class="date" id="petYearsDisplay">2016 - 2024</p>
          <p class="memory" id="petMemoryDisplay">谢谢你陪我们走过那么多温柔的日子。</p>
        </div>

        <div id="placedItems" class="placed-items"></div>
        <div id="animals" class="animals"></div>

      </div>

      <div id="animalStatus" class="animal-status">
        这里很安静，还没有小动物来。
      </div>

      <div class="gift-buttons">
        <button onclick="placeGift('can')">摆一罐猫罐头</button>
        <button onclick="placeGift('ball')">放一个小球</button>
        <button onclick="placeGift('seed')">撒一点鸟食</button>
        <button onclick="placeGift('flower')">献一束花</button>
      </div>

      <button class="search-btn" onclick="searchAnimal()">
        寻找去别处闲逛的小动物
      </button>

      <div class="message-box">
        <textarea id="messageInput" placeholder="写下一句想对它说的话..."></textarea>
        <button onclick="addMessage()">留下留言</button>
      </div>

      <div class="message-area">
        <h3>留言</h3>
        <div id="messageList"></div>
      </div>

    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
