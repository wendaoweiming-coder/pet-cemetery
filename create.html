<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>创建宠物墓碑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cemetery-page">

    <a href="index.html" class="back-link">← 返回首页</a>

    <section class="message-area">
      <h2 style="text-align:center;">创建宠物墓碑</h2>

      <div class="message-box">
        <input id="petName" placeholder="宠物名字，例如：小星星" class="form-input">

        <label class="form-label">出生日期</label>
        <input id="petBirthDate" type="date" class="form-input">

        <label class="form-label">离开日期</label>
        <input id="petLeaveDate" type="date" class="form-input">

        <textarea id="petMemory" placeholder="写一段想对它说的话..."></textarea>

        <label class="form-label">上传宠物照片</label>
        <input id="petPhoto" type="file" accept="image/*" class="form-input">

        <button onclick="saveMemorial()">保存并查看墓碑</button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
