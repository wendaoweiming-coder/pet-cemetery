<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星眠宠物纪念园</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">

  <div class="home-page">

    <header class="home-header">
      <div class="logo">星眠宠物纪念园</div>
      <a href="create.html" class="nav-button">创建墓碑</a>
    </header>

    <main class="hero-section">

      <div class="hero-text">
        <p class="small-title">给逝去的宠物，一个温柔的归处</p>

        <h1>
          把想念，安静地<br>
          留在一座小小墓园里
        </h1>

        <p class="hero-desc">
          在这里，你可以为宠物创建专属纪念墓碑，上传照片，写下故事，
          摆放它喜欢的小物件，也让来访的人留下一片花瓣、一句思念。
        </p>

        <div class="hero-actions">
          <a href="create.html" class="main-button">创建宠物墓碑</a>
          <a href="cemetery.html" class="second-button">查看示例墓碑</a>
        </div>
      </div>

      <div class="hero-card">
        <div class="moon">☾</div>
        <div class="mini-stone">
          <div class="mini-photo">🐾</div>
          <h2>小星星</h2>
          <p>2016 - 2024</p>
          <span>永远被爱记得</span>
        </div>

        <div class="soft-flower flower-one">花瓣</div>
        <div class="soft-flower flower-two">小球</div>
        <div class="soft-flower flower-three">罐头</div>
      </div>

    </main>

    <section class="home-features">
      <div class="feature-card">
        <h3>专属墓碑</h3>
        <p>记录名字、照片、日期和你想对它说的话。</p>
      </div>

      <div class="feature-card">
        <h3>温柔互动</h3>
        <p>访客来过，会留下一片花瓣，也可以留言祭奠。</p>
      </div>

      <div class="feature-card">
        <h3>小动物陪伴</h3>
        <p>罐头、花和玩具，会吸引小动物安静靠近。</p>
      </div>
    </section>

  </div>

</body>
</html>
