<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Tombstone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #10140f;
      color: #fffaf5;
    }

    button, a, select {
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(6, 10, 18, 0.06) 0%,
          rgba(6, 10, 18, 0.12) 46%,
          rgba(6, 10, 18, 0.30) 100%
        ),
        url("cemetery-bg.png") center center / cover no-repeat;
      transform: scale(1.08);
      transform-origin: center center;
      z-index: 0;
    }

    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center 55%, rgba(255, 231, 190, 0.08), transparent 24%),
        radial-gradient(circle at center 58%, rgba(255, 255, 255, 0.05), transparent 36%);
      pointer-events: none;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: relative;
      z-index: 30;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 30px 34px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: rgba(255, 250, 245, 0.96);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.36);
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .soft-button,
    .language-select {
      border: 1px solid rgba(255, 250, 245, 0.30);
      background: rgba(255, 250, 245, 0.08);
      color: #fffaf5;
      padding: 10px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .soft-button:hover,
    .language-select:hover {
      background: rgba(255, 250, 245, 0.16);
      border-color: rgba(255, 250, 245, 0.42);
    }

    .language-select {
      min-width: 146px;
    }

    .language-select option {
      color: #2d2520;
      background: #fffaf5;
    }

    .main-layout {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 270px 1fr 270px;
      gap: 24px;
      align-items: center;
      padding: 20px 34px 116px;
    }

    .left-panel {
      position: relative;
      z-index: 20;
      align-self: center;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 23px;
      font-weight: 500;
      color: rgba(255, 250, 245, 0.95);
      text-shadow: 0 3px 16px rgba(0,0,0,0.34);
    }

    .panel-subtitle {
      margin: 0 0 20px;
      color: rgba(255, 244, 232, 0.68);
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }

    .stone-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stone-option {
      width: 100%;
      border: none;
      padding: 0;
      background: transparent;
      color: #fffaf5;
      cursor: pointer;
      text-align: left;
    }

    .stone-option-inner {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 13px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255, 250, 245, 0.13);
      background: rgba(255, 250, 245, 0.055);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: 0.22s ease;
    }

    .stone-option:hover .stone-option-inner {
      background: rgba(255, 250, 245, 0.11);
      border-color: rgba(255, 250, 245, 0.28);
      transform: translateX(5px);
    }

    .stone-option.active .stone-option-inner {
      background: rgba(255, 250, 245, 0.17);
      border-color: rgba(255, 250, 245, 0.48);
    }

    .mini-3d {
      width: 70px;
      height: 86px;
      border-radius: 18px;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 70%);
    }

    .option-name {
      margin: 0 0 4px;
      font-size: 14px;
      color: rgba(255, 250, 245, 0.93);
    }

    .option-desc {
      margin: 0;
      color: rgba(255, 244, 232, 0.58);
      font-size: 12px;
      line-height: 1.5;
    }

    .confirm-button {
      width: 100%;
      margin-top: 22px;
      border: 1px solid rgba(255, 250, 245, 0.52);
      background: rgba(255, 250, 245, 0.88);
      color: #4b3d35;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      transition: 0.22s ease;
    }

    .confirm-button:hover {
      background: rgba(255, 250, 245, 0.96);
      transform: translateY(-1px);
    }

    .center-area {
      position: relative;
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .instruction {
      position: absolute;
      top: 12px;
      left: 50%;
      width: min(720px, 90%);
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 3px 18px rgba(0,0,0,0.36);
    }

    .instruction h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      color: rgba(255, 248, 239, 0.96);
    }

    .instruction p {
      margin: 0;
      color: rgba(255, 244, 232, 0.72);
      font-size: 14px;
      line-height: 1.7;
    }

    .scene-wrap {
      position: relative;
      width: min(500px, 54vw);
      height: min(580px, 68vh);
      min-width: 320px;
      min-height: 430px;
      margin-top: 42px;
    }

    #mainStoneScene {
      position: absolute;
      inset: 0;
      border-radius: 26px;
    }

    .right-spacer {
      min-height: 1px;
    }

    .planting-mask {
      position: fixed;
      inset: 0;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      background: rgba(5, 8, 7, 0.16);
      transition: opacity 0.5s ease;
    }

    body.planting .planting-mask {
      opacity: 1;
      pointer-events: auto;
    }

    body.planting .top-bar,
    body.planting .left-panel,
    body.planting .instruction {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body.planting .scene-wrap {
      transform: scale(0.84);
      transition: transform 0.9s cubic-bezier(0.22, 0.82, 0.22, 1);
    }

    @media (max-width: 980px) {
      html, body {
        overflow: auto;
        min-height: 100%;
      }

      .page-shell {
        min-height: 100vh;
        height: auto;
      }

      .top-bar {
        padding: 22px 18px 0;
        align-items: flex-start;
      }

      .top-actions {
        flex-direction: column;
        align-items: flex-end;
      }

      .main-layout {
        grid-template-columns: 1fr;
        padding: 22px 18px 100px;
      }

      .left-panel {
        max-width: 460px;
        margin: 0 auto;
        order: 2;
      }

      .center-area {
        min-height: 540px;
        order: 1;
      }

      .right-spacer {
        display: none;
      }

      .scene-wrap {
        width: min(92vw, 440px);
        height: 500px;
        margin-top: 70px;
      }

      .instruction h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <div class="page-bg"></div>
  <div class="planting-mask"></div>

  <div class="page-shell">
    <header class="top-bar">
      <a href="index.html" class="logo" data-key="logo">Starlit Pet Memorial Garden</a>

      <div class="top-actions">
        <a href="create.html" class="soft-button" data-key="backBtn">Back to edit</a>

        <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="th">ไทย</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>

    <main class="main-layout">
      <aside class="left-panel">
        <h2 class="panel-title" data-key="panelTitle">Tombstone style</h2>
        <p class="panel-subtitle" data-key="panelSubtitle">
          Choose a 3D tombstone. The center preview will update immediately.
        </p>

        <div class="stone-list">
          <button class="stone-option active" data-style="rounded" onclick="selectStone('rounded', this)">
            <div class="stone-option-inner">
              <div class="mini-3d" id="miniRounded"></div>
              <div>
                <p class="option-name" data-key="roundedName">Rounded stone</p>
                <p class="option-desc" data-key="roundedDesc">Classic and gentle.</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="square" onclick="selectStone('square', this)">
            <div class="stone-option-inner">
              <div class="mini-3d" id="miniSquare"></div>
              <div>
                <p class="option-name" data-key="squareName">Soft square</p>
                <p class="option-desc" data-key="squareDesc">Clean and quiet.</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="arch" onclick="selectStone('arch', this)">
            <div class="stone-option-inner">
              <div class="mini-3d" id="miniArch"></div>
              <div>
                <p class="option-name" data-key="archName">Tall arch</p>
                <p class="option-desc" data-key="archDesc">Calm and solemn.</p>
              </div>
            </div>
          </button>
        </div>

        <button class="confirm-button" onclick="confirmStone()" data-key="confirmBtn">
          Use this tombstone
        </button>
      </aside>

      <section class="center-area">
        <div class="instruction">
          <h1 data-key="title">Choose a tombstone</h1>
          <p data-key="subtitle">This is a 3D preview. The final memorial will use the same style.</p>
        </div>

        <div class="scene-wrap">
          <div id="mainStoneScene"></div>
        </div>
      </section>

      <div class="right-spacer"></div>
    </main>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    let currentLang = "en";
    let selectedStoneStyle = "rounded";

    let mainScene = null;
    let mainCamera = null;
    let mainRenderer = null;
    let mainStoneGroup = null;
    let mainTextPlane = null;

    const miniScenes = [];

    const translations = {
      en: {
        logo: "Starlit Pet Memorial Garden",
        backBtn: "Back to edit",
        panelTitle: "Tombstone style",
        panelSubtitle: "Choose a 3D tombstone. The center preview will update immediately.",
        title: "Choose a tombstone",
        subtitle: "This is a 3D preview. The final memorial will use the same style.",
        confirmBtn: "Use this tombstone",
        roundedName: "Rounded stone",
        roundedDesc: "Classic and gentle.",
        squareName: "Soft square",
        squareDesc: "Clean and quiet.",
        archName: "Tall arch",
        archDesc: "Calm and solemn.",
        defaultName: "Luna",
        defaultWords: "You are loved, always.",
        publicText: "Public",
        privateText: "Private",
        inviteText: "Invite only"
      },
      zh: {
        logo: "星眠宠物纪念园",
        backBtn: "返回修改",
        panelTitle: "墓碑样式",
        panelSubtitle: "选择一个 3D 墓碑，中间预览会立刻变化。",
        title: "选择墓碑",
        subtitle: "这里是 3D 预览，最终纪念页会使用同一种样式。",
        confirmBtn: "使用这个墓碑",
        roundedName: "圆顶墓碑",
        roundedDesc: "经典、温柔。",
        squareName: "方角墓碑",
        squareDesc: "干净、安静。",
        archName: "高拱墓碑",
        archDesc: "平静、庄重。",
        defaultName: "露娜",
        defaultWords: "永远爱你。",
        publicText: "公开",
        privateText: "私密",
        inviteText: "邀请可见"
      },
      "zh-TW": {
        logo: "星眠寵物紀念園",
        backBtn: "返回修改",
        panelTitle: "墓碑樣式",
        panelSubtitle: "選擇一個 3D 墓碑，中間預覽會立刻變化。",
        title: "選擇墓碑",
        subtitle: "這裡是 3D 預覽，最終紀念頁會使用同一種樣式。",
        confirmBtn: "使用這個墓碑",
        roundedName: "圓頂墓碑",
        roundedDesc: "經典、溫柔。",
        squareName: "方角墓碑",
        squareDesc: "乾淨、安靜。",
        archName: "高拱墓碑",
        archDesc: "平靜、莊重。",
        defaultName: "露娜",
        defaultWords: "永遠愛你。",
        publicText: "公開",
        privateText: "私密",
        inviteText: "邀請可見"
      }
    };

    ["ja","ko","es","fr","de","pt","it","th","vi","id","ms","hi","ar"].forEach(function(lang) {
      translations[lang] = translations.en;
    });

    function getText() {
      return translations[currentLang] || translations.en;
    }

    function getMemorialData() {
      return JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
    }

    function getVisibilityText(value) {
      const text = getText();

      if (value === "private") return text.privateText;
      if (value === "invite") return text.inviteText;
      return text.publicText;
    }

    function changeLanguage(lang) {
      currentLang = translations[lang] ? lang : "en";
      localStorage.setItem("siteLanguage", currentLang);

      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      const select = document.getElementById("languageSelect");
      if (select) select.value = currentLang;

      const text = getText();

      document.querySelectorAll("[data-key]").forEach(function(el) {
        const key = el.getAttribute("data-key");
        if (text[key]) el.textContent = text[key];
      });

      rebuildMainTextTexture();
    }

    function normalizeStyle(style) {
      if (style === "square") return "square";
      if (style === "arch") return "arch";
      return "rounded";
    }

    function buildRoundedShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.18, -1.75);
      s.lineTo(-1.18, 0.62);
      s.quadraticCurveTo(-1.18, 1.72, 0, 1.72);
      s.quadraticCurveTo(1.18, 1.72, 1.18, 0.62);
      s.lineTo(1.18, -1.75);
      s.closePath();
      return s;
    }

    function buildSquareShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.24, -1.75);
      s.lineTo(-1.24, 1.45);
      s.quadraticCurveTo(-1.24, 1.72, -0.98, 1.72);
      s.lineTo(0.98, 1.72);
      s.quadraticCurveTo(1.24, 1.72, 1.24, 1.45);
      s.lineTo(1.24, -1.75);
      s.closePath();
      return s;
    }

    function buildArchShape() {
      const s = new THREE.Shape();
      s.moveTo(-1.22, -1.78);
      s.lineTo(-1.22, 0.45);
      s.absarc(0, 0.45, 1.22, Math.PI, 0, true);
      s.lineTo(1.22, -1.78);
      s.closePath();
      return s;
    }

    function buildTombstoneShape(style) {
      const normalized = normalizeStyle(style);
      if (normalized === "square") return buildSquareShape();
      if (normalized === "arch") return buildArchShape();
      return buildRoundedShape();
    }

    function createStoneMaterial() {
      return new THREE.MeshStandardMaterial({
        color: 0x8d8780,
        roughness: 0.96,
        metalness: 0.0
      });
    }

    function createSideMaterial() {
      return new THREE.MeshStandardMaterial({
        color: 0x6f6963,
        roughness: 0.98,
        metalness: 0.0
      });
    }

    function createBaseMaterial() {
      return new THREE.MeshStandardMaterial({
        color: 0x777069,
        roughness: 0.98,
        metalness: 0.0
      });
    }

    function createTextTexture(memorial) {
      const text = getText();

      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 1024, 1024);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "rgba(56, 52, 48, 0.30)";
      ctx.font = "600 46px Arial";
      ctx.fillText("🐾", 512, 180);

      ctx.fillStyle = "rgba(58, 53, 48, 0.35)";
      ctx.beginPath();
      roundRect(ctx, 400, 240, 224, 52, 26);
      ctx.fill();

      ctx.fillStyle = "rgba(45, 40, 36, 0.55)";
      ctx.font = "500 26px 'Microsoft YaHei', Arial";
      ctx.fillText(getVisibilityText(memorial.visibility), 512, 266);

      ctx.fillStyle = "rgba(44, 40, 36, 0.78)";
      ctx.font = "500 78px 'Microsoft YaHei', Arial";
      ctx.fillText(memorial.name || text.defaultName, 512, 440);

      ctx.fillStyle = "rgba(48, 44, 40, 0.62)";
      ctx.font = "400 34px 'Microsoft YaHei', Arial";
      const birth = memorial.birthDate || "----";
      const leave = memorial.leaveDate || "----";
      ctx.fillText(birth + " — " + leave, 512, 540);

      ctx.fillStyle = "rgba(50, 46, 42, 0.58)";
      ctx.font = "italic 32px 'Microsoft YaHei', Arial";
      drawWrappedText(
        ctx,
        memorial.epitaph || memorial.memory || text.defaultWords,
        512,
        660,
        460,
        44,
        3
      );

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawWrappedText(ctx, value, x, y, maxWidth, lineHeight, maxLines) {
      const text = String(value || "");
      const chars = text.split("");
      const lines = [];
      let current = "";

      for (let i = 0; i < chars.length; i++) {
        const test = current + chars[i];
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = chars[i];
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);

      const finalLines = lines.slice(0, maxLines);
      if (lines.length > maxLines && finalLines.length) {
        finalLines[finalLines.length - 1] = finalLines[finalLines.length - 1].slice(0, -1) + "…";
      }

      finalLines.forEach(function(line, index) {
        ctx.fillText(line, x, y + index * lineHeight);
      });
    }

    function makeGlowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;

      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(256, 270, 10, 256, 270, 220);

      gradient.addColorStop(0, "rgba(255, 224, 180, 0.25)");
      gradient.addColorStop(0.36, "rgba(255, 224, 180, 0.12)");
      gradient.addColorStop(1, "rgba(255, 224, 180, 0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function makeShadowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;

      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(256, 256, 20, 256, 256, 220);

      gradient.addColorStop(0, "rgba(0,0,0,0.32)");
      gradient.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createStoneGroup(style, showText, scale) {
      const group = new THREE.Group();
      const normalized = normalizeStyle(style);

      const shape = buildTombstoneShape(normalized);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.46,
        bevelEnabled: true,
        bevelThickness: 0.045,
        bevelSize: 0.045,
        bevelSegments: 4,
        curveSegments: 28
      });

      geometry.center();

      const stoneMesh = new THREE.Mesh(geometry, createStoneMaterial());
      stoneMesh.castShadow = false;
      stoneMesh.receiveShadow = false;
      stoneMesh.position.y = 0.28;
      stoneMesh.rotation.y = -0.08;
      group.add(stoneMesh);

      const sideGeo = new THREE.BoxGeometry(2.55, 3.32, 0.18);
      const sideMesh = new THREE.Mesh(sideGeo, createSideMaterial());
      sideMesh.position.set(0.1, 0.28, -0.33);
      sideMesh.rotation.y = -0.08;
      group.add(sideMesh);

      const baseGeo = new THREE.BoxGeometry(3.35, 0.38, 1.14);
      const baseMesh = new THREE.Mesh(baseGeo, createBaseMaterial());
      baseMesh.position.set(0, -1.78, -0.04);
      baseMesh.rotation.y = -0.08;
      group.add(baseMesh);

      const lipGeo = new THREE.BoxGeometry(3.05, 0.18, 0.96);
      const lipMesh = new THREE.Mesh(lipGeo, createBaseMaterial());
      lipMesh.position.set(0, -1.50, 0.02);
      lipMesh.rotation.y = -0.08;
      group.add(lipMesh);

      const shadowMat = new THREE.MeshBasicMaterial({
        map: makeShadowTexture(),
        transparent: true,
        depthWrite: false,
        opacity: 0.72
      });

      const shadow = new THREE.Mesh(new THREE.PlaneGeometry(4.7, 1.8), shadowMat);
      shadow.position.set(0, -2.05, -0.55);
      group.add(shadow);

      const glowMat = new THREE.MeshBasicMaterial({
        map: makeGlowTexture(),
        transparent: true,
        depthWrite: false,
        opacity: 0.45
      });

      const glow = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4), glowMat);
      glow.position.set(0, -0.16, -0.82);
      group.add(glow);

      if (showText) {
        const memorial = getMemorialData();
        const textTexture = createTextTexture(memorial);

        const textMat = new THREE.MeshBasicMaterial({
          map: textTexture,
          transparent: true,
          depthWrite: false,
          opacity: 0.86
        });

        mainTextPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.32, 2.92), textMat);
        mainTextPlane.position.set(0, 0.24, 0.27);
        mainTextPlane.rotation.y = -0.08;
        group.add(mainTextPlane);
      }

      group.scale.set(scale, scale, scale);

      return group;
    }

    function initMainScene() {
      const container = document.getElementById("mainStoneScene");
      if (!container || !window.THREE) return;

      mainScene = new THREE.Scene();

      mainCamera = new THREE.PerspectiveCamera(
        30,
        container.clientWidth / container.clientHeight,
        0.1,
        100
      );
      mainCamera.position.set(0, 0.16, 8.8);

      mainRenderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

      mainRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      mainRenderer.setSize(container.clientWidth, container.clientHeight);
      mainRenderer.outputColorSpace = THREE.SRGBColorSpace;

      container.innerHTML = "";
      container.appendChild(mainRenderer.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 1.42);
      mainScene.add(ambient);

      const hemi = new THREE.HemisphereLight(0xcbd8ff, 0x5d5146, 0.92);
      mainScene.add(hemi);

      const moonLight = new THREE.DirectionalLight(0xd4ddff, 1.25);
      moonLight.position.set(-4, 7, 6);
      mainScene.add(moonLight);

      const warmLight = new THREE.PointLight(0xffd3a0, 1.65, 18, 2);
      warmLight.position.set(2.4, -0.7, 5.6);
      mainScene.add(warmLight);

      const fill = new THREE.PointLight(0xffffff, 0.35, 18, 2);
      fill.position.set(-2.5, 1.0, 4.5);
      mainScene.add(fill);

      buildMainStone(selectedStoneStyle);
      renderMainScene();

      window.addEventListener("resize", resizeMainScene);
    }

    function buildMainStone(style) {
      selectedStoneStyle = normalizeStyle(style);

      if (!mainScene) return;

      if (mainStoneGroup) {
        mainScene.remove(mainStoneGroup);
      }

      mainTextPlane = null;
      mainStoneGroup = createStoneGroup(selectedStoneStyle, true, 0.78);
      mainStoneGroup.position.y = -0.15;
      mainScene.add(mainStoneGroup);

      renderMainScene();
    }

    function renderMainScene() {
      if (!mainRenderer || !mainScene || !mainCamera) return;
      mainRenderer.render(mainScene, mainCamera);
    }

    function resizeMainScene() {
      const container = document.getElementById("mainStoneScene");
      if (!container || !mainRenderer || !mainCamera) return;

      mainRenderer.setSize(container.clientWidth, container.clientHeight);
      mainCamera.aspect = container.clientWidth / container.clientHeight;
      mainCamera.updateProjectionMatrix();
      renderMainScene();
    }

    function rebuildMainTextTexture() {
      if (!mainTextPlane) return;

      const texture = createTextTexture(getMemorialData());

      if (mainTextPlane.material.map) {
        mainTextPlane.material.map.dispose();
      }

      mainTextPlane.material.map = texture;
      mainTextPlane.material.needsUpdate = true;

      renderMainScene();
    }

    function initMiniScene(containerId, style) {
      const container = document.getElementById(containerId);
      if (!container || !window.THREE) return;

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        32,
        container.clientWidth / container.clientHeight,
        0.1,
        100
      );
      camera.position.set(0, 0.08, 7.2);

      const renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      container.innerHTML = "";
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1.38));

      const light = new THREE.DirectionalLight(0xd8e1ff, 1.2);
      light.position.set(-3, 5, 5);
      scene.add(light);

      const warm = new THREE.PointLight(0xffd2a0, 1.2, 12, 2);
      warm.position.set(2, -0.6, 4);
      scene.add(warm);

      const group = createStoneGroup(style, false, 0.70);
      group.position.y = -0.18;
      scene.add(group);

      renderer.render(scene, camera);

      miniScenes.push({
        container,
        renderer,
        camera,
        scene
      });
    }

    function resizeMiniScenes() {
      miniScenes.forEach(function(item) {
        const width = item.container.clientWidth;
        const height = item.container.clientHeight;

        item.renderer.setSize(width, height);
        item.camera.aspect = width / height;
        item.camera.updateProjectionMatrix();
        item.renderer.render(item.scene, item.camera);
      });
    }

    function selectStone(style, button) {
      selectedStoneStyle = normalizeStyle(style);

      document.querySelectorAll(".stone-option").forEach(function(btn) {
        btn.classList.remove("active");
      });

      if (button) {
        button.classList.add("active");
      }

      buildMainStone(selectedStoneStyle);
    }

    function confirmStone() {
      const data = getMemorialData();
      data.tombstoneStyle = selectedStoneStyle;
      localStorage.setItem("myPetMemorial", JSON.stringify(data));

      document.body.classList.add("planting");

      setTimeout(function() {
        window.location.replace("cemetery.html");
      }, 850);
    }

    function initFromSavedData() {
      const data = getMemorialData();
      selectedStoneStyle = normalizeStyle(data.tombstoneStyle || "rounded");

      const activeButton = document.querySelector('[data-style="' + selectedStoneStyle + '"]');
      if (activeButton) {
        document.querySelectorAll(".stone-option").forEach(function(btn) {
          btn.classList.remove("active");
        });
        activeButton.classList.add("active");
      }
    }

    window.addEventListener("DOMContentLoaded", function() {
      initFromSavedData();

      initMainScene();
      initMiniScene("miniRounded", "rounded");
      initMiniScene("miniSquare", "square");
      initMiniScene("miniArch", "arch");

      const savedLanguage = localStorage.getItem("siteLanguage") || "en";
      changeLanguage(savedLanguage);

      window.addEventListener("resize", function() {
        resizeMiniScenes();
        resizeMainScene();
      });
    });
  </script>
</body>
</html>
