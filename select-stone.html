<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择墓碑</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #fffaf5;
      background: #0b1118;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(
          180deg,
          rgba(6, 10, 18, 0.04) 0%,
          rgba(6, 10, 18, 0.12) 45%,
          rgba(6, 10, 18, 0.26) 100%
        ),
        url("cemetery-bg.png") center center / cover no-repeat;
      transform: scale(1.08);
      transform-origin: center center;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 52% 59%, rgba(255, 225, 180, 0.08), transparent 22%),
        radial-gradient(circle at 13% 84%, rgba(255, 198, 113, 0.07), transparent 16%),
        radial-gradient(circle at 88% 84%, rgba(255, 205, 128, 0.06), transparent 17%);
    }

    button, a, select, textarea {
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    .top-bar {
      position: absolute;
      top: 30px;
      left: 50%;
      width: min(1320px, calc(100% - 68px));
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .logo {
      color: rgba(255,250,245,0.96);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.34);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .soft-button,
    .language-select,
    .bottom-button {
      border: 1px solid rgba(255,250,245,0.30);
      background: rgba(255,250,245,0.08);
      color: #fffaf5;
      padding: 10px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.22s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .soft-button:hover,
    .language-select:hover,
    .bottom-button:hover {
      background: rgba(255,250,245,0.16);
      border-color: rgba(255,250,245,0.42);
    }

    .language-select {
      min-width: 146px;
    }

    .language-select option {
      color: #2d2520;
      background: #fffaf5;
    }

    .left-panel {
      position: absolute;
      left: calc(50% - 520px);
      top: 50%;
      width: 270px;
      transform: translateY(-47%);
      z-index: 30;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 500;
      color: rgba(255,250,245,0.96);
      text-shadow: 0 3px 16px rgba(0,0,0,0.34);
    }

    .panel-subtitle {
      margin: 0 0 20px;
      color: rgba(255,244,232,0.70);
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }

    .stone-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stone-option {
      width: 100%;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: #fffaf5;
      text-align: left;
    }

    .stone-option-inner {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 13px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255,250,245,0.13);
      background: rgba(255,250,245,0.055);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: 0.22s ease;
    }

    .stone-option:hover .stone-option-inner {
      background: rgba(255,250,245,0.11);
      border-color: rgba(255,250,245,0.28);
      transform: translateX(5px);
    }

    .stone-option.active .stone-option-inner {
      background: rgba(255,250,245,0.17);
      border-color: rgba(255,250,245,0.48);
    }

    .mini-preview {
      width: 70px;
      height: 86px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 52% 34%, rgba(255,255,255,0.07), transparent 55%),
        radial-gradient(circle at 18% 80%, rgba(255,200,115,0.10), transparent 45%);
    }

    .mini-stone {
      position: absolute;
      left: 50%;
      bottom: 17px;
      width: 30px;
      height: 48px;
      transform: translateX(-50%);
      background:
        linear-gradient(130deg, rgba(175,183,190,0.16), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.07), rgba(0,0,0,0.10)),
        linear-gradient(110deg, #6f6960, #5f5851 45%, #4b4641);
      box-shadow:
        inset 8px 0 10px rgba(195,210,235,0.05),
        inset -10px 0 12px rgba(0,0,0,0.16),
        0 8px 12px rgba(0,0,0,0.26);
      opacity: 0.92;
    }

    .mini-stone::after {
      content: "";
      position: absolute;
      left: -6px;
      right: -6px;
      bottom: -9px;
      height: 9px;
      border-radius: 2px;
      background: linear-gradient(180deg, #514b45, #302d2a);
      box-shadow: 0 5px 10px rgba(0,0,0,0.30);
    }

    .mini-rounded { border-radius: 16px 16px 5px 5px; }
    .mini-square { border-radius: 5px; }
    .mini-arch { border-radius: 17px 17px 5px 5px / 22px 22px 5px 5px; }

    .option-name {
      margin: 0 0 4px;
      font-size: 14px;
      color: rgba(255,250,245,0.93);
    }

    .option-desc {
      margin: 0;
      color: rgba(255,244,232,0.58);
      font-size: 12px;
      line-height: 1.5;
    }

    .confirm-button {
      width: 100%;
      margin-top: 22px;
      border: 1px solid rgba(255,250,245,0.52);
      background: rgba(255,250,245,0.88);
      color: #4b3d35;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      transition: 0.22s ease;
    }

    .confirm-button:hover {
      background: rgba(255,250,245,0.96);
      transform: translateY(-1px);
    }

    .instruction {
      position: absolute;
      top: 126px;
      left: 50%;
      width: min(720px, 90%);
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 3px 18px rgba(0,0,0,0.36);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .instruction h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      color: rgba(255,248,239,0.96);
    }

    .instruction p {
      margin: 0;
      color: rgba(255,244,232,0.72);
      font-size: 14px;
      line-height: 1.7;
    }

    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 500px;
      height: 580px;
      transform: translate(-50%, -44%);
      z-index: 18;
      pointer-events: none;
      transition:
        width 1.25s cubic-bezier(0.22,0.82,0.22,1),
        height 1.25s cubic-bezier(0.22,0.82,0.22,1),
        transform 1.25s cubic-bezier(0.22,0.82,0.22,1);
    }

    body.planting .stage,
    body.memorial-mode .stage {
      width: 350px;
      height: 445px;
      transform: translate(calc(-50% - 72px), calc(-44% + 4px));
    }

    .stone-image-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 360px;
      height: 470px;
      transform: translate(-50%, -50%) scale(1);
      transition: transform 1.25s cubic-bezier(0.22,0.82,0.22,1);
    }

    body.planting .stone-image-wrap,
    body.memorial-mode .stone-image-wrap {
      transform: translate(-50%, -50%) scale(0.88);
    }

    .ground-shadow {
      position: absolute;
      left: 50%;
      bottom: 28px;
      width: 320px;
      height: 54px;
      transform: translateX(-50%);
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.22) 42%, rgba(0,0,0,0.06) 72%, transparent 100%);
      filter: blur(8px);
      opacity: 0.88;
    }

    .stone-asset {
      position: absolute;
      left: 50%;
      bottom: 54px;
      width: 285px;
      height: 385px;
      transform: translateX(-50%);
      filter:
        drop-shadow(0 18px 24px rgba(0,0,0,0.26))
        drop-shadow(-10px 0 18px rgba(28,43,64,0.12))
        drop-shadow(8px 10px 16px rgba(255,184,98,0.06));
    }

    .stone-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .engraving-layer {
      position: absolute;
      left: 50%;
      top: 92px;
      width: 176px;
      transform: translateX(-50%);
      text-align: center;
      color: rgba(55,48,43,0.52);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.09),
        0 -1px 0 rgba(0,0,0,0.12);
      mix-blend-mode: multiply;
      opacity: 0.82;
      pointer-events: none;
    }

    .paw {
      font-size: 22px;
      opacity: 0.32;
      margin-bottom: 10px;
    }

    .visibility-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(60,50,43,0.08);
      color: rgba(54,47,41,0.48);
      margin-bottom: 18px;
    }

    .pet-photo {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 12px;
      display: none;
      opacity: 0.70;
      filter: grayscale(34%) sepia(12%) contrast(0.88) brightness(0.92);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.16),
        0 0 0 1px rgba(255,255,255,0.07);
    }

    .pet-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .pet-name {
      font-size: 25px;
      line-height: 1.25;
      margin-bottom: 10px;
      color: rgba(50,43,38,0.58);
      font-weight: 500;
    }

    .pet-years {
      font-size: 12px;
      line-height: 1.45;
      color: rgba(55,48,42,0.46);
      margin-bottom: 12px;
      word-break: break-word;
    }

    .pet-words {
      font-size: 11px;
      line-height: 1.7;
      color: rgba(58,50,44,0.40);
      max-height: 58px;
      overflow: hidden;
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(24px);
      z-index: 40;
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 999px;
      background: rgba(20,22,20,0.36);
      border: 1px solid rgba(255,250,245,0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    body.memorial-mode .bottom-dock {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    body.planting .top-bar .soft-button:first-child,
    body.memorial-mode .top-bar .soft-button:first-child {
      display: none;
    }

    body.planting .left-panel,
    body.memorial-mode .left-panel {
      opacity: 0;
      transform: translateY(-47%) translateX(-20px);
      pointer-events: none;
    }

    body.planting .instruction,
    body.memorial-mode .instruction {
      opacity: 0;
      transform: translateX(-50%) translateY(-12px);
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: rgba(5,7,8,0.64);
    }

    .modal-layer.show {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: min(760px, 92vw);
      max-height: 82vh;
      overflow-y: auto;
      padding: 30px;
      border-radius: 30px;
      background: rgba(255,250,245,0.95);
      color: #4b3d35;
      box-shadow: 0 26px 80px rgba(0,0,0,0.45);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(75,61,53,0.10);
      color: #4b3d35;
      font-size: 26px;
      cursor: pointer;
    }

    .modal-card h2 {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 500;
    }

    .modal-card p {
      margin: 0;
      line-height: 1.8;
      color: rgba(75,61,53,0.75);
      font-size: 15px;
    }

    .photo-block {
      margin-bottom: 26px;
    }

    .photo-block h3 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 500;
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .gallery-photo {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(120,95,70,0.08);
      border: 1px solid rgba(134,103,75,0.16);
      cursor: zoom-in;
    }

    .gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty-text {
      color: rgba(75,61,53,0.46);
      font-size: 14px;
    }

    .gift-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gift-buttons button,
    .message-box button {
      border: none;
      background: #715843;
      color: #fffaf5;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .animal-status {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 18px;
      background: rgba(118,91,66,0.08);
      color: rgba(75,61,53,0.66);
      font-size: 13px;
      line-height: 1.6;
    }

    .placed-items {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 28px;
    }

    .placed-item-badge {
      display: inline-flex;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(113,88,67,0.10);
      color: rgba(75,61,53,0.72);
      font-size: 13px;
    }

    .message-box textarea {
      width: 100%;
      height: 108px;
      border: 1px solid rgba(134,103,75,0.22);
      background: rgba(255,255,255,0.72);
      color: #4b3d35;
      padding: 14px;
      border-radius: 18px;
      font-size: 14px;
      resize: none;
    }

    .message-list {
      margin-top: 14px;
    }

    .message-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(134,103,75,0.14);
      color: rgba(75,61,53,0.72);
      line-height: 1.6;
      font-size: 14px;
    }

    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5,7,8,0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .photo-lightbox.show {
      display: flex;
    }

    .photo-lightbox img {
      max-width: min(92vw, 1100px);
      max-height: 86vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 26px 80px rgba(0,0,0,0.55);
    }

    .lightbox-close {
      position: fixed;
      top: 22px;
      right: 24px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.32);
      background: rgba(255,255,255,0.10);
      color: #fffaf5;
      border-radius: 50%;
      font-size: 26px;
      cursor: pointer;
      z-index: 210;
    }

    @media (max-width: 980px) {
      html, body {
        overflow: auto;
        min-height: 100%;
      }

      .page {
        min-height: 100vh;
        height: auto;
      }

      .top-bar {
        top: 22px;
        width: calc(100% - 36px);
        align-items: flex-start;
      }

      .top-actions {
        flex-direction: column;
        align-items: flex-end;
      }

      .left-panel {
        position: relative;
        left: auto;
        top: auto;
        width: min(460px, calc(100% - 36px));
        margin: 620px auto 120px;
        transform: none;
      }

      .instruction {
        top: 110px;
      }

      .instruction h1 {
        font-size: 28px;
      }

      .stage {
        top: 330px;
        width: min(92vw, 440px);
        height: 500px;
        transform: translate(-50%, 0);
      }

      body.planting .stage,
      body.memorial-mode .stage {
        width: min(86vw, 335px);
        height: min(52vh, 410px);
        transform: translate(calc(-50% - 10px), 6px);
      }

      .bottom-dock {
        width: calc(100vw - 24px);
        justify-content: center;
        flex-wrap: wrap;
        border-radius: 28px;
        bottom: 18px;
      }

      .photo-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="top-bar">
      <a href="index.html" class="logo" data-key="logo">星眠宠物纪念园</a>

      <div class="top-actions">
        <a href="create.html" class="soft-button" data-key="backBtn">返回修改</a>
        <button class="soft-button" onclick="editStoneAgain()" data-key="changeStoneBtn">更换墓碑</button>

        <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="th">ไทย</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>

    <aside class="left-panel">
      <h2 class="panel-title" data-key="panelTitle">墓碑样式</h2>
      <p class="panel-subtitle" data-key="panelSubtitle">选择一个墓碑，中间预览会立刻变化。</p>

      <div class="stone-list">
        <button class="stone-option active" data-style="rounded" onclick="selectStone('rounded', this)">
          <div class="stone-option-inner">
            <div class="mini-preview"><div class="mini-stone mini-rounded"></div></div>
            <div>
              <p class="option-name" data-key="roundedName">圆顶墓碑</p>
              <p class="option-desc" data-key="roundedDesc">经典、温柔。</p>
            </div>
          </div>
        </button>

        <button class="stone-option" data-style="square" onclick="selectStone('square', this)">
          <div class="stone-option-inner">
            <div class="mini-preview"><div class="mini-stone mini-square"></div></div>
            <div>
              <p class="option-name" data-key="squareName">方角墓碑</p>
              <p class="option-desc" data-key="squareDesc">干净、安静。</p>
            </div>
          </div>
        </button>

        <button class="stone-option" data-style="arch" onclick="selectStone('arch', this)">
          <div class="stone-option-inner">
            <div class="mini-preview"><div class="mini-stone mini-arch"></div></div>
            <div>
              <p class="option-name" data-key="archName">高拱墓碑</p>
              <p class="option-desc" data-key="archDesc">平静、庄重。</p>
            </div>
          </div>
        </button>
      </div>

      <button class="confirm-button" onclick="confirmStone()" data-key="confirmBtn">使用这个墓碑</button>
    </aside>

    <section class="instruction">
      <h1 data-key="title">选择墓碑</h1>
      <p data-key="subtitle">墓碑会慢慢转正，并安静地落到纪念园中。</p>
    </section>

    <main class="stage">
      <div class="stone-image-wrap">
        <div class="ground-shadow"></div>

        <div class="stone-asset" id="stoneAsset">
          <svg class="stone-svg" viewBox="0 0 285 385" preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="stoneNoise" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="noise"/>
                <feColorMatrix type="saturate" values="0"/>
                <feComponentTransfer>
                  <feFuncA type="table" tableValues="0 0.16"/>
                </feComponentTransfer>
                <feBlend mode="soft-light" in2="SourceGraphic"/>
              </filter>

              <linearGradient id="stoneMain" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8a8378"/>
                <stop offset="33%" stop-color="#756d64"/>
                <stop offset="64%" stop-color="#635c55"/>
                <stop offset="100%" stop-color="#4f4943"/>
              </linearGradient>

              <linearGradient id="stoneMoon" x1="0%" y1="0%" x2="100%" y2="100%">

              <radialGradient id="warmLight" cx="78%" cy="90%" r="70%">
                <stop offset="0%" stop-color="rgba(255,200,125,0.26)"/>
                <stop offset="55%" stop-color="rgba(255,200,125,0.06)"/>
                <stop offset="100%" stop-color="rgba(255,200,125,0)"/>

              <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6a6259"/>

              <clipPath id="roundedClip">
                <path id="stonePath" d="M72 306 L72 112 C72 54 102 26 142.5 26 C183 26 213 54 213 112 L213 306 Z"/>

            <g id="stoneGraphic">
              <ellipse cx="143" cy="344" rx="132" ry="24" fill="rgba(0,0,0,0.22)"/>

              <g id="bodyGroup" clip-path="url(#roundedClip)">
                <rect x="54" y="18" width="177" height="300" fill="url(#stoneMain)" filter="url(#stoneNoise)"/>

                      fill="none"
                      stroke="rgba(255,255,255,0.08)"
                      stroke-width="1.2"/>
                <path d="M82 298 L82 116 C82 64 108 40 142.5 40 C177 40 203 64 203 116 L203 298 Z"
                      fill="none"
                      stroke="rgba(255,255,255,0.045)"
                      stroke-width="1"/>
                <path d="M72 306 L72 112 C72 54 102 26 142.5 26 C183 26 213 54 213 112 L213 306 Z"
                      fill="rgba(0,0,0,0.06)"/>
              </g>

              <rect x="54" y="300" width="178" height="30" rx="3" fill="url(#baseGrad)" filter="url(#stoneNoise)"/>

          <div class="engraving-layer">
            <div class="paw">🐾</div>
            <div class="visibility-badge" id="visibilityDisplay">公开</div>
            <div class="pet-photo" id="petPhotoDisplay"><img id="petPhotoImg" src="" alt=""></div>
            <div class="pet-name" id="petNameDisplay">猫宝</div>
            <div class="pet-years" id="petYearsDisplay">---- — ----</div>

    </main>

    <div class="bottom-dock">
      <button class="bottom-button" onclick="openPanel('storyPanel')" data-key="storyBtn">故事</button>
      <button class="bottom-button" onclick="openPanel('photosPanel')" data-key="photosBtn">相册</button>
      <button class="bottom-button" onclick="openPanel('giftPanel')" data-key="giftBtn">礼物</button>
      <button class="bottom-button" onclick="openPanel('messagePanel')" data-key="messageBtnShort">留言</button>
    </div>
  </div>

  <div class="modal-layer" id="storyPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="storyTitle">宠物故事</h2>
      <p id="petStoryDisplay" class="empty-text">还没有写下故事。</p>
    </div>
  </div>

  <div class="modal-layer" id="photosPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="photosTitle">回忆相册</h2>

      <div class="photo-block">
        <h3 data-key="publicPhotosTitle">公开回忆照片</h3>
        <div id="publicPhotosDisplay" class="photo-gallery"></div>
      </div>

      <div class="photo-block">
        <h3 data-key="privatePhotosTitle">私密回忆照片</h3>
        <p class="empty-text" style="margin-bottom:12px;" data-key="privatePhotosDesc">
          这些照片目前只会显示在你的浏览器演示中。
        </p>
        <div id="privatePhotosDisplay" class="photo-gallery"></div>
      </div>
    </div>
  </div>

  <div class="modal-layer" id="giftPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="giftTitle">放置一个小礼物</h2>

      <div class="gift-buttons">
        <button onclick="placeGift('can')" data-key="giftCan">放一个罐头</button>
        <button onclick="placeGift('ball')" data-key="giftBall">放一个球</button>
        <button onclick="placeGift('seed')" data-key="giftSeed">放一些鸟食</button>
        <button onclick="placeGift('flower')" data-key="giftFlower">放一些花</button>
      </div>

      <div class="animal-status" id="animalStatus" data-key="animalStatus">
        安静的小礼物，可能会吸引温柔的访客。
      </div>

      <div class="placed-items" id="placedItemsList"></div>
    </div>
  </div>

  <div class="modal-layer" id="messagePanel" onclick="closePanels(event)">
    <div class="modal-card message-box">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="messageTitle">留言</h2>
      <textarea id="messageInput" data-placeholder-key="messagePlaceholder" placeholder="写几句安静的话..."></textarea>
      <br><br>
      <button onclick="addMessage()" data-key="messageSendBtn">留下留言</button>
      <div id="messageList" class="message-list"></div>
    </div>
  </div>

  <div class="photo-lightbox" id="photoLightbox" onclick="closePhotoLightbox()">
    <button class="lightbox-close" onclick="closePhotoLightbox()">×</button>
    <img id="lightboxImage" src="" alt="">
  </div>

  <script>
    let currentLang = "zh";
    let selectedStoneStyle = "rounded";
    let isPlanting = false;

    const translations = {

      "zh-TW": {

        privatePhotosTitle: "私密回憶照片",
        privatePhotosDesc: "這些照片目前只會顯示在你的瀏覽器演示中。",
        giftTitle: "放置一個小禮物",
        giftCan: "放一個罐頭",
        giftBall: "放一個球",
        giftSeed: "放一些鳥食",
        giftFlower: "放一些花",
        animalStatus: "安靜的小禮物，可能會吸引溫柔的訪客。",
        messageTitle: "留言",
        messagePlaceholder: "寫幾句安靜的話...",
        messageSendBtn: "留下留言",
        noStory: "還沒有寫下故事。",
        noPhotos: "還沒有照片。",
        noMessages: "還沒有留言。",
        defaultName: "貓寶",
        defaultWords: "謝謝你陪我們走過那麼多溫柔的日子。",
        publicText: "公開",
        privateText: "私密",
        inviteText: "邀請可見",
        placedCan: "已放置罐頭",
        placedBall: "已放置球",
        placedSeed: "已放置鳥食",
        placedFlower: "已放置花"
      }
    };

    ["ja","ko","es","fr","de","pt","it","th","vi","id","ms","hi","ar"].forEach(function(lang) {
      translations[lang] = translations.en;
    });

    function getText() {
      return translations[currentLang] || translations.zh;
    }

    function getMemorialData() {
      return JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
    }

    function saveMemorialData(data) {
      localStorage.setItem("myPetMemorial", JSON.stringify(data));
    }

    function getVisibilityText(value) {
      const text = getText();
      if (value === "private") return text.privateText;
      if (value === "invite") return text.inviteText;
      return text.publicText;
    }

    function changeLanguage(lang) {
      currentLang = translations[lang] ? lang : "zh";
      localStorage.setItem("siteLanguage", currentLang);

      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      const select = document.getElementById("languageSelect");
      if (select) select.value = currentLang;

      const text = getText();

      document.querySelectorAll("[data-key]").forEach(function(el) {
        const key = el.getAttribute("data-key");
        if (text[key]) el.textContent = text[key];
      });

      document.querySelectorAll("[data-placeholder-key]").forEach(function(el) {
        const key = el.getAttribute("data-placeholder-key");
        if (text[key]) el.placeholder = text[key];
      });

      renderStone();
      loadExtraMemorialInfo();
      renderPlacedItems();
    }

    function selectStone(style, button) {
      if (isPlanting) return;

      selectedStoneStyle = style;

      const data = getMemorialData();
      data.tombstoneStyle = selectedStoneStyle;
      data.tombstoneConfirmed = false;
      saveMemorialData(data);

      document.body.classList.remove("memorial-mode");

      document.querySelectorAll(".stone-option").forEach(function(btn) {
        btn.classList.remove("active");
      });

      if (button) button.classList.add("active");

      applyStoneShape(style);
    }

    function applyStoneShape(style) {
      const path = document.getElementById("stonePath");

      if (style === "square") {
        path.setAttribute("d", "M70 306 L70 54 Q70 28 96 28 L189 28 Q215 28 215 54 L215 306 Z");
      } else if (style === "arch") {
        path.setAttribute("d", "M70 306 L70 116 C70 48 103 20 142.5 20 C182 20 215 48 215 116 L215 306 Z");
      } else {
        path.setAttribute("d", "M72 306 L72 112 C72 54 102 26 142.5 26 C183 26 213 54 213 112 L213 306 Z");
      }
    }

    function renderStone() {
      const data = getMemorialData();
      const text = getText();

      document.getElementById("petNameDisplay").textContent = data.name || text.defaultName;
      document.getElementById("petYearsDisplay").textContent = (data.birthDate || "----") + " — " + (data.leaveDate || "----");
      document.getElementById("petMemoryDisplay").textContent = data.epitaph || data.memory || text.defaultWords;
      document.getElementById("visibilityDisplay").textContent = getVisibilityText(data.visibility);

      const photo = data.stonePhoto || data.photo || "";
      const photoBox = document.getElementById("petPhotoDisplay");
      const photoImg = document.getElementById("petPhotoImg");

      if (photo) {
        photoImg.src = photo;
        photoBox.style.display = "block";
      } else {
        photoBox.style.display = "none";
      }

      applyStoneShape(selectedStoneStyle);
    }

    function confirmStone() {
      if (isPlanting) return;

      isPlanting = true;

      const data = getMemorialData();
      data.tombstoneStyle = selectedStoneStyle;
      data.tombstoneConfirmed = true;
      saveMemorialData(data);

      document.body.classList.add("planting");

      setTimeout(function() {
        document.body.classList.remove("planting");
        document.body.classList.add("memorial-mode");
        isPlanting = false;
        loadExtraMemorialInfo();
        renderPlacedItems();
      }, 1250);
    }

    function editStoneAgain() {
      if (isPlanting) return;

      const data = getMemorialData();
      data.tombstoneConfirmed = false;
      saveMemorialData(data);

      document.body.classList.remove("memorial-mode", "planting");
    }

    function initFromSavedData() {
      const data = getMemorialData();
      selectedStoneStyle = data.tombstoneStyle || "rounded";

      const activeButton = document.querySelector('[data-style="' + selectedStoneStyle + '"]');
      if (activeButton) {
        document.querySelectorAll(".stone-option").forEach(function(btn) {
          btn.classList.remove("active");
        });
        activeButton.classList.add("active");
      }

      if (data.tombstoneConfirmed === true) {
        document.body.classList.add("memorial-mode");
      }

      applyStoneShape(selectedStoneStyle);
      renderStone();
    }

    function openPanel(id) {
      closeAllPanels();
      const panel = document.getElementById(id);
      if (panel) panel.classList.add("show");
    }

    function closeAllPanels() {
      document.querySelectorAll(".modal-layer").forEach(function(panel) {
        panel.classList.remove("show");
      });
    }

    function closePanels(event) {
      if (event.target.classList.contains("modal-layer")) {
        closeAllPanels();
      }
    }

    function showPhotos(containerId, photos) {
      const container = document.getElementById(containerId);
      const text = getText();

      if (!container) return;

      container.innerHTML = "";

      if (!photos || photos.length === 0) {
        container.innerHTML = '<p class="empty-text">' + text.noPhotos + '</p>';
        return;
      }

      photos.forEach(function(photo) {
        const box = document.createElement("div");
        box.className = "gallery-photo";
        box.onclick = function() {
          openPhotoLightbox(photo);
        };

        const img = document.createElement("img");
        img.src = photo;

        box.appendChild(img);
        container.appendChild(box);
      });
    }

    function openPhotoLightbox(src) {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      image.src = src;
      lightbox.classList.add("show");
    }

    function closePhotoLightbox() {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      lightbox.classList.remove("show");
      image.src = "";
    }

    function loadExtraMemorialInfo() {
      const data = getMemorialData();
      const text = getText();

      const storyDisplay = document.getElementById("petStoryDisplay");

      if (storyDisplay) {
        if (data.story) {
          storyDisplay.textContent = data.story;
          storyDisplay.classList.remove("empty-text");
        } else {
          storyDisplay.textContent = text.noStory;
          storyDisplay.classList.add("empty-text");
        }
      }

      const publicPhotos = (data.publicPhotos && data.publicPhotos.length) ? data.publicPhotos : (data.photo ? [data.photo] : []);
      const privatePhotos = data.privatePhotos || [];

      showPhotos("publicPhotosDisplay", publicPhotos);
      showPhotos("privatePhotosDisplay", privatePhotos);

      renderMessages();
    }

    function getMessages() {
      return JSON.parse(localStorage.getItem("memorialMessages") || "[]");
    }

    function renderMessages() {
      const list = document.getElementById("messageList");
      const text = getText();

      if (!list) return;

      const messages = getMessages();
      list.innerHTML = "";

      if (!messages.length) {
        list.innerHTML = '<div class="message-item empty-text">' + text.noMessages + '</div>';
        return;
      }

      messages.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "message-item";
        div.textContent = item;
        list.appendChild(div);
      });
    }

    function addMessage() {
      const input = document.getElementById("messageInput");
      if (!input) return;

      const value = input.value.trim();
      if (!value) return;

      const messages = getMessages();
      messages.unshift(value);
      localStorage.setItem("memorialMessages", JSON.stringify(messages.slice(0, 20)));

      input.value = "";
      renderMessages();
    }

    function getPlacedItems() {
      return JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]");
    }

    function renderPlacedItems() {
      const box = document.getElementById("placedItemsList");
      const text = getText();

      if (!box) return;

      const items = getPlacedItems();
      box.innerHTML = "";

      items.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "placed-item-badge";

        if (item === "can") div.textContent = "🥫 " + text.placedCan;
        if (item === "ball") div.textContent = "🎾 " + text.placedBall;
        if (item === "seed") div.textContent = "🌾 " + text.placedSeed;
        if (item === "flower") div.textContent = "🌸 " + text.placedFlower;

        box.appendChild(div);
      });
    }

    function placeGift(type) {
      const items = getPlacedItems();
      items.unshift(type);
      localStorage.setItem("memorialPlacedItems", JSON.stringify(items.slice(0, 8)));
      renderPlacedItems();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePhotoLightbox();
        closeAllPanels();
      }
    });

    window.addEventListener("DOMContentLoaded", function() {
      initFromSavedData();

      const savedLanguage = localStorage.getItem("siteLanguage") || "zh";
      changeLanguage(savedLanguage);

      loadExtraMemorialInfo();
      renderPlacedItems();
    });
  </script>
</body>
