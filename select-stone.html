<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>选择墓碑</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #10140f;
      color: #fffaf5;
    }

    button, a, select, textarea {
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(6, 10, 18, 0.05) 0%,
          rgba(6, 10, 18, 0.12) 46%,
          rgba(6, 10, 18, 0.30) 100%
        ),
        url("cemetery-bg.png") center center / cover no-repeat;
      transform: scale(1.08);
      transform-origin: center center;
      z-index: 0;
    }

    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center 61%, rgba(255, 231, 190, 0.08), transparent 22%),
        radial-gradient(circle at center 64%, rgba(255, 255, 255, 0.04), transparent 34%);
      pointer-events: none;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: relative;
      z-index: 30;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 30px 34px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: rgba(255, 250, 245, 0.96);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.36);
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .soft-button,
    .language-select,
    .bottom-button {
      border: 1px solid rgba(255, 250, 245, 0.30);
      background: rgba(255, 250, 245, 0.08);
      color: #fffaf5;
      padding: 10px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .soft-button:hover,
    .language-select:hover,
    .bottom-button:hover {
      background: rgba(255, 250, 245, 0.16);
      border-color: rgba(255, 250, 245, 0.42);
    }

    .language-select {
      min-width: 146px;
    }

    .language-select option {
      color: #2d2520;
      background: #fffaf5;
    }

    .main-layout {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 270px 1fr 270px;
      gap: 24px;
      align-items: center;
      padding: 20px 34px 116px;
    }

    .left-panel {
      position: relative;
      z-index: 20;
      align-self: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 23px;
      font-weight: 500;
      color: rgba(255, 250, 245, 0.95);
      text-shadow: 0 3px 16px rgba(0,0,0,0.34);
    }

    .panel-subtitle {
      margin: 0 0 20px;
      color: rgba(255, 244, 232, 0.68);
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }

    .stone-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stone-option {
      width: 100%;
      border: none;
      padding: 0;
      background: transparent;
      color: #fffaf5;
      cursor: pointer;
      text-align: left;
    }

    .stone-option-inner {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 13px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255, 250, 245, 0.13);
      background: rgba(255, 250, 245, 0.055);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: 0.22s ease;
    }

    .stone-option:hover .stone-option-inner {
      background: rgba(255, 250, 245, 0.11);
      border-color: rgba(255, 250, 245, 0.28);
      transform: translateX(5px);
    }

    .stone-option.active .stone-option-inner {
      background: rgba(255, 250, 245, 0.17);
      border-color: rgba(255, 250, 245, 0.48);
    }

    .mini-3d {
      width: 70px;
      height: 86px;
      border-radius: 18px;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 70%);
    }

    .option-name {
      margin: 0 0 4px;
      font-size: 14px;
      color: rgba(255, 250, 245, 0.93);
    }

    .option-desc {
      margin: 0;
      color: rgba(255, 244, 232, 0.58);
      font-size: 12px;
      line-height: 1.5;
    }

    .confirm-button {
      width: 100%;
      margin-top: 22px;
      border: 1px solid rgba(255, 250, 245, 0.52);
      background: rgba(255, 250, 245, 0.88);
      color: #4b3d35;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      transition: 0.22s ease;
    }

    .confirm-button:hover {
      background: rgba(255, 250, 245, 0.96);
      transform: translateY(-1px);
    }

    .center-area {
      position: relative;
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .instruction {
      position: absolute;
      top: 12px;
      left: 50%;
      width: min(720px, 90%);
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 3px 18px rgba(0,0,0,0.36);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .instruction h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      color: rgba(255, 248, 239, 0.96);
    }

    .instruction p {
      margin: 0;
      color: rgba(255, 244, 232, 0.72);
      font-size: 14px;
      line-height: 1.7;
    }

    .scene-wrap {
      position: relative;
      width: min(500px, 54vw);
      height: min(580px, 68vh);
      min-width: 320px;
      min-height: 430px;
      margin-top: 42px;
      transition:
        width 1.25s cubic-bezier(0.22, 0.82, 0.22, 1),
        height 1.25s cubic-bezier(0.22, 0.82, 0.22, 1),
        transform 1.25s cubic-bezier(0.22, 0.82, 0.22, 1);
    }

    #mainStoneScene {
      position: absolute;
      inset: 0;
      border-radius: 26px;
    }

    .right-spacer {
      min-height: 1px;
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(24px);
      z-index: 40;
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 999px;
      background: rgba(20, 22, 20, 0.36);
      border: 1px solid rgba(255, 250, 245, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    body.memorial-mode .bottom-dock {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    body.planting .top-bar .soft-button:first-child,
    body.memorial-mode .top-bar .soft-button:first-child {
      display: none;
    }

    body.planting .left-panel,
    body.memorial-mode .left-panel {
      opacity: 0;
      transform: translateX(-20px);
      pointer-events: none;
    }

    body.planting .instruction,
    body.memorial-mode .instruction {
      opacity: 0;
      transform: translateX(-50%) translateY(-12px);
    }

    body.planting .scene-wrap,
    body.memorial-mode .scene-wrap {
      width: min(350px, 43vw);
      height: min(445px, 55vh);
      transform: translate(-72px, 4px);
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: rgba(5, 7, 8, 0.64);
    }

    .modal-layer.show { display: flex; }

    .modal-card {
      position: relative;
      width: min(760px, 92vw);
      max-height: 82vh;
      overflow-y: auto;
      padding: 30px;
      border-radius: 30px;
      background: rgba(255, 250, 245, 0.95);
      color: #4b3d35;
      box-shadow: 0 26px 80px rgba(0,0,0,0.45);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(75, 61, 53, 0.10);
      color: #4b3d35;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-card h2 {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 500;
      color: #4b3d35;
    }

    .modal-card p {
      margin: 0;
      line-height: 1.8;
      color: rgba(75, 61, 53, 0.75);
      font-size: 15px;
    }

    .photo-block { margin-bottom: 26px; }

    .photo-block h3 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 500;
      color: #4b3d35;
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .gallery-photo {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(120, 95, 70, 0.08);
      border: 1px solid rgba(134, 103, 75, 0.16);
      cursor: zoom-in;
    }

    .gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty-text {
      color: rgba(75, 61, 53, 0.46);
      font-size: 14px;
    }

    .gift-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gift-buttons button,
    .message-box button {
      border: none;
      background: #715843;
      color: #fffaf5;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .animal-status {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 18px;
      background: rgba(118, 91, 66, 0.08);
      color: rgba(75, 61, 53, 0.66);
      font-size: 13px;
      line-height: 1.6;
    }

    .placed-items {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 28px;
    }

    .placed-item-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(113, 88, 67, 0.10);
      color: rgba(75, 61, 53, 0.72);
      font-size: 13px;
    }

    .message-box textarea {
      width: 100%;
      height: 108px;
      border: 1px solid rgba(134, 103, 75, 0.22);
      background: rgba(255,255,255,0.72);
      color: #4b3d35;
      padding: 14px;
      border-radius: 18px;
      font-size: 14px;
      resize: none;
    }

    .message-list { margin-top: 14px; }

    .message-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(134, 103, 75, 0.14);
      color: rgba(75, 61, 53, 0.72);
      line-height: 1.6;
      font-size: 14px;
    }

    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5, 7, 8, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .photo-lightbox.show { display: flex; }

    .photo-lightbox img {
      max-width: min(92vw, 1100px);
      max-height: 86vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 26px 80px rgba(0,0,0,0.55);
    }

    .lightbox-close {
      position: fixed;
      top: 22px;
      right: 24px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.32);
      background: rgba(255,255,255,0.10);
      color: #fffaf5;
      border-radius: 50%;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      z-index: 210;
    }
  </style>
</head>

<body>
  <div class="page-bg"></div>

  <div class="page-shell">
    <header class="top-bar">
      <a href="index.html" class="logo" data-key="logo">星眠宠物纪念园</a>

      <div class="top-actions">
        <a href="create.html" class="soft-button" data-key="backBtn">返回修改</a>
        <button class="soft-button" onclick="editStoneAgain()" data-key="changeStoneBtn">更换墓碑</button>

        <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <main class="main-layout">
      <aside class="left-panel">
        <h2 class="panel-title" data-key="panelTitle">墓碑样式</h2>
        <p class="panel-subtitle" data-key="panelSubtitle">选择一个 3D 墓碑，中间预览会立刻变化。</p>

        <div class="stone-list">
          <button class="stone-option active" data-style="rounded" onclick="selectStone('rounded', this)">
            <div class="stone-option-inner">
              <div class="mini-3d" id="miniRounded"></div>
              <div>
                <p class="option-name" data-key="roundedName">圆顶墓碑</p>
                <p class="option-desc" data-key="roundedDesc">经典、温柔。</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="square" onclick="selectStone('square', this)">
            <div class="stone-option-inner">
              <div class="mini-3d" id="miniSquare"></div>
              <div>
                <p class="option-name" data-key="squareName">方角墓碑</p>
                <p class="option-desc" data-key="squareDesc">干净、安静。</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="arch" onclick="selectStone('arch', this)">
            <div class="stone-option-inner">
              <div class="mini-3d" id="miniArch"></div>
              <div>
                <p class="option-name" data-key="archName">高拱墓碑</p>
                <p class="option-desc" data-key="archDesc">平静、庄重。</p>
              </div>
            </div>
          </button>
        </div>

        <button class="confirm-button" onclick="confirmStone()" data-key="confirmBtn">使用这个墓碑</button>
      </aside>

      <section class="center-area">
        <div class="instruction">
          <h1 data-key="title">选择墓碑</h1>
          <p data-key="subtitle">墓碑会慢慢转正，并安静地落到纪念园中。</p>
        </div>

        <div class="scene-wrap">
          <div id="mainStoneScene"></div>
        </div>
      </section>

      <div class="right-spacer"></div>
    </main>
  </div>

  <div class="bottom-dock">
    <button class="bottom-button" onclick="openPanel('storyPanel')" data-key="storyBtn">故事</button>
    <button class="bottom-button" onclick="openPanel('photosPanel')" data-key="photosBtn">相册</button>
    <button class="bottom-button" onclick="openPanel('giftPanel')" data-key="giftBtn">礼物</button>
    <button class="bottom-button" onclick="openPanel('messagePanel')" data-key="messageBtnShort">留言</button>
  </div>

  <div class="modal-layer" id="storyPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="storyTitle">宠物故事</h2>
      <p id="petStoryDisplay" class="empty-text">还没有写下故事。</p>
    </div>
  </div>

  <div class="modal-layer" id="photosPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="photosTitle">回忆相册</h2>
      <div class="photo-block">
        <h3 data-key="publicPhotosTitle">公开回忆照片</h3>
        <div id="publicPhotosDisplay" class="photo-gallery"></div>
      </div>
      <div class="photo-block">
        <h3 data-key="privatePhotosTitle">私密回忆照片</h3>
        <p class="empty-text" style="margin-bottom:12px;" data-key="privatePhotosDesc">这些照片目前只会显示在你的浏览器演示中。</p>
        <div id="privatePhotosDisplay" class="photo-gallery"></div>
      </div>
    </div>
  </div>

  <div class="modal-layer" id="giftPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="giftTitle">放置一个小礼物</h2>
      <div class="gift-buttons">
        <button onclick="placeGift('can')" data-key="giftCan">放一个罐头</button>
        <button onclick="placeGift('ball')" data-key="giftBall">放一个球</button>
        <button onclick="placeGift('seed')" data-key="giftSeed">放一些鸟食</button>
        <button onclick="placeGift('flower')" data-key="giftFlower">放一些花</button>
      </div>
      <div class="animal-status" data-key="animalStatus">安静的小礼物，可能会吸引温柔的访客。</div>
      <div class="placed-items" id="placedItemsList"></div>
    </div>
  </div>

  <div class="modal-layer" id="messagePanel" onclick="closePanels(event)">
    <div class="modal-card message-box">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="messageTitle">留言</h2>
      <textarea id="messageInput" data-placeholder-key="messagePlaceholder" placeholder="写几句安静的话..."></textarea>
      <br><br>
      <button onclick="addMessage()" data-key="messageSendBtn">留下留言</button>
      <div id="messageList" class="message-list"></div>
    </div>
  </div>

  <div class="photo-lightbox" id="photoLightbox" onclick="closePhotoLightbox()">
    <button class="lightbox-close" onclick="closePhotoLightbox()">×</button>
    <img id="lightboxImage" src="" alt="">
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    function getText() {
      return translations[currentLang] || translations.zh;
    }

    function getMemorialData() {
      return JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
    }

    function saveMemorialData(data) {
      localStorage.setItem("myPetMemorial", JSON.stringify(data));
    }

    function getVisibilityText(value) {
      const text = getText();
      if (value === "private") return text.privateText;
      if (value === "invite") return text.inviteText;
      return text.publicText;
    }

    function normalizeStyle(style) {
      if (style === "square") return "square";
      if (style === "arch") return "arch";
      return "rounded";
    }

    function changeLanguage(lang) {
      currentLang = translations[lang] ? lang : "zh";
      localStorage.setItem("siteLanguage", currentLang);

      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      const select = document.getElementById("languageSelect");
      if (select) select.value = currentLang;

      const text = getText();

      document.querySelectorAll("[data-key]").forEach(function(el) {
        const key = el.getAttribute("data-key");
        if (text[key]) el.textContent = text[key];
      });

      document.querySelectorAll("[data-placeholder-key]").forEach(function(el) {
        const key = el.getAttribute("data-placeholder-key");
        if (text[key]) el.placeholder = text[key];
      });

      rebuildMainTextTexture();
      loadExtraMemorialInfo();
      renderPlacedItems();
    }

    function seededRandom(seed) {
      let value = seed;
      return function() {
        value = (value * 9301 + 49297) % 233280;
        return value / 233280;
      };
    }

    function createStoneTexture(baseHex, seed) {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");
      const rnd = seededRandom(seed || 12);

      function hexToRgb(hex) {
        const n = parseInt(hex.replace("#", ""), 16);
        return {
          r: (n >> 16) & 255,
          g: (n >> 8) & 255,
          b: n & 255
        };
      }

      const base = hexToRgb(baseHex);

      const baseGradient = ctx.createLinearGradient(0, 0, 1024, 1024);
      baseGradient.addColorStop(0, `rgb(${base.r + 18},${base.g + 17},${base.b + 15})`);
      baseGradient.addColorStop(0.40, `rgb(${base.r + 4},${base.g + 4},${base.b + 3})`);
      baseGradient.addColorStop(0.72, `rgb(${base.r - 8},${base.g - 8},${base.b - 8})`);
      baseGradient.addColorStop(1, `rgb(${base.r - 20},${base.g - 19},${base.b - 18})`);
      ctx.fillStyle = baseGradient;
      ctx.fillRect(0, 0, 1024, 1024);

      for (let i = 0; i < 18000; i++) {
        const x = rnd() * 1024;
        const y = rnd() * 1024;
        const delta = Math.floor((rnd() - 0.5) * 18);
        const a = rnd() * 0.038 + 0.012;
        const r = Math.max(0, Math.min(255, base.r + delta));
        const g = Math.max(0, Math.min(255, base.g + delta));
        const b = Math.max(0, Math.min(255, base.b + delta));

        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.fillRect(x, y, rnd() * 1.4 + 0.2, rnd() * 1.4 + 0.2);
      }

      for (let i = 0; i < 42; i++) {
        const x = rnd() * 1024;
        const y = rnd() * 1024;
        const w = rnd() * 260 + 60;
        const h = rnd() * 1.2 + 0.25;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((rnd() - 0.5) * 0.5);
        ctx.fillStyle = "rgba(255,255,255,0.018)";
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.restore();
      }

      const moon = ctx.createRadialGradient(200, 80, 0, 200, 80, 700);
      moon.addColorStop(0, "rgba(180,205,245,0.11)");
      moon.addColorStop(0.48, "rgba(180,205,245,0.028)");
      moon.addColorStop(1, "rgba(180,205,245,0)");
      ctx.fillStyle = moon;
      ctx.fillRect(0, 0, 1024, 1024);

      const warm = ctx.createRadialGradient(820, 890, 0, 820, 890, 580);
      warm.addColorStop(0, "rgba(255,194,125,0.085)");
      warm.addColorStop(0.46, "rgba(255,194,125,0.025)");
      warm.addColorStop(1, "rgba(255,194,125,0)");
      ctx.fillStyle = warm;
      ctx.fillRect(0, 0, 1024, 1024);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 1);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function createStoneMaterial() {
      const texture = createStoneTexture("#7b746a", 31);
      return new THREE.MeshStandardMaterial({
        color: 0x8a8175,
        map: texture,
        roughness: 0.96,
        metalness: 0,
        bumpMap: texture,
        bumpScale: 0.0055
      });
    }

    function createBaseMaterial() {
      const texture = createStoneTexture("#5f574e", 68);
      return new THREE.MeshStandardMaterial({
        color: 0x6a6259,
        map: texture,
        roughness: 0.98,
        metalness: 0,
        bumpMap: texture,
        bumpScale: 0.0045
      });
    }

    function createFrontOverlayMaterial() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      const g1 = ctx.createLinearGradient(0, 0, 512, 512);
      g1.addColorStop(0, "rgba(210,225,250,0.22)");
      g1.addColorStop(0.32, "rgba(255,255,255,0.04)");
      g1.addColorStop(0.70, "rgba(0,0,0,0.06)");
      g1.addColorStop(1, "rgba(0,0,0,0.15)");
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, 512, 512);

      const warm = ctx.createRadialGradient(420, 450, 0, 420, 450, 330);
      warm.addColorStop(0, "rgba(255,198,122,0.17)");
      warm.addColorStop(0.54, "rgba(255,198,122,0.035)");
      warm.addColorStop(1, "rgba(255,198,122,0)");
      ctx.fillStyle = warm;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;

      return new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 0.55,
        depthWrite: false
      });
    }

    function buildRoundedShape(scale) {
      const k = scale || 1;
      const s = new THREE.Shape();
      s.moveTo(-1.14 * k, -1.72 * k);
      s.lineTo(-1.14 * k, 0.58 * k);
      s.bezierCurveTo(-1.14 * k, 1.30 * k, -0.68 * k, 1.66 * k, 0, 1.66 * k);
      s.bezierCurveTo(0.68 * k, 1.66 * k, 1.14 * k, 1.30 * k, 1.14 * k, 0.58 * k);
      s.lineTo(1.14 * k, -1.72 * k);
      s.closePath();
      return s;
    }

    function buildSquareShape(scale) {
      const k = scale || 1;
      const s = new THREE.Shape();
      s.moveTo(-1.20 * k, -1.72 * k);
      s.lineTo(-1.20 * k, 1.34 * k);
      s.quadraticCurveTo(-1.20 * k, 1.64 * k, -0.90 * k, 1.64 * k);
      s.lineTo(0.90 * k, 1.64 * k);
      s.quadraticCurveTo(1.20 * k, 1.64 * k, 1.20 * k, 1.34 * k);
      s.lineTo(1.20 * k, -1.72 * k);
      s.closePath();
      return s;
    }

    function buildArchShape(scale) {
      const k = scale || 1;
      const s = new THREE.Shape();
      s.moveTo(-1.18 * k, -1.75 * k);
      s.lineTo(-1.18 * k, 0.38 * k);
      s.bezierCurveTo(-1.18 * k, 1.34 * k, -0.64 * k, 1.78 * k, 0, 1.78 * k);
      s.bezierCurveTo(0.64 * k, 1.78 * k, 1.18 * k, 1.34 * k, 1.18 * k, 0.38 * k);
      s.lineTo(1.18 * k, -1.75 * k);
      s.closePath();
      return s;
    }

    function buildTombstoneShape(style, scale) {
      const normalized = normalizeStyle(style);
      if (normalized === "square") return buildSquareShape(scale);
      if (normalized === "arch") return buildArchShape(scale);
      return buildRoundedShape(scale);
    }

    function createTextTexture(memorial) {
      const text = getText();
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 1024, 1024);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "rgba(21, 18, 15, 0.16)";
      ctx.font = "600 44px Arial";
      ctx.fillText("🐾", 512, 178);

      ctx.fillStyle = "rgba(21, 18, 15, 0.14)";
      ctx.beginPath();
      roundRect(ctx, 400, 238, 224, 52, 26);
      ctx.fill();

      ctx.fillStyle = "rgba(19, 16, 14, 0.32)";
      ctx.font = "500 26px 'Microsoft YaHei', Arial";
      ctx.fillText(getVisibilityText(memorial.visibility), 512, 264);

      ctx.fillStyle = "rgba(18, 15, 13, 0.53)";
      ctx.font = "500 76px 'Microsoft YaHei', Arial";
      ctx.fillText(memorial.name || text.defaultName, 512, 440);

      ctx.fillStyle = "rgba(18, 15, 13, 0.39)";
      ctx.font = "400 34px 'Microsoft YaHei', Arial";
      const birth = memorial.birthDate || "----";
      const leave = memorial.leaveDate || "----";
      ctx.fillText(birth + " — " + leave, 512, 540);

      ctx.fillStyle = "rgba(18, 15, 13, 0.34)";
      ctx.font = "italic 32px 'Microsoft YaHei', Arial";
      drawWrappedText(ctx, memorial.epitaph || memorial.memory || text.defaultWords, 512, 660, 460, 44, 3);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawWrappedText(ctx, value, x, y, maxWidth, lineHeight, maxLines) {
      const chars = String(value || "").split("");
      const lines = [];
      let current = "";

      for (let i = 0; i < chars.length; i++) {
        const test = current + chars[i];
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = chars[i];
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);

      const finalLines = lines.slice(0, maxLines);
      if (lines.length > maxLines && finalLines.length) {
        finalLines[finalLines.length - 1] = finalLines[finalLines.length - 1].slice(0, -1) + "…";
      }

      finalLines.forEach(function(line, index) {
        ctx.fillText(line, x, y + index * lineHeight);
      });
    }

    function makeShadowTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createRadialGradient(256, 256, 12, 256, 256, 215);
      gradient.addColorStop(0, "rgba(0,0,0,0.42)");
      gradient.addColorStop(0.45, "rgba(0,0,0,0.22)");
      gradient.addColorStop(0.72, "rgba(0,0,0,0.07)");
      gradient.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function createStoneGroup(style, showText, scale, sideAngle) {
      const group = new THREE.Group();
      const normalized = normalizeStyle(style);

      const shape = buildTombstoneShape(normalized, 1);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.42,
        bevelEnabled: true,
        bevelThickness: 0.052,
        bevelSize: 0.050,
        bevelSegments: 14,
        curveSegments: 96
      });

      geometry.center();
      geometry.computeVertexNormals();

      const stoneMesh = new THREE.Mesh(geometry, createStoneMaterial());
      stoneMesh.position.y = 0.30;
      stoneMesh.rotation.y = sideAngle;
      group.add(stoneMesh);

      const frontShape = buildTombstoneShape(normalized, 0.87);
      const frontGeo = new THREE.ShapeGeometry(frontShape, 96);
      frontGeo.computeVertexNormals();

      const frontOverlay = new THREE.Mesh(frontGeo, createFrontOverlayMaterial());
      frontOverlay.position.set(0, 0.30, 0.232);
      frontOverlay.scale.set(0.96, 0.96, 0.96);
      frontOverlay.rotation.y = sideAngle;
      group.add(frontOverlay);

      const baseGeo = new THREE.BoxGeometry(3.24, 0.34, 1.02, 12, 3, 6);
      baseGeo.computeVertexNormals();

      const baseMesh = new THREE.Mesh(baseGeo, createBaseMaterial());
      baseMesh.position.set(0, -1.78, -0.02);
      baseMesh.rotation.y = sideAngle;
      group.add(baseMesh);

      const lipGeo = new THREE.BoxGeometry(2.88, 0.15, 0.86, 12, 2, 5);
      lipGeo.computeVertexNormals();

      const lipMesh = new THREE.Mesh(lipGeo, createBaseMaterial());
      lipMesh.position.set(0, -1.49, 0.02);
      lipMesh.rotation.y = sideAngle;
      group.add(lipMesh);

      const shadowMat = new THREE.MeshBasicMaterial({
        map: makeShadowTexture(),
        transparent: true,
        depthWrite: false,
        opacity: 0.86
      });

      const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.80, 1.18), shadowMat);
      shadow.position.set(0, -1.95, -0.50);
      group.add(shadow);

      if (showText) {
        const memorial = getMemorialData();
        const textTexture = createTextTexture(memorial);

        const textMat = new THREE.MeshBasicMaterial({
          map: textTexture,
          transparent: true,
          depthWrite: false,
          opacity: 0.68
        });

        mainTextPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.18, 2.78), textMat);
        mainTextPlane.position.set(0, 0.26, 0.248);
        mainTextPlane.rotation.y = sideAngle;
        group.add(mainTextPlane);
      }

      group.scale.set(scale, scale, scale);
      group.position.y = PREVIEW_Y;

      group.userData.parts = {
        stoneMesh,
        frontOverlay,
        baseMesh,
        lipMesh,
        textPlane: mainTextPlane
      };

      return group;
    }

    function initMainScene() {
      const container = document.getElementById("mainStoneScene");
      if (!container || !window.THREE) return;

      mainScene = new THREE.Scene();

      mainCamera = new THREE.PerspectiveCamera(

      );
      mainCamera.position.set(0, 0.08, 7.7);

      mainRenderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

      mainRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      mainRenderer.setSize(container.clientWidth, container.clientHeight);
      mainRenderer.outputColorSpace = THREE.SRGBColorSpace;

      container.innerHTML = "";
      container.appendChild(mainRenderer.domElement);

      mainScene.add(new THREE.AmbientLight(0xd7d6d0, 0.82));

      const hemi = new THREE.HemisphereLight(0xb9c9f0, 0x3b2e24, 0.82);
      mainScene.add(hemi);

      const moonLight = new THREE.DirectionalLight(0xcbd8ff, 1.08);
      moonLight.position.set(-5.1, 7.8, 5.7);
      mainScene.add(moonLight);

      const warmRight = new THREE.PointLight(0xffc98b, 0.82, 18, 2);
      warmRight.position.set(2.8, -1.0, 5.0);
      mainScene.add(warmRight);

      const warmLeft = new THREE.PointLight(0xffd29a, 0.34, 14, 2);
      warmLeft.position.set(-3.1, -1.2, 4.6);
      mainScene.add(warmLeft);

      const softBlueFill = new THREE.PointLight(0x8fa8d4, 0.18, 18, 2);
      softBlueFill.position.set(-2.3, 1.0, 4.7);
      mainScene.add(softBlueFill);

      const data = getMemorialData();
      const confirmed = data.tombstoneConfirmed === true;
      buildMainStone(selectedStoneStyle, confirmed);

      renderMainScene();

      window.addEventListener("resize", resizeMainScene);
    }

    function buildMainStone(style, finalMode) {
      selectedStoneStyle = normalizeStyle(style);

      if (!mainScene) return;

      if (mainStoneGroup) {
        mainScene.remove(mainStoneGroup);
      }

      mainTextPlane = null;

      const scale = finalMode ? FINAL_SCALE : PREVIEW_SCALE;
      const sideAngle = finalMode ? FINAL_ANGLE : PREVIEW_ANGLE;

      mainStoneGroup = createStoneGroup(selectedStoneStyle, true, scale, sideAngle);
      mainStoneGroup.position.y = finalMode ? FINAL_Y : PREVIEW_Y;

      mainScene.add(mainStoneGroup);

      renderMainScene();
    }

    function renderMainScene() {
      if (!mainRenderer || !mainScene || !mainCamera) return;
      mainRenderer.render(mainScene, mainCamera);
    }

    function resizeMainScene() {
      const container = document.getElementById("mainStoneScene");
      if (!container || !mainRenderer || !mainCamera) return;

      mainRenderer.setSize(container.clientWidth, container.clientHeight);
      mainCamera.aspect = container.clientWidth / container.clientHeight;
      mainCamera.updateProjectionMatrix();
      renderMainScene();
    }

    function rebuildMainTextTexture() {
      if (!mainTextPlane) return;

      const texture = createTextTexture(getMemorialData());

      if (mainTextPlane.material.map) {
        mainTextPlane.material.map.dispose();
      }

      mainTextPlane.material.map = texture;
      mainTextPlane.material.needsUpdate = true;

      renderMainScene();
    }

    function initMiniScene(containerId, style) {

    function resizeMiniScenes() {
      miniScenes.forEach(function(item) {
        const width = item.container.clientWidth;
        const height = item.container.clientHeight;
        item.renderer.setSize(width, height);
        item.camera.aspect = width / height;
        item.camera.updateProjectionMatrix();
        item.renderer.render(item.scene, item.camera);
      });
    }

    function selectStone(style, button) {
      if (isPlanting) return;

      selectedStoneStyle = normalizeStyle(style);

      const data = getMemorialData();
      data.tombstoneStyle = selectedStoneStyle;
      data.tombstoneConfirmed = false;
      saveMemorialData(data);

      document.body.classList.remove("memorial-mode");

      document.querySelectorAll(".stone-option").forEach(function(btn) {
        btn.classList.remove("active");
      });

      if (button) button.classList.add("active");

      buildMainStone(selectedStoneStyle, false);
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animateStoneToFinal(callback) {
      if (!mainStoneGroup) {
        callback();
        return;
      }

      const parts = mainStoneGroup.userData.parts || {};
      const start = performance.now();
      const duration = 1300;

      function setAngle(angle) {
        if (parts.stoneMesh) parts.stoneMesh.rotation.y = angle;
        if (parts.frontOverlay) parts.frontOverlay.rotation.y = angle;
        if (parts.baseMesh) parts.baseMesh.rotation.y = angle;
        if (parts.lipMesh) parts.lipMesh.rotation.y = angle;
        if (parts.textPlane) parts.textPlane.rotation.y = angle;
      }

      function frame(now) {
        const raw = Math.min((now - start) / duration, 1);
        const t = easeOutCubic(raw);

        const scale = PREVIEW_SCALE + (FINAL_SCALE - PREVIEW_SCALE) * t;
        const y = PREVIEW_Y + (FINAL_Y - PREVIEW_Y) * t;
        const angle = PREVIEW_ANGLE + (FINAL_ANGLE - PREVIEW_ANGLE) * t;

        mainStoneGroup.scale.set(scale, scale, scale);
        mainStoneGroup.position.y = y;
        setAngle(angle);

        renderMainScene();

        if (raw < 1) {
          requestAnimationFrame(frame);
        } else {
          callback();
        }
      }

      requestAnimationFrame(frame);
    }

    function confirmStone() {
      if (isPlanting) return;

      isPlanting = true;

      const data = getMemorialData();
      data.tombstoneStyle = selectedStoneStyle;
      data.tombstoneConfirmed = true;
      saveMemorialData(data);

      document.body.classList.add("planting");

      animateStoneToFinal(function() {
        document.body.classList.remove("planting");
        document.body.classList.add("memorial-mode");
        isPlanting = false;
        loadExtraMemorialInfo();
        renderPlacedItems();
      });
    }

    function editStoneAgain() {
      if (isPlanting) return;

      const data = getMemorialData();
      data.tombstoneConfirmed = false;
      saveMemorialData(data);

      document.body.classList.remove("memorial-mode", "planting");
      buildMainStone(selectedStoneStyle, false);
    }

    function initFromSavedData() {
      const data = getMemorialData();
      selectedStoneStyle = normalizeStyle(data.tombstoneStyle || "rounded");

      const activeButton = document.querySelector('[data-style="' + selectedStoneStyle + '"]');
      if (activeButton) {
        document.querySelectorAll(".stone-option").forEach(function(btn) {
          btn.classList.remove("active");
        });
        activeButton.classList.add("active");
      }

      if (data.tombstoneConfirmed === true) {
        document.body.classList.add("memorial-mode");
      }
    }

    function openPanel(id) {
      closeAllPanels();
      const panel = document.getElementById(id);
      if (panel) panel.classList.add("show");
    }

    function closeAllPanels() {
      document.querySelectorAll(".modal-layer").forEach(function(panel) {
        panel.classList.remove("show");
      });
    }

    function closePanels(event) {
      if (event.target.classList.contains("modal-layer")) {
        closeAllPanels();
      }
    }

    function showPhotos(containerId, photos) {
      const container = document.getElementById(containerId);
      const text = getText();
      if (!container) return;

      container.innerHTML = "";

      if (!photos || photos.length === 0) {
        container.innerHTML = '<p class="empty-text">' + text.noPhotos + '</p>';
        return;
      }

      photos.forEach(function(photo) {
        const box = document.createElement("div");
        box.className = "gallery-photo";
        box.onclick = function() { openPhotoLightbox(photo); };

        const img = document.createElement("img");
        img.src = photo;

        box.appendChild(img);
        container.appendChild(box);
      });
    }

    function openPhotoLightbox(src) {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      image.src = src;
      lightbox.classList.add("show");
    }

    function closePhotoLightbox() {
      const lightbox = document.getElementById("photoLightbox");
      const image = document.getElementById("lightboxImage");
      if (!lightbox || !image) return;

      lightbox.classList.remove("show");
      image.src = "";
    }

    function loadExtraMemorialInfo() {
      const data = getMemorialData();
      const text = getText();

      const storyDisplay = document.getElementById("petStoryDisplay");

      if (storyDisplay) {
        if (data.story) {
          storyDisplay.textContent = data.story;
          storyDisplay.classList.remove("empty-text");
        } else {
          storyDisplay.textContent = text.noStory;
          storyDisplay.classList.add("empty-text");
        }
      }

      const publicPhotos = data.publicPhotos && data.publicPhotos.length ? data.publicPhotos : (data.photo ? [data.photo] : []);
      const privatePhotos = data.privatePhotos || [];

      showPhotos("publicPhotosDisplay", publicPhotos);
      showPhotos("privatePhotosDisplay", privatePhotos);

      renderMessages();
    }

    function getMessages() {
      return JSON.parse(localStorage.getItem("memorialMessages") || "[]");
    }

    function renderMessages() {
      const list = document.getElementById("messageList");
      const text = getText();
      if (!list) return;

      const messages = getMessages();
      list.innerHTML = "";

      if (!messages.length) {
        list.innerHTML = '<div class="message-item empty-text">' + text.noMessages + '</div>';
        return;
      }

      messages.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "message-item";
        div.textContent = item;
        list.appendChild(div);
      });
    }

    function addMessage() {
      const input = document.getElementById("messageInput");
      if (!input) return;

      const value = input.value.trim();
      if (!value) return;

      const messages = getMessages();
      messages.unshift(value);
      localStorage.setItem("memorialMessages", JSON.stringify(messages.slice(0, 20)));

      input.value = "";
      renderMessages();
    }

    function getPlacedItems() {
      return JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]");
    }

    function renderPlacedItems() {
      const box = document.getElementById("placedItemsList");
      const text = getText();
      if (!box) return;

      const items = getPlacedItems();
      box.innerHTML = "";

      items.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "placed-item-badge";

        if (item === "can") div.textContent = "🥫 " + text.placedCan;
        if (item === "ball") div.textContent = "🎾 " + text.placedBall;
        if (item === "seed") div.textContent = "🌾 " + text.placedSeed;
        if (item === "flower") div.textContent = "🌸 " + text.placedFlower;

        box.appendChild(div);
      });
    }

    function placeGift(type) {
      const items = getPlacedItems();
      items.unshift(type);
      localStorage.setItem("memorialPlacedItems", JSON.stringify(items.slice(0, 8)));
      renderPlacedItems();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePhotoLightbox();
        closeAllPanels();
      }
    });

    window.addEventListener("DOMContentLoaded", function() {
      initFromSavedData();

      initMainScene();
      initMiniScene("miniRounded", "rounded");
      initMiniScene("miniSquare", "square");
      initMiniScene("miniArch", "arch");

      const savedLanguage = localStorage.getItem("siteLanguage") || "zh";
      changeLanguage(savedLanguage);

      loadExtraMemorialInfo();
      renderPlacedItems();

      window.addEventListener("resize", function() {
        resizeMiniScenes();
        resizeMainScene();
      });
    });
  </script>
</body>
</html>
