<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择墓碑 - 星眠宠物纪念园</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans TC",
        "Noto Sans JP", Arial, sans-serif;
      color: #fff;
      background: #081018;
    }

    body {
      position: relative;
      background:
        linear-gradient(rgba(6, 10, 18, 0.18), rgba(6, 10, 18, 0.32)),
        url("./cemetery-bg.png") center center / cover no-repeat;
    }

    .page-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.03), rgba(0,0,0,0) 35%),
        linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.15));
      pointer-events: none;
      z-index: 1;
    }

    #viewer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    #viewer canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none;
    }

    .brand {
      position: absolute;
      top: 34px;
      left: 42px;
      z-index: 5;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    .top-actions {
      position: absolute;
      top: 28px;
      right: 38px;
      z-index: 6;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .ghost-btn,
    .lang-select {
      height: 56px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(7, 10, 15, 0.58);
      color: #fff;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.06);
      outline: none;
    }

    .ghost-btn {
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .lang-select {
      padding: 0 22px;
      min-width: 128px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .left-panel {
      position: absolute;
      left: 32px;
      top: 122px;
      width: 408px;
      z-index: 6;
    }

    .left-panel h2 {
      margin: 0 0 10px 0;
      font-size: 36px;
      line-height: 1.1;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .left-panel p {
      margin: 0 0 26px 0;
      font-size: 16px;
      line-height: 1.75;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 2px 8px rgba(0,0,0,0.32);
    }

    .stone-card {
      width: 100%;
      min-height: 132px;
      border-radius: 28px;
      padding: 28px 28px 28px 26px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(5, 10, 18, 0.66);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 14px 30px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      margin-bottom: 22px;
    }

    .stone-icon {
      width: 72px;
      height: 72px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stone-card-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .stone-card-desc {
      font-size: 16px;
      color: rgba(255,255,255,0.84);
      line-height: 1.6;
    }

    .use-btn {
      width: 100%;
      height: 100px;
      max-height: 72px;
      border: none;
      border-radius: 36px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #333;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.96), rgba(241,241,241,0.93));
      box-shadow:
        0 12px 30px rgba(0,0,0,0.22),
        inset 0 1px 0 rgba(255,255,255,0.75);
      cursor: pointer;
    }

    .hero-copy {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(10%);
      z-index: 5;
      text-align: center;
      width: 560px;
      max-width: calc(100vw - 520px);
      pointer-events: none;
    }

    .hero-copy h1 {
      margin: 0;
      font-size: 76px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    .hero-copy p {
      margin: 18px 0 0 0;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.94);
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .loading {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      z-index: 4;
      font-size: 20px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .loading.hide {
      opacity: 0;
    }

    .error-box {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      z-index: 7;
      min-width: 280px;
      max-width: 460px;
      padding: 18px 22px;
      border-radius: 18px;
      background: rgba(80, 18, 18, 0.82);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }

    @media (max-width: 1100px) {
      .left-panel {
        width: 360px;
        left: 18px;
        top: 112px;
      }

      .hero-copy {
        width: 440px;
        transform: translateX(2%);
      }

      .hero-copy h1 {
        font-size: 58px;
      }
    }

    @media (max-width: 860px) {
      .hero-copy {
        top: 88px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vw - 40px);
        max-width: none;
      }

      .hero-copy h1 { font-size: 46px; }

      .left-panel {
        width: calc(100vw - 32px);
        left: 16px;
        right: 16px;
        top: auto;
        bottom: 20px;
      }

      .top-actions {
        right: 16px;
        top: 16px;
      }

      .brand {
        left: 16px;
        top: 20px;
      }

      .stone-card {
        min-height: 116px;
      }

      .use-btn {
        height: 64px;
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <div class="page-overlay"></div>
  <div id="viewer"></div>

  <div class="brand" id="brandText">星眠宠物纪念园</div>

  <div class="top-actions">
    <button class="ghost-btn" id="backBtn">返回修改</button>
    <select class="lang-select" id="langSelect">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <div class="left-panel">
    <h2 id="panelTitle">墓碑样式</h2>
    <p id="panelDesc">选择一个墓碑，中间预览会立刻变化。</p>

    <div class="stone-card">
      <div class="stone-icon" aria-hidden="true">
        <svg width="62" height="62" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 15C16 9.47715 20.4772 5 26 5H36C41.5229 5 46 9.47715 46 15V48H16V15Z" fill="rgba(255,255,255,0.94)"/>
          <rect x="11" y="48" width="40" height="9" rx="1.5" fill="rgba(255,255,255,0.94)"/>
        </svg>
      </div>
      <div>
        <div class="stone-card-title" id="cardTitle">圆顶墓碑</div>
        <div class="stone-card-desc" id="cardDesc">真实石材圆顶墓碑。</div>
      </div>
    </div>

    <button class="use-btn" id="useStoneBtn">使用这个墓碑</button>
  </div>

  <div class="hero-copy">
    <h1 id="heroTitle">选择墓碑</h1>
    <p id="heroDesc">墓碑会慢慢转正，并安静地落到纪念园中。</p>
  </div>

  <div class="loading" id="loadingText">正在加载墓碑模型...</div>
  <div class="error-box" id="errorBox"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const viewer = document.getElementById("viewer");
    const loadingText = document.getElementById("loadingText");
    const errorBox = document.getElementById("errorBox");
    const useStoneBtn = document.getElementById("useStoneBtn");
    const backBtn = document.getElementById("backBtn");
    const langSelect = document.getElementById("langSelect");

    const translations = {
      "zh-CN": {
        brand: "星眠宠物纪念园",
        panelTitle: "墓碑样式",
        panelDesc: "选择一个墓碑，中间预览会立刻变化。",
        cardTitle: "圆顶墓碑",
        cardDesc: "真实石材圆顶墓碑。",
        useBtn: "使用这个墓碑",
        backBtn: "返回修改",
        heroTitle: "选择墓碑",
        heroDesc: "墓碑会慢慢转正，并安静地落到纪念园中。",
        loading: "正在加载墓碑模型...",
        error: "模型加载失败，请确认模型路径正确：assets/models/tombstone-real.glb"
      },
      "zh-TW": {
        brand: "星眠寵物紀念園",
        panelTitle: "墓碑樣式",
        panelDesc: "選擇一個墓碑，中間預覽會立刻變化。",
        cardTitle: "圓頂墓碑",
        cardDesc: "真實石材圓頂墓碑。",
        useBtn: "使用這個墓碑",
        backBtn: "返回修改",
        heroTitle: "選擇墓碑",
        heroDesc: "墓碑會慢慢轉正，並安靜地落到紀念園中。",
        loading: "正在載入墓碑模型...",
        error: "模型載入失敗，請確認模型路徑正確：assets/models/tombstone-real.glb"
      },
      "en": {
        brand: "Starrest Pet Memorial Garden",
        panelTitle: "Stone Style",
        panelDesc: "Choose a stone and the preview will update immediately.",
        cardTitle: "Rounded Headstone",
        cardDesc: "Real stone rounded headstone.",
        useBtn: "Use This Stone",
        backBtn: "Back",
        heroTitle: "Choose Headstone",
        heroDesc: "The headstone will gently align and settle into the memorial garden.",
        loading: "Loading headstone model...",
        error: "Model failed to load. Please confirm the path: assets/models/tombstone-real.glb"
      },
      "ja": {
        brand: "星眠ペット記念園",
        panelTitle: "墓碑スタイル",
        panelDesc: "墓碑を選ぶと中央プレビューがすぐ変わります。",
        cardTitle: "丸型墓碑",
        cardDesc: "本物の石材感のある丸型墓碑です。",
        useBtn: "この墓碑を使う",
        backBtn: "戻る",
        heroTitle: "墓碑を選ぶ",
        heroDesc: "墓碑はゆっくり正面を向き、静かに記念園へ収まります。",
        loading: "墓碑モデルを読み込み中...",
        error: "モデルの読み込みに失敗しました。パスを確認してください：assets/models/tombstone-real.glb"
      }
    };

    function setLanguage(lang) {
      const t = translations[lang] || translations["zh-CN"];
      document.getElementById("brandText").textContent = t.brand;
      document.getElementById("panelTitle").textContent = t.panelTitle;
      document.getElementById("panelDesc").textContent = t.panelDesc;
      document.getElementById("cardTitle").textContent = t.cardTitle;
      document.getElementById("cardDesc").textContent = t.cardDesc;
      document.getElementById("heroTitle").textContent = t.heroTitle;
      document.getElementById("heroDesc").textContent = t.heroDesc;
      document.getElementById("backBtn").textContent = t.backBtn;
      document.getElementById("useStoneBtn").textContent = t.useBtn;
      loadingText.textContent = t.loading;
      localStorage.setItem("siteLanguage", lang);
      langSelect.value = lang;
    }

    const savedLanguage = localStorage.getItem("siteLanguage") || "zh-CN";
    setLanguage(savedLanguage);

    langSelect.addEventListener("change", function () {
      setLanguage(this.value);
    });

    backBtn.addEventListener("click", function () {
      window.location.href = "create.html";
    });

    function getPetData() {
      const keys = [
        "myPetMemorial",
        "petMemorialData",
        "petMemorialForm",
        "memorialFormData",
        "petData",
        "petMemorialDraft"
      ];

      for (const key of keys) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          const obj = JSON.parse(raw);
          if (obj && typeof obj === "object") {
            return {
              name: obj.name || obj.petName || "苏杰aaaa",
              birthDate: obj.birthDate || obj.birthday || obj.birth || "2015-08-20",
              deathDate: obj.deathDate || obj.departureDate || obj.death || "2026-05-12",
              epitaph: obj.epitaph || obj.message || obj.memorialText || obj.words || "谢谢你陪我们走过那么多温柔的日子。"
            };
          }
        } catch (e) {}
      }

      return {
        name: "苏杰aaaa",
        birthDate: "2015-08-20",
        deathDate: "2026-05-12",
        epitaph: "谢谢你陪我们走过那么多温柔的日子。"
      };
    }

    const petData = getPetData();

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      30,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.55, 11.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = false;
    viewer.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xc7d6ff, 0x2d241b, 1.35);
    scene.add(hemi);

    const ambient = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambient);

    const moonLight = new THREE.DirectionalLight(0xc8d7ff, 1.15);
    moonLight.position.set(-4.8, 7.5, 5.5);
    scene.add(moonLight);

    const warmLight = new THREE.DirectionalLight(0xffd49a, 0.65);
    warmLight.position.set(4.5, 2.2, 4.0);
    scene.add(warmLight);

    const tombstoneGroup = new THREE.Group();
    scene.add(tombstoneGroup);

    let modelRoot = null;
    let engravingMesh = null;
    let isAnimating = false;

    function makeStoneMaterialLikeReal(material) {
      if (!material) return;
      material.color = new THREE.Color(0xd7d1c5);
      if ("roughness" in material) material.roughness = 0.98;
      if ("metalness" in material) material.metalness = 0.0;
      if ("envMapIntensity" in material) material.envMapIntensity = 0.18;
      material.needsUpdate = true;
    }

    function createEngravingTexture(data = {}) {
      const canvas = document.createElement("canvas");
      canvas.width = 2048;
      canvas.height = 2048;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const name = (data.name || "苏杰aaaa").trim();
      const birthDate = (data.birthDate || "2015-08-20").replace(/-/g, ".");
      const deathDate = (data.deathDate || "2026-05-12").replace(/-/g, ".");
      const epitaph = (data.epitaph || "谢谢你陪我们走过那么多温柔的日子。").trim();

      const cx = canvas.width / 2;
      const dateText = birthDate + " - " + deathDate;

      function drawEngravedText(text, x, y, font, baseColor, wearAmount = 20) {
        if (!text) return;

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = font;

        ctx.fillStyle = "rgba(18,18,20,0.18)";
        ctx.filter = "blur(2px)";
        ctx.fillText(text, x - 2.4, y - 2.4);

        ctx.fillStyle = "rgba(255,255,255,0.06)";
        ctx.filter = "blur(1px)";
        ctx.fillText(text, x + 1.0, y + 1.0);

        ctx.filter = "none";
        ctx.fillStyle = baseColor;
        ctx.fillText(text, x, y);

        ctx.fillStyle = "rgba(0,0,0,0.08)";
        ctx.fillText(text, x, y + 0.8);

        const m = ctx.measureText(text);
        const width = m.width;
        const fontMatch = font.match(/(\d+)px/);
        const fontSize = fontMatch ? parseInt(fontMatch[1], 10) : 80;
        const height = fontSize * 0.9;

        ctx.globalCompositeOperation = "destination-out";
        for (let i = 0; i < wearAmount; i++) {
          const rx = x - width / 2 + Math.random() * width;
          const ry = y - height / 2 + Math.random() * height;
          const rr = Math.random() * 2.4 + 0.5;
          ctx.beginPath();
          ctx.arc(rx, ry, rr, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,0,0,0.06)";
          ctx.fill();
        }

        ctx.globalCompositeOperation = "source-over";
        ctx.restore();
      }

      function wrapText(text, font, maxWidth, maxLines) {
        ctx.save();
        ctx.font = font;

        const chars = text.split("");
        const lines = [];
        let current = "";

        for (let i = 0; i < chars.length; i++) {
          const test = current + chars[i];
          if (ctx.measureText(test).width > maxWidth && current !== "") {
            lines.push(current);
            current = chars[i];
            if (lines.length === maxLines - 1) break;
          } else {
            current = test;
          }
        }

        if (lines.length < maxLines && current) {
          lines.push(current);
        }

        if (chars.join("").length > lines.join("").length && lines.length > 0) {
          lines[lines.length - 1] = lines[lines.length - 1].replace(/.$/, "…");
        }

        ctx.restore();
        return lines;
      }

      // ===== 这里已经把刻字做得更自然、更分散、不那么挤 =====
      // 名字
      drawEngravedText(
        name,
        cx,
        620,
        '700 170px "Noto Serif SC","Noto Serif TC","Noto Serif JP","Times New Roman",serif',
        "rgba(54,54,58,0.90)",
        32
      );

      // 日期
      drawEngravedText(
        dateText,
        cx,
        820,
        '500 70px "Noto Serif SC","Noto Serif TC","Noto Serif JP","Times New Roman",serif',
        "rgba(72,72,76,0.78)",
        16
      );

      // 墓志铭
      const epiFont = '500 84px "Noto Serif SC","Noto Serif TC","Noto Serif JP","Times New Roman",serif';
      const lines = wrapText(epitaph, epiFont, 980, 2);
      let startY = 1085;
      const lineHeight = 110;

      for (let i = 0; i < lines.length; i++) {
        drawEngravedText(
          lines[i],
          cx,
          startY + i * lineHeight,
          epiFont,
          "rgba(76,76,80,0.72)",
          18
        );
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.flipY = false;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      return texture;
    }

    function addEngravingToStone() {
      if (!modelRoot) return;

      if (engravingMesh) {
        tombstoneGroup.remove(engravingMesh);
        engravingMesh.geometry.dispose();
        engravingMesh.material.dispose();
        engravingMesh = null;
      }

      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = new THREE.Vector3();
      box.getSize(size);

      const planeWidth = size.x * 0.50;
      const planeHeight = size.y * 0.36;

      const material = new THREE.MeshStandardMaterial({
        map: createEngravingTexture(petData),
        transparent: true,
        roughness: 1,
        metalness: 0,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2
      });

      engravingMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(planeWidth, planeHeight),
        material
      );

      // ===== 刻字位置：已经向下移，并且贴在墓碑正面 =====
      engravingMesh.position.set(0, size.y * 0.17, size.z * 0.5 + 0.02);

      tombstoneGroup.add(engravingMesh);
    }

    function setPreviewTransform() {
      tombstoneGroup.position.set(1.52, -2.02, 0);
      tombstoneGroup.rotation.set(0, -0.20, 0);
      tombstoneGroup.scale.set(1.24, 1.24, 1.24);
    }

    function setFinalTransformAlpha(t) {
      const ease = t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;

      const start = {
        x: 1.52, y: -2.02, z: 0,
        ry: -0.20,
        s: 1.24
      };

      const end = {
        x: 0.05, y: -2.38, z: 0,
        ry: 0.02,
        s: 0.88
      };

      tombstoneGroup.position.x = start.x + (end.x - start.x) * ease;
      tombstoneGroup.position.y = start.y + (end.y - start.y) * ease;
      tombstoneGroup.position.z = start.z + (end.z - start.z) * ease;
      tombstoneGroup.rotation.y = start.ry + (end.ry - start.ry) * ease;
      tombstoneGroup.scale.setScalar(start.s + (end.s - start.s) * ease);
    }

    function showError(msg) {
      loadingText.classList.add("hide");
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    function hideLoading() {
      loadingText.classList.add("hide");
    }

    const loader = new GLTFLoader();
    loader.load(
      "./assets/models/tombstone-real.glb",
      (gltf) => {
        modelRoot = gltf.scene;

        modelRoot.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = false;
            child.receiveShadow = true;

            if (Array.isArray(child.material)) {
              child.material.forEach(makeStoneMaterialLikeReal);
            } else {
              makeStoneMaterialLikeReal(child.material);
            }
          }
        });

        const rawBox = new THREE.Box3().setFromObject(modelRoot);
        const rawSize = new THREE.Vector3();
        const rawCenter = new THREE.Vector3();
        rawBox.getSize(rawSize);
        rawBox.getCenter(rawCenter);

        modelRoot.position.sub(rawCenter);

        const recenteredBox = new THREE.Box3().setFromObject(modelRoot);
        const recenteredSize = new THREE.Vector3();
        const recenteredMin = new THREE.Vector3();
        recenteredBox.getSize(recenteredSize);
        recenteredBox.min.clone(recenteredMin);

        const targetHeight = 4.8;
        const scale = targetHeight / recenteredSize.y;
        modelRoot.scale.setScalar(scale);

        const afterScaleBox = new THREE.Box3().setFromObject(modelRoot);
        const afterScaleMin = afterScaleBox.min.clone();

        // 把模型底部抬到正确位置，确保完整显示
        modelRoot.position.y -= afterScaleMin.y;

        tombstoneGroup.add(modelRoot);
        addEngravingToStone();
        setPreviewTransform();
        hideLoading();
      },
      undefined,
      () => {
        const lang = localStorage.getItem("siteLanguage") || "zh-CN";
        const t = translations[lang] || translations["zh-CN"];
        showError(t.error);
      }
    );

    useStoneBtn.addEventListener("click", function () {
      if (isAnimating || !modelRoot) return;
      isAnimating = true;

      localStorage.setItem("selectedStoneStyle", "rounded-real-glb");

      const startTime = performance.now();
      const duration = 1250;

      function animate(now) {
        const t = Math.min(1, (now - startTime) / duration);
        setFinalTransformAlpha(t);
        renderer.render(scene, camera);

        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          window.location.href = "cemetery.html";
        }
      }

      requestAnimationFrame(animate);
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    function render() {
      requestAnimationFrame(render);
      renderer.render(scene, camera);
    }
    render();
  </script>
</body>
</html>
