<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择墓碑 - 星眠宠物纪念园</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #f7f3ee;
      background: #07111d;
      overflow: hidden;
    }

    body {
      position: relative;
      background:
        linear-gradient(180deg, rgba(2, 8, 18, 0.22) 0%, rgba(2, 8, 18, 0.48) 100%),
        url("cemetery-bg.png") center center / cover no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center 62%, rgba(242, 209, 124, 0.12), transparent 22%),
        radial-gradient(circle at 50% 10%, rgba(162, 187, 226, 0.12), transparent 28%);
      pointer-events: none;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding: 28px 42px;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 3;
    }

    .brand {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.96);
      letter-spacing: 0.4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .glass-btn,
    .glass-select {
      height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(18, 22, 28, 0.38);
      color: rgba(255,255,255,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 10px 28px rgba(0,0,0,0.24);
      transition: all 0.25s ease;
      font-size: 16px;
    }

    .glass-btn {
      padding: 0 20px;
      cursor: pointer;
    }

    .glass-btn:hover,
    .glass-select:hover {
      background: rgba(28, 32, 40, 0.46);
      border-color: rgba(255,255,255,0.30);
      transform: translateY(-1px);
    }

    .glass-select {
      min-width: 146px;
      padding: 0 18px;
      outline: none;
      cursor: pointer;
    }

    .main {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 34px;
      align-items: center;
      min-height: calc(100vh - 102px);
    }

    .left-panel {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding-left: 6px;
      z-index: 3;
    }

    .left-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 6px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.32);
    }

    .left-desc {
      margin: 0 0 12px;
      font-size: 14px;
      color: rgba(255,255,255,0.86);
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.24);
    }

    .stone-option {
      width: 100%;
      min-height: 138px;
      padding: 18px 20px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(17,23,30,0.26), rgba(17,23,30,0.18));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 14px 36px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      transition: all 0.28s ease;
      position: relative;
      overflow: hidden;
    }

    .stone-option:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.24);
      background: linear-gradient(180deg, rgba(20,27,34,0.34), rgba(20,27,34,0.24));
    }

    .stone-option.active {
      border-color: rgba(255,255,255,0.28);
      background: linear-gradient(180deg, rgba(30,36,44,0.34), rgba(24,30,38,0.28));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 18px 42px rgba(0,0,0,0.24);
    }

    .stone-icon {
      width: 76px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      opacity: 0.92;
    }

    .stone-icon svg {
      width: 66px;
      height: 80px;
      display: block;
    }

    .stone-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stone-name {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
    }

    .stone-subtitle {
      font-size: 14px;
      line-height: 1.65;
      color: rgba(255,255,255,0.74);
    }

    .confirm-btn {
      margin-top: 8px;
      width: 100%;
      height: 68px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(246, 241, 235, 0.92);
      color: #5a5147;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.45),
        0 14px 30px rgba(0,0,0,0.18);
      transition: all 0.25s ease;
    }

    .confirm-btn:hover {
      transform: translateY(-1px);
      background: rgba(250, 246, 241, 0.96);
    }

    .confirm-btn:disabled {
      opacity: 0.72;
      cursor: wait;
      transform: none;
    }

    .viewer-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      z-index: 2;
    }

    .center-title {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90%, 680px);
      text-align: center;
      z-index: 4;
      pointer-events: none;
    }

    .center-title h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 54px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.97);
      text-shadow: 0 4px 18px rgba(0,0,0,0.34);
    }

    .center-title p {
      margin: 16px auto 0;
      max-width: 620px;
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255,255,255,0.86);
      text-shadow: 0 2px 12px rgba(0,0,0,0.24);
    }

    .viewer-wrap {
      width: min(100%, 920px);
      height: min(72vh, 760px);
      position: relative;
    }

    #stoneCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 24px;
      background: transparent;
    }

    .loading-text,
    .error-text {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: rgba(255,255,255,0.90);
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
      z-index: 5;
      white-space: nowrap;
    }

    .error-text {
      color: #ffd7d7;
      text-align: center;
      white-space: normal;
      max-width: 90%;
      line-height: 1.8;
    }

    @media (max-width: 1100px) {
      .page {
        padding: 20px 18px 26px;
        overflow-y: auto;
      }

      .main {
        grid-template-columns: 1fr;
        gap: 18px;
        min-height: auto;
      }

      .left-panel {
        order: 2;
        padding-left: 0;
      }

      .viewer-area {
        order: 1;
        min-height: 62vh;
      }

      .center-title {
        top: 8px;
      }

      .viewer-wrap {
        width: 100%;
        height: min(60vh, 560px);
      }
    }

    @media (max-width: 720px) {
      body {
        overflow-y: auto;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .topbar-actions {
        justify-content: space-between;
      }

      .glass-btn,
      .glass-select {
        height: 44px;
        font-size: 15px;
      }

      .brand {
        font-size: 16px;
      }

      .left-title {
        font-size: 22px;
      }

      .stone-option {
        min-height: 124px;
        border-radius: 22px;
        padding: 16px 16px;
      }

      .stone-name {
        font-size: 17px;
      }

      .confirm-btn {
        height: 60px;
        font-size: 17px;
      }

      .center-title h1 {
        font-size: 34px;
      }

      .center-title p {
        font-size: 14px;
      }

      .viewer-wrap {
        height: 54vh;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" id="brandText">星眠宠物纪念园</div>

      <div class="topbar-actions">
        <button class="glass-btn" id="backBtn">返回修改</button>

        <select id="languageSelect" class="glass-select" aria-label="language">
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </header>

    <section class="main">
      <aside class="left-panel">
        <div>
          <h2 class="left-title" id="leftTitle">墓碑样式</h2>
          <p class="left-desc" id="leftDesc">选择一个墓碑，中间预览会立刻变化。</p>
        </div>

        <div class="stone-option active" id="roundedOption">
          <div class="stone-icon">
            <svg viewBox="0 0 90 110" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="stoneThumbGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#d9d4cc"/>
                  <stop offset="55%" stop-color="#bdb6ab"/>
                  <stop offset="100%" stop-color="#8c867d"/>
                </linearGradient>
              </defs>
              <path d="M18 96H72V84H18V96Z" fill="url(#stoneThumbGrad)" opacity="0.95"/>
              <path d="M24 83H66V30C66 18.9543 57.0457 10 46 10H44C32.9543 10 24 18.9543 24 30V83Z" fill="url(#stoneThumbGrad)"/>
              <path d="M24 83H66" stroke="#7E786F" stroke-width="1.6" opacity="0.45"/>
            </svg>
          </div>
          <div class="stone-meta">
            <div class="stone-name" id="optionName">圆顶墓碑</div>
            <div class="stone-subtitle" id="optionDesc">真实石材圆顶墓碑。</div>
          </div>
        </div>

        <button class="confirm-btn" id="useStoneBtn">使用这个墓碑</button>
      </aside>

      <div class="viewer-area">
        <div class="center-title">
          <h1 id="mainTitle">选择墓碑</h1>
          <p id="mainDesc">墓碑会慢慢转正，并安静地落到纪念园中。</p>
        </div>

        <div class="viewer-wrap">
          <canvas id="stoneCanvas"></canvas>
          <div class="loading-text" id="loadingText">正在加载墓碑模型...</div>
          <div class="error-text" id="errorText" style="display:none;"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const MODEL_URL = "assets/models/tombstone-real.glb";

    const ENGRAVING_CONFIG = {
      planeWidthRatio: 0.58,
      planeHeightRatio: 0.46,
      offsetYRatio: 0.06,
      offsetZ: 0.0065,
      opacity: 0.92,
      canvasWidth: 1400,
      canvasHeight: 1400,
      nameFontSize: 128,
      dateFontSize: 48,
      epitaphFontSize: 58,
      lineGap: 20,
      maxEpitaphLines: 3,
      textColor: "rgba(70, 74, 78, 0.96)",
      darkShadow: "rgba(18, 20, 22, 0.34)",
      softHighlight: "rgba(255, 255, 255, 0.15)",
      wearAmount: 0.045
    };

    const I18N = {
      zh: {
        brand: "星眠宠物纪念园",
        back: "返回修改",
        leftTitle: "墓碑样式",
        leftDesc: "选择一个墓碑，中间预览会立刻变化。",
        mainTitle: "选择墓碑",
        mainDesc: "墓碑会慢慢转正，并安静地落到纪念园中。",
        optionName: "圆顶墓碑",
        optionDesc: "真实石材圆顶墓碑。",
        useStone: "使用这个墓碑",
        loading: "正在加载墓碑模型...",
        loadError: "墓碑模型加载失败，请检查路径是否正确：assets/models/tombstone-real.glb"
      },
      "zh-TW": {
        brand: "星眠寵物紀念園",
        back: "返回修改",
        leftTitle: "墓碑樣式",
        leftDesc: "選擇一個墓碑，中間預覽會立刻變化。",
        mainTitle: "選擇墓碑",
        mainDesc: "墓碑會慢慢轉正，並安靜地落到紀念園中。",
        optionName: "圓頂墓碑",
        optionDesc: "真實石材圓頂墓碑。",
        useStone: "使用這個墓碑",
        loading: "正在載入墓碑模型...",
        loadError: "墓碑模型載入失敗，請檢查路徑是否正確：assets/models/tombstone-real.glb"
      },
      en: {
        brand: "Starlit Pet Memorial Garden",
        back: "Back to Edit",
        leftTitle: "Stone Style",
        leftDesc: "Choose a stone and the preview updates immediately.",
        mainTitle: "Choose a Memorial Stone",
        mainDesc: "The stone will gently turn forward and settle into the garden.",
        optionName: "Rounded Stone",
        optionDesc: "A realistic rounded stone in natural stone material.",
        useStone: "Use This Stone",
        loading: "Loading tombstone model...",
        loadError: "Failed to load the tombstone model. Please check this path: assets/models/tombstone-real.glb"
      },
      ja: {
        brand: "星眠ペット記念園",
        back: "修正に戻る",
        leftTitle: "墓碑スタイル",
        leftDesc: "墓碑を選ぶと中央プレビューがすぐ変わります。",
        mainTitle: "墓碑を選ぶ",
        mainDesc: "墓碑はゆっくり正面を向き、静かに記念園へ収まります。",
        optionName: "ラウンド墓碑",
        optionDesc: "自然な石材のリアルなラウンド墓碑です。",
        useStone: "この墓碑を使う",
        loading: "墓碑モデルを読み込み中...",
        loadError: "墓碑モデルの読み込みに失敗しました。パスを確認してください：assets/models/tombstone-real.glb"
      }
    };

    const state = {
      language: localStorage.getItem("siteLanguage") || "zh",
      memorial: null,
      scene: null,
      camera: null,
      renderer: null,
      loader: null,
      stoneRoot: null,
      tombstoneModel: null,
      engravingMesh: null,
      engravingCanvas: null,
      engravingContext: null,
      engravingTexture: null,
      isAnimating: false,
      animationFrame: null,
      previewClock: 0
    };

    const els = {
      brandText: document.getElementById("brandText"),
      backBtn: document.getElementById("backBtn"),
      languageSelect: document.getElementById("languageSelect"),
      leftTitle: document.getElementById("leftTitle"),
      leftDesc: document.getElementById("leftDesc"),
      mainTitle: document.getElementById("mainTitle"),
      mainDesc: document.getElementById("mainDesc"),
      optionName: document.getElementById("optionName"),
      optionDesc: document.getElementById("optionDesc"),
      useStoneBtn: document.getElementById("useStoneBtn"),
      loadingText: document.getElementById("loadingText"),
      errorText: document.getElementById("errorText"),
      canvas: document.getElementById("stoneCanvas")
    };

    function getLangText() {
      return I18N[state.language] || I18N.zh;
    }

    function applyLanguage() {
      const text = getLangText();
      document.documentElement.lang = state.language === "zh" ? "zh-CN" : state.language;
      els.brandText.textContent = text.brand;
      els.backBtn.textContent = text.back;
      els.leftTitle.textContent = text.leftTitle;
      els.leftDesc.textContent = text.leftDesc;
      els.mainTitle.textContent = text.mainTitle;
      els.mainDesc.textContent = text.mainDesc;
      els.optionName.textContent = text.optionName;
      els.optionDesc.textContent = text.optionDesc;
      els.useStoneBtn.textContent = text.useStone;
      els.loadingText.textContent = text.loading;
      if (els.errorText.style.display !== "none") {
        els.errorText.textContent = text.loadError;
      }
      els.languageSelect.value = state.language;
      updateEngravingTexture(state.memorial);
    }

    function normalizeDateString(value) {
      if (!value) return "";
      return String(value).trim().replace(/\//g, ".").replace(/-/g, ".");
    }

    function getMemorialData() {
      const raw = localStorage.getItem("myPetMemorial");
      let data = {};
      try {
        data = raw ? JSON.parse(raw) : {};
      } catch (error) {
        data = {};
      }

      const name = data.name || data.petName || data.pet || "豆豆";
      const birthDate = normalizeDateString(data.birthDate || data.birthday || data.birth || "2015.08.20");
      const deathDate = normalizeDateString(data.deathDate || data.passingDate || data.death || "2026.05.12");
      const epitaph = data.epitaph || data.message || data.words || "谢谢你陪我走过这段人生";

      return { ...data, name, birthDate, deathDate, epitaph };
    }

    function createScene() {
      const canvas = els.canvas;
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        28,
        canvas.clientWidth / Math.max(canvas.clientHeight, 1),
        0.1,
        100
      );
      camera.position.set(0, 1.45, 9.2);

      const ambient = new THREE.AmbientLight(0xcfd9e8, 1.55);
      scene.add(ambient);

      const hemi = new THREE.HemisphereLight(0x9fb7d7, 0x4c4132, 1.35);
      hemi.position.set(0, 12, 0);
      scene.add(hemi);

      const moonLight = new THREE.DirectionalLight(0xbfd0ea, 1.28);
      moonLight.position.set(-4.5, 7.5, 7.2);
      moonLight.castShadow = true;
      moonLight.shadow.mapSize.width = 2048;
      moonLight.shadow.mapSize.height = 2048;
      moonLight.shadow.camera.near = 0.1;
      moonLight.shadow.camera.far = 30;
      moonLight.shadow.camera.left = -8;
      moonLight.shadow.camera.right = 8;
      moonLight.shadow.camera.top = 8;
      moonLight.shadow.camera.bottom = -8;
      scene.add(moonLight);

      const warmLightLeft = new THREE.PointLight(0xf2cd8a, 0.85, 18, 2);
      warmLightLeft.position.set(-3.5, 1.25, 2.6);
      scene.add(warmLightLeft);

      const warmLightRight = new THREE.PointLight(0xf0c57f, 0.95, 18, 2);
      warmLightRight.position.set(3.7, 1.25, 2.8);
      scene.add(warmLightRight);

      const backFill = new THREE.PointLight(0x86a2cf, 0.48, 22, 2);
      backFill.position.set(0, 3.6, -4.8);
      scene.add(backFill);

      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 10),
        new THREE.ShadowMaterial({ opacity: 0.14 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.set(0, -2.2, 0.5);
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      const stoneRoot = new THREE.Group();
      stoneRoot.position.set(0.42, -0.64, 0);
      stoneRoot.rotation.y = THREE.MathUtils.degToRad(18);
      stoneRoot.scale.setScalar(1.06);
      scene.add(stoneRoot);

      state.scene = scene;
      state.camera = camera;
      state.renderer = renderer;
      state.stoneRoot = stoneRoot;
      state.loader = new GLTFLoader();
    }

    function resizeScene() {
      if (!state.renderer || !state.camera) return;
      const canvas = els.canvas;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      state.camera.aspect = width / Math.max(height, 1);
      state.camera.updateProjectionMatrix();
      state.renderer.setSize(width, height, false);
    }

    function clearOldStone() {
      if (!state.stoneRoot) return;
      while (state.stoneRoot.children.length) {
        const child = state.stoneRoot.children[0];
        state.stoneRoot.remove(child);
        child.traverse?.((obj) => {
          if (obj.geometry) obj.geometry.dispose?.();
          if (obj.material) {
            if (Array.isArray(obj.material)) {
              obj.material.forEach((mat) => {
                mat.map?.dispose?.();
                mat.dispose?.();
              });
            } else {
              obj.material.map?.dispose?.();
              obj.material.dispose?.();
            }
          }
        });
      }
      state.tombstoneModel = null;
      state.engravingMesh = null;
    }

    function createEngravingCanvas() {
      if (state.engravingCanvas) return;
      state.engravingCanvas = document.createElement("canvas");
      state.engravingCanvas.width = ENGRAVING_CONFIG.canvasWidth;
      state.engravingCanvas.height = ENGRAVING_CONFIG.canvasHeight;
      state.engravingContext = state.engravingCanvas.getContext("2d");

      state.engravingTexture = new THREE.CanvasTexture(state.engravingCanvas);
      state.engravingTexture.colorSpace = THREE.SRGBColorSpace;
      state.engravingTexture.needsUpdate = true;
    }

    function wrapText(ctx, text, maxWidth, maxLines) {
      if (!text) return [];
      const chars = Array.from(text.trim());
      const lines = [];
      let current = "";

      for (let i = 0; i < chars.length; i += 1) {
        const testLine = current + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && current) {
          lines.push(current);
          current = chars[i];
          if (lines.length >= maxLines - 1) break;
        } else {
          current = testLine;
        }
      }

      const remaining = chars.slice(lines.join("").length).join("");
      if (lines.length < maxLines) {
        if (remaining) {
          let finalLine = remaining;
          while (ctx.measureText(finalLine).width > maxWidth && finalLine.length > 1) {
            finalLine = finalLine.slice(0, -1);
          }
          if (finalLine.length < remaining.length) {
            finalLine = finalLine.slice(0, Math.max(0, finalLine.length - 1)) + "…";
          }
          lines.push(finalLine);
        } else if (current) {
          lines.push(current);
        }
      }

      return lines.slice(0, maxLines);
    }

    function drawWornText(ctx, text, x, y, options = {}) {
      const {
        font,
        color = ENGRAVING_CONFIG.textColor,
        align = "center",
        baseline = "middle",
        darkShadow = ENGRAVING_CONFIG.darkShadow,
        softHighlight = ENGRAVING_CONFIG.softHighlight,
        jitter = 0.8
      } = options;

      if (!text) return;

      ctx.save();
      ctx.font = font;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;

      ctx.fillStyle = softHighlight;
      ctx.shadowColor = "transparent";
      ctx.fillText(text, x - 1.2, y - 1.2);

      ctx.fillStyle = darkShadow;
      ctx.globalAlpha = 0.85;
      ctx.fillText(text, x + 1.25, y + 1.45);

      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      for (let i = 0; i < 3; i += 1) {
        const ox = (Math.random() - 0.5) * jitter;
        const oy = (Math.random() - 0.5) * jitter;
        ctx.globalAlpha = 0.42 + i * 0.18;
        ctx.fillText(text, x + ox, y + oy);
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function addWearNoise(ctx, width, height, amount) {
      const count = Math.floor(width * height * amount * 0.00008);
      ctx.save();
      for (let i = 0; i < count; i += 1) {
        const x = Math.random() * width;
        const y = Math.random() * height;
        const r = Math.random() * 2.3;
        const a = Math.random() * 0.06;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function updateEngravingTexture(data) {
      createEngravingCanvas();
      const ctx = state.engravingContext;
      const canvas = state.engravingCanvas;
      if (!ctx || !canvas) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const topY = 250;

      const name = data?.name || "豆豆";
      const dateLine = [data?.birthDate || "", data?.deathDate || ""].filter(Boolean).join(" - ");
      const epitaph = data?.epitaph || "";

      const fontFamily = `"Noto Serif SC","Noto Serif TC","Noto Serif JP","Times New Roman",serif`;

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      drawWornText(ctx, name, centerX, topY, {
        font: `700 ${ENGRAVING_CONFIG.nameFontSize}px ${fontFamily}`
      });

      drawWornText(ctx, dateLine, centerX, topY + 132, {
        font: `500 ${ENGRAVING_CONFIG.dateFontSize}px ${fontFamily}`
      });

      ctx.font = `500 ${ENGRAVING_CONFIG.epitaphFontSize}px ${fontFamily}`;
      const lines = wrapText(ctx, epitaph, canvas.width * 0.64, ENGRAVING_CONFIG.maxEpitaphLines);
      const totalHeight = lines.length * ENGRAVING_CONFIG.epitaphFontSize + Math.max(0, lines.length - 1) * ENGRAVING_CONFIG.lineGap;
      let startY = topY + 266 - totalHeight / 2 + ENGRAVING_CONFIG.epitaphFontSize / 2;

      lines.forEach((line, index) => {
        drawWornText(ctx, line, centerX, startY + index * (ENGRAVING_CONFIG.epitaphFontSize + ENGRAVING_CONFIG.lineGap), {
          font: `500 ${ENGRAVING_CONFIG.epitaphFontSize}px ${fontFamily}`
        });
      });

      addWearNoise(ctx, canvas.width, canvas.height, ENGRAVING_CONFIG.wearAmount);
      ctx.restore();

      if (state.engravingTexture) {
        state.engravingTexture.needsUpdate = true;
      }
    }

    function attachEngravingToModel(modelGroup) {
      createEngravingCanvas();
      updateEngravingTexture(state.memorial);

      const box = new THREE.Box3().setFromObject(modelGroup);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const planeWidth = size.x * ENGRAVING_CONFIG.planeWidthRatio;
      const planeHeight = size.y * ENGRAVING_CONFIG.planeHeightRatio;

      const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
      const material = new THREE.MeshStandardMaterial({
        map: state.engravingTexture,
        transparent: true,
        opacity: ENGRAVING_CONFIG.opacity,
        depthWrite: false,
        roughness: 1,
        metalness: 0,
        alphaTest: 0.01,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2
      });

      const plane = new THREE.Mesh(geometry, material);
      plane.name = "engravingPlane";
      plane.renderOrder = 3;

      plane.position.x = center.x * -1;
      plane.position.y = (size.y * ENGRAVING_CONFIG.offsetYRatio) + 0.1;
      plane.position.z = (size.z / 2) + ENGRAVING_CONFIG.offsetZ;

      modelGroup.add(plane);
      state.engravingMesh = plane;
    }

    function prepareStoneMaterial(mesh) {
      const original = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
      let map = original?.map || null;
      let normalMap = original?.normalMap || null;
      let roughnessMap = original?.roughnessMap || null;

      const stoneMaterial = new THREE.MeshStandardMaterial({
        map,
        normalMap,
        roughnessMap,
        color: new THREE.Color("#b9b1a5"),
        roughness: 0.9,
        metalness: 0.02
      });

      mesh.material = stoneMaterial;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
    }

    function fitStoneModel(root) {
      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const targetHeight = 5.25;
      const scale = targetHeight / size.y;
      root.scale.setScalar(scale);

      const scaledBox = new THREE.Box3().setFromObject(root);
      const scaledCenter = new THREE.Vector3();
      const scaledSize = new THREE.Vector3();
      scaledBox.getCenter(scaledCenter);
      scaledBox.getSize(scaledSize);

      root.position.x -= scaledCenter.x;
      root.position.y -= scaledBox.min.y + 2.18;
      root.position.z -= scaledCenter.z;
    }

    async function loadStoneModel() {
      clearOldStone();
      els.errorText.style.display = "none";
      els.loadingText.style.display = "block";

      try {
        const gltf = await state.loader.loadAsync(MODEL_URL);
        const root = gltf.scene || gltf.scenes?.[0];
        if (!root) throw new Error("GLB scene is empty.");

        root.traverse((obj) => {
          if (obj.isMesh) {
            prepareStoneMaterial(obj);
          }
        });

        fitStoneModel(root);
        state.stoneRoot.add(root);
        state.tombstoneModel = root;

        attachEngravingToModel(root);

        els.loadingText.style.display = "none";
      } catch (error) {
        console.error(error);
        els.loadingText.style.display = "none";
        els.errorText.style.display = "block";
        els.errorText.textContent = getLangText().loadError;
      }
    }

    function renderLoop() {
      if (!state.renderer || !state.scene || !state.camera) return;

      state.previewClock += 0.01;

      if (state.stoneRoot && !state.isAnimating) {
        state.stoneRoot.rotation.y = THREE.MathUtils.lerp(
          state.stoneRoot.rotation.y,
          THREE.MathUtils.degToRad(18) + Math.sin(state.previewClock) * 0.015,
          0.08
        );
      }

      state.renderer.render(state.scene, state.camera);
      requestAnimationFrame(renderLoop);
    }

    function animateConfirm() {
      if (!state.stoneRoot || state.isAnimating) return;
      state.isAnimating = true;
      els.useStoneBtn.disabled = true;

      const start = {
        x: state.stoneRoot.position.x,
        y: state.stoneRoot.position.y,
        z: state.stoneRoot.position.z,
        scale: state.stoneRoot.scale.x,
        rotY: state.stoneRoot.rotation.y
      };

      const end = {
        x: 0.18,
        y: -1.26,
        z: -0.1,
        scale: 0.44,
        rotY: 0
      };

      const duration = 1200;
      const begin = performance.now();

      function ease(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function step(now) {
        const t = Math.min(1, (now - begin) / duration);
        const k = ease(t);

        state.stoneRoot.position.x = THREE.MathUtils.lerp(start.x, end.x, k);
        state.stoneRoot.position.y = THREE.MathUtils.lerp(start.y, end.y, k);
        state.stoneRoot.position.z = THREE.MathUtils.lerp(start.z, end.z, k);
        const scale = THREE.MathUtils.lerp(start.scale, end.scale, k);
        state.stoneRoot.scale.setScalar(scale);
        state.stoneRoot.rotation.y = THREE.MathUtils.lerp(start.rotY, end.rotY, k);

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          localStorage.setItem("selectedStoneStyle", "rounded-real");
          localStorage.setItem("selectedStoneModel", MODEL_URL);
          sessionStorage.setItem("memorialStoneAnimated", "1");
          window.location.href = "cemetery.html";
        }
      }

      requestAnimationFrame(step);
    }

    function bindEvents() {
      window.addEventListener("resize", resizeScene);

      els.languageSelect.addEventListener("change", (event) => {
        state.language = event.target.value;
        localStorage.setItem("siteLanguage", state.language);
        applyLanguage();
      });

      els.backBtn.addEventListener("click", () => {
        window.location.href = "create.html";
      });

      els.useStoneBtn.addEventListener("click", animateConfirm);

      window.addEventListener("storage", (event) => {
        if (event.key === "myPetMemorial") {
          state.memorial = getMemorialData();
          updateEngravingTexture(state.memorial);
        }
        if (event.key === "siteLanguage") {
          state.language = localStorage.getItem("siteLanguage") || "zh";
          applyLanguage();
        }
      });
    }

    function init() {
      state.memorial = getMemorialData();
      createScene();
      resizeScene();
      applyLanguage();
      bindEvents();
      loadStoneModel();
      renderLoop();
    }

    init();
  </script>
</body>
</html>
