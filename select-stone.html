<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择墓碑 - 星眠宠物纪念园</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: #08111f;
      color: #fff;
    }

    body {
      position: relative;
      background-image:
        linear-gradient(rgba(7, 10, 16, 0.18), rgba(7, 10, 16, 0.32)),
        url("./cemetery-bg.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .top-left-brand {
      position: absolute;
      top: 34px;
      left: 42px;
      z-index: 20;
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 2px 14px rgba(0,0,0,0.45);
    }

    .top-right-actions {
      position: absolute;
      top: 28px;
      right: 34px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ghost-btn,
    .lang-select {
      height: 50px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(12, 16, 22, 0.72);
      color: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .ghost-btn {
      padding: 0 22px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .ghost-btn:hover {
      background: rgba(20, 25, 32, 0.9);
      transform: translateY(-1px);
    }

    .lang-select {
      min-width: 132px;
      padding: 0 18px;
      font-size: 16px;
      outline: none;
      cursor: pointer;
    }

    .left-panel {
      position: absolute;
      left: 32px;
      top: 160px;
      width: 410px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .left-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 4px 18px rgba(0,0,0,0.45);
    }

    .left-desc {
      font-size: 16px;
      line-height: 1.65;
      color: rgba(255,255,255,0.84);
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }

    .stone-card {
      width: 100%;
      min-height: 136px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(8, 12, 18, 0.64);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.22);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 26px;
      transition: 0.25s ease;
      cursor: pointer;
    }

    .stone-card.active {
      border-color: rgba(255,255,255,0.18);
      background: rgba(8, 12, 18, 0.78);
    }

    .stone-card:hover {
      transform: translateY(-1px);
    }

    .stone-icon {
      width: 68px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stone-icon svg {
      width: 60px;
      height: 78px;
      opacity: 0.95;
    }

    .stone-text {
      flex: 1;
      min-width: 0;
    }

    .stone-name {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.96);
    }

    .stone-note {
      font-size: 16px;
      color: rgba(255,255,255,0.82);
      line-height: 1.5;
    }

    .use-btn {
      margin-top: 10px;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.92);
      color: #3f342d;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 34px rgba(0,0,0,0.18);
      transition: 0.25s ease;
    }

    .use-btn:hover {
      transform: translateY(-1px);
      background: #ffffff;
    }

    .hero-title-wrap {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      text-align: center;
      pointer-events: none;
    }

    .hero-title {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.04;
      margin-bottom: 16px;
      text-shadow: 0 6px 24px rgba(0,0,0,0.38);
    }

    .hero-subtitle {
      font-size: 20px;
      font-weight: 600;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 4px 16px rgba(0,0,0,0.32);
    }

    .stage {
      position: absolute;
      inset: 0;
      z-index: 5;
      overflow: hidden;
    }

    #stoneCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .loading-tip {
      position: absolute;
      left: 50%;
      top: 57%;
      transform: translate(-50%, -50%);
      z-index: 15;
      font-size: 18px;
      color: rgba(255,255,255,0.86);
      text-shadow: 0 4px 14px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .ground-mask {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 17vh;
      z-index: 9;
      pointer-events: none;
      background:
        linear-gradient(to top,
          rgba(7, 10, 16, 0.00) 0%,
          rgba(7, 10, 16, 0.00) 55%,
          rgba(7, 10, 16, 0.04) 75%,
          rgba(7, 10, 16, 0.10) 100%);
    }

    @media (max-width: 1100px) {
      .left-panel {
        width: 340px;
        left: 18px;
        top: 144px;
      }
      .hero-title {
        font-size: 52px;
      }
      .hero-subtitle {
        font-size: 17px;
      }
    }

    @media (max-width: 768px) {
      .top-left-brand {
        top: 18px;
        left: 18px;
        font-size: 15px;
      }

      .top-right-actions {
        top: 16px;
        right: 14px;
        gap: 10px;
      }

      .ghost-btn,
      .lang-select {
        height: 42px;
        font-size: 14px;
      }

      .hero-title-wrap {
        top: 88px;
        width: calc(100% - 24px);
      }

      .hero-title {
        font-size: 42px;
        margin-bottom: 8px;
      }

      .hero-subtitle {
        font-size: 15px;
      }

      .left-panel {
        top: auto;
        left: 14px;
        right: 14px;
        bottom: 18px;
        width: auto;
        gap: 12px;
      }

      .left-title {
        font-size: 24px;
      }

      .left-desc {
        font-size: 14px;
      }

      .stone-card {
        min-height: 108px;
        padding: 16px 18px;
        border-radius: 22px;
      }

      .stone-icon {
        width: 52px;
        height: 68px;
      }

      .stone-icon svg {
        width: 46px;
        height: 62px;
      }

      .stone-name {
        font-size: 18px;
      }

      .stone-note {
        font-size: 14px;
      }

      .use-btn {
        height: 54px;
        font-size: 18px;
      }

      .loading-tip {
        top: 48%;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-left-brand" id="siteBrand">星眠宠物纪念园</div>

    <div class="top-right-actions">
      <button class="ghost-btn" id="backBtn">返回修改</button>
      <select class="lang-select" id="languageSwitcher">
        <option value="zh">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>

    <div class="hero-title-wrap">
      <div class="hero-title" id="pageTitle">选择墓碑</div>
      <div class="hero-subtitle" id="pageSubtitle">墓碑会慢慢转正，并安静地落到纪念园中。</div>
    </div>

    <div class="left-panel">
      <div class="left-title" id="leftTitle">墓碑样式</div>
      <div class="left-desc" id="leftDesc">选择一个墓碑，中间预览会立刻变化。</div>

      <div class="stone-card active" id="stoneCard">
        <div class="stone-icon">
          <svg viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 92H62V80H18V92Z" fill="#ece8df"/>
            <path d="M22 80H58V20C58 10 50 2 40 2C30 2 22 10 22 20V80Z" fill="#f3efe7"/>
          </svg>
        </div>
        <div class="stone-text">
          <div class="stone-name" id="stoneName">圆顶墓碑</div>
          <div class="stone-note" id="stoneNote">真实石材圆顶墓碑。</div>
        </div>
      </div>

      <button class="use-btn" id="useStoneBtn">使用这个墓碑</button>
    </div>

    <div class="stage">
      <canvas id="stoneCanvas"></canvas>
      <div class="loading-tip" id="loadingTip">正在加载墓碑模型...</div>
      <div class="ground-mask"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const I18N = {
      zh: {
        brand: "星眠宠物纪念园",
        back: "返回修改",
        title: "选择墓碑",
        subtitle: "墓碑会慢慢转正，并安静地落到纪念园中。",
        leftTitle: "墓碑样式",
        leftDesc: "选择一个墓碑，中间预览会立刻变化。",
        stoneName: "圆顶墓碑",
        stoneNote: "真实石材圆顶墓碑。",
        useStone: "使用这个墓碑",
        loading: "正在加载墓碑模型..."
      },
      "zh-TW": {
        brand: "星眠寵物紀念園",
        back: "返回修改",
        title: "選擇墓碑",
        subtitle: "墓碑會慢慢轉正，並安靜地落到紀念園中。",
        leftTitle: "墓碑樣式",
        leftDesc: "選擇一個墓碑，中間預覽會立刻變化。",
        stoneName: "圓頂墓碑",
        stoneNote: "真實石材圓頂墓碑。",
        useStone: "使用這個墓碑",
        loading: "正在載入墓碑模型..."
      },
      en: {
        brand: "Starlit Pet Memorial Garden",
        back: "Back to Edit",
        title: "Choose a Headstone",
        subtitle: "The headstone will gently straighten and settle into the memorial garden.",
        leftTitle: "Headstone Style",
        leftDesc: "Choose a headstone and the preview will update immediately.",
        stoneName: "Rounded Headstone",
        stoneNote: "A realistic stone rounded memorial headstone.",
        useStone: "Use This Headstone",
        loading: "Loading headstone model..."
      },
      ja: {
        brand: "星眠ペット記念園",
        back: "編集に戻る",
        title: "墓碑を選ぶ",
        subtitle: "墓碑はゆっくり正面を向き、静かに記念園へ収まります。",
        leftTitle: "墓碑スタイル",
        leftDesc: "墓碑を選ぶと中央のプレビューがすぐ変わります。",
        stoneName: "丸型墓碑",
        stoneNote: "リアルな石材の丸型墓碑です。",
        useStone: "この墓碑を使う",
        loading: "墓碑モデルを読み込み中..."
      }
    };

    const MODEL_PATH = "./assets/models/tombstone-real.glb";

    const PREVIEW_CONFIG = {
      modelScale: 1.56,        // 模型整体大小
      modelX: 1.06,            // 左右位置：减小更往左
      modelY: -1.98,           // 上下位置：更大更往下
      modelZ: 0.0,
      modelRotY: 0.40,         // 预览页倾斜角度，正值往一个方向，负值反方向
      modelRotX: 0.0,
      modelRotZ: 0.0
    };

    const FINAL_CONFIG = {
      modelScale: 0.88,
      modelX: 0.00,
      modelY: -2.58,
      modelZ: -0.72,
      modelRotY: 0.0,
      modelRotX: 0.0,
      modelRotZ: 0.0
    };

    const ENGRAVING = {
      planeWidth: 1.30,
      planeHeight: 1.74,
      offsetX: 0.0,
      offsetY: 0.74,
      offsetZ: 0.030,
      nameY: 300,
      dateY: 470,
      epitaphY: 650,
      nameSize: 108,
      dateSize: 46,
      epitaphSize: 50,
      maxTextWidth: 720,
      lineHeight: 72,
      maxLines: 3
    };

    const state = {
      language: localStorage.getItem("siteLanguage") || "zh",
      memorial: readMemorialData(),
      renderer: null,
      scene: null,
      camera: null,
      stoneRoot: null,
      stoneModel: null,
      engravingPlane: null,
      animationId: null,
      isAnimatingToFinal: false
    };

    function readMemorialData() {
      try {
        const raw = JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
        return {
          name: raw.name || raw.petName || "未命名",
          birthDate: raw.birthDate || "",
          deathDate: raw.deathDate || "",
          epitaph: raw.epitaph || raw.message || "谢谢你陪我走过这段人生"
        };
      } catch (e) {
        return {
          name: "未命名",
          birthDate: "",
          deathDate: "",
          epitaph: "谢谢你陪我走过这段人生"
        };
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      return String(dateStr).replace(/-/g, ".");
    }

    function getDateLine(data) {
      const a = formatDate(data.birthDate);
      const b = formatDate(data.deathDate);
      if (a && b) return a + " - " + b;
      if (a) return a;
      if (b) return b;
      return "";
    }

    function applyLanguage(lang) {
      const text = I18N[lang] || I18N.zh;
      document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : lang;
      document.getElementById("siteBrand").textContent = text.brand;
      document.getElementById("backBtn").textContent = text.back;
      document.getElementById("pageTitle").textContent = text.title;
      document.getElementById("pageSubtitle").textContent = text.subtitle;
      document.getElementById("leftTitle").textContent = text.leftTitle;
      document.getElementById("leftDesc").textContent = text.leftDesc;
      document.getElementById("stoneName").textContent = text.stoneName;
      document.getElementById("stoneNote").textContent = text.stoneNote;
      document.getElementById("useStoneBtn").textContent = text.useStone;
      document.getElementById("loadingTip").textContent = text.loading;
      document.getElementById("languageSwitcher").value = lang;
      localStorage.setItem("siteLanguage", lang);
    }

    function wrapText(ctx, text, maxWidth, maxLines) {
      if (!text) return [];
      const chars = Array.from(text);
      const lines = [];
      let current = "";

      for (let i = 0; i < chars.length; i++) {
        const test = current + chars[i];
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = chars[i];
          if (lines.length >= maxLines - 1) break;
        } else {
          current = test;
        }
      }

      const consumed = lines.join("").length;
      const rest = chars.slice(consumed).join("");
      if (lines.length < maxLines && rest) {
        lines.push(rest);
      }

      if (lines.length > maxLines) {
        lines.length = maxLines;
      }

      if (lines.length === maxLines) {
        const last = lines[maxLines - 1];
        if (ctx.measureText(last).width > maxWidth) {
          let trimmed = last;
          while (trimmed.length > 1 && ctx.measureText(trimmed + "…").width > maxWidth) {
            trimmed = trimmed.slice(0, -1);
          }
          lines[maxLines - 1] = trimmed + "…";
        }
      }

      return lines;
    }

    function makeEngravingTexture(data) {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const centerX = canvas.width / 2;

      function drawCarvedText(text, y, fontSize, weight = 600) {
        if (!text) return;
        ctx.save();
        ctx.font = `${weight} ${fontSize}px "Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif`;

        // 轻微内凹假象
        ctx.shadowColor = "rgba(255,255,255,0.08)";
        ctx.shadowBlur = 2;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = -1;
        ctx.fillStyle = "rgba(235,238,240,0.10)";
        ctx.fillText(text, centerX, y);

        ctx.shadowColor = "rgba(0,0,0,0.22)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 2;
        ctx.fillStyle = "rgba(42,46,50,0.48)";
        ctx.fillText(text, centerX, y + 1.5);

        ctx.shadowColor = "transparent";
        ctx.fillStyle = "rgba(58,64,70,0.54)";
        ctx.fillText(text, centerX, y);

        // 边缘磨损
        ctx.globalAlpha = 0.10;
        ctx.fillStyle = "rgba(250,250,250,0.55)";
        ctx.fillText(text, centerX + 1, y - 1);
        ctx.globalAlpha = 1;

        ctx.restore();
      }

      const name = data.name || "";
      const dateLine = getDateLine(data);
      const epitaph = data.epitaph || "";

      drawCarvedText(name, ENGRAVING.nameY, ENGRAVING.nameSize, 700);

      if (dateLine) {
        drawCarvedText(dateLine, ENGRAVING.dateY, ENGRAVING.dateSize, 500);
      }

      if (epitaph) {
        ctx.save();
        ctx.font = `500 ${ENGRAVING.epitaphSize}px "Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif`;
        const lines = wrapText(ctx, epitaph, ENGRAVING.maxTextWidth, ENGRAVING.maxLines);
        ctx.restore();

        lines.forEach((line, index) => {
          drawCarvedText(
            line,
            ENGRAVING.epitaphY + index * ENGRAVING.lineHeight,
            ENGRAVING.epitaphSize,
            500
          );
        });
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 8;
      texture.needsUpdate = true;
      texture.transparent = true;
      return texture;
    }

    function buildEngravingPlane() {
      const texture = makeEngravingTexture(state.memorial);

      const geometry = new THREE.PlaneGeometry(ENGRAVING.planeWidth, ENGRAVING.planeHeight);
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        transparent: true,
        alphaTest: 0.02,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        roughness: 0.95,
        metalness: 0.0
      });

      const plane = new THREE.Mesh(geometry, material);
      plane.position.set(ENGRAVING.offsetX, ENGRAVING.offsetY, ENGRAVING.offsetZ);
      return plane;
    }

    function createScene() {
      const canvas = document.getElementById("stoneCanvas");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.2, 10.8);

      // 环境光
      const ambient = new THREE.HemisphereLight(0xcad8ff, 0x1a1a18, 1.22);
      scene.add(ambient);

      // 月光方向
      const moonLight = new THREE.DirectionalLight(0xaec5ff, 1.08);
      moonLight.position.set(-3.5, 7.0, 5.6);
      scene.add(moonLight);

      // 暖色地灯补光
      const warmLightLeft = new THREE.PointLight(0xffc46a, 0.9, 18, 2.0);
      warmLightLeft.position.set(-2.8, -2.2, 4.0);
      scene.add(warmLightLeft);

      const warmLightRight = new THREE.PointLight(0xffc46a, 0.75, 18, 2.0);
      warmLightRight.position.set(3.4, -2.0, 3.5);
      scene.add(warmLightRight);

      const frontFill = new THREE.DirectionalLight(0xf7f3ea, 0.36);
      frontFill.position.set(0.4, 1.8, 6.0);
      scene.add(frontFill);

      state.renderer = renderer;
      state.scene = scene;
      state.camera = camera;
    }

    function applyStoneMaterials(root) {
      root.traverse((child) => {
        if (!child.isMesh) return;

        child.castShadow = false;
        child.receiveShadow = false;

        let material = child.material;
        if (Array.isArray(material)) material = material[0];

        const baseMap = material && material.map ? material.map : null;
        const normalMap = material && material.normalMap ? material.normalMap : null;
        const roughnessMap = material && material.roughnessMap ? material.roughnessMap : null;

        child.material = new THREE.MeshStandardMaterial({
          color: 0xd6d0c5,
          map: baseMap || null,
          normalMap: normalMap || null,
          roughnessMap: roughnessMap || null,
          roughness: 0.97,
          metalness: 0.02
        });
      });
    }

    function loadStoneModel() {
      const loader = new GLTFLoader();

      loader.load(
        MODEL_PATH,
        (gltf) => {
          const root = new THREE.Group();
          const model = gltf.scene;

          applyStoneMaterials(model);

          model.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          model.position.x -= center.x;
          model.position.z -= center.z;
          model.position.y -= box.min.y;

          const engravingPlane = buildEngravingPlane();
          model.add(engravingPlane);

          root.add(model);
          state.scene.add(root);

          state.stoneRoot = root;
          state.stoneModel = model;
          state.engravingPlane = engravingPlane;

          setRootTransform(PREVIEW_CONFIG);
          document.getElementById("loadingTip").style.display = "none";
        },
        undefined,
        () => {
          document.getElementById("loadingTip").textContent = "模型加载失败，请检查路径";
        }
      );
    }

    function setRootTransform(cfg) {
      if (!state.stoneRoot) return;
      state.stoneRoot.position.set(cfg.modelX, cfg.modelY, cfg.modelZ);
      state.stoneRoot.scale.setScalar(cfg.modelScale);
      state.stoneRoot.rotation.set(cfg.modelRotX, cfg.modelRotY, cfg.modelRotZ);
    }

    function animateToFinalThenGo() {
      if (!state.stoneRoot || state.isAnimatingToFinal) return;
      state.isAnimatingToFinal = true;

      const start = {
        x: state.stoneRoot.position.x,
        y: state.stoneRoot.position.y,
        z: state.stoneRoot.position.z,
        s: state.stoneRoot.scale.x,
        ry: state.stoneRoot.rotation.y
      };

      const end = {
        x: FINAL_CONFIG.modelX,
        y: FINAL_CONFIG.modelY,
        z: FINAL_CONFIG.modelZ,
        s: FINAL_CONFIG.modelScale,
        ry: FINAL_CONFIG.modelRotY
      };

      const duration = 1100;
      const startTime = performance.now();

      function ease(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const k = ease(t);

        state.stoneRoot.position.x = start.x + (end.x - start.x) * k;
        state.stoneRoot.position.y = start.y + (end.y - start.y) * k;
        state.stoneRoot.position.z = start.z + (end.z - start.z) * k;
        const s = start.s + (end.s - start.s) * k;
        state.stoneRoot.scale.setScalar(s);
        state.stoneRoot.rotation.y = start.ry + (end.ry - start.ry) * k;

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          localStorage.setItem("selectedStoneStyle", "rounded-glb");
          window.location.href = "./cemetery.html";
        }
      }

      requestAnimationFrame(step);
    }

    function renderLoop() {
      state.animationId = requestAnimationFrame(renderLoop);
      if (state.renderer && state.scene && state.camera) {
        state.renderer.render(state.scene, state.camera);
      }
    }

    function bindEvents() {
      document.getElementById("languageSwitcher").addEventListener("change", (e) => {
        state.language = e.target.value;
        applyLanguage(state.language);
      });

      document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "./create.html";
      });

      document.getElementById("useStoneBtn").addEventListener("click", () => {
        animateToFinalThenGo();
      });

      window.addEventListener("resize", () => {
        if (!state.renderer || !state.camera) return;
        state.camera.aspect = window.innerWidth / window.innerHeight;
        state.camera.updateProjectionMatrix();
        state.renderer.setSize(window.innerWidth, window.innerHeight);
        state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    }

    function init() {
      applyLanguage(state.language);
      bindEvents();
      createScene();
      loadStoneModel();
      renderLoop();
    }

    init();
  </script>
</body>
</html>
