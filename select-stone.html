<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Tombstone</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #10140f;
      color: #fffaf5;
      overflow: hidden;
    }

    button,
    a {
      outline: none;
    }

    .stone-select-page {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background-image:
        linear-gradient(
          180deg,
          rgba(6, 10, 18, 0.06) 0%,
          rgba(6, 10, 18, 0.10) 42%,
          rgba(6, 10, 18, 0.34) 100%
        ),
        url("cemetery-bg.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      padding: 28px 38px 34px;
    }

    .top-bar {
      position: relative;
      z-index: 20;
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: opacity 0.45s ease;
    }

    body.planting .top-bar,
    body.planting .left-panel,
    body.planting .instruction {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      color: rgba(255, 250, 245, 0.92);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .back-link {
      color: rgba(255, 244, 232, 0.78);
      text-decoration: none;
      font-size: 14px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
      padding: 8px 0;
    }

    .back-link:hover {
      color: #fffaf5;
    }

    .page-layout {
      position: relative;
      z-index: 5;
      max-width: 1280px;
      margin: 0 auto;
      height: calc(100vh - 70px);
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 24px;
      align-items: center;
    }

    .left-panel {
      align-self: center;
      padding-top: 30px;
      transition: opacity 0.45s ease;
    }

    .panel-title {
      margin: 0 0 14px;
      color: rgba(255, 250, 245, 0.94);
      font-size: 22px;
      font-weight: 500;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .panel-subtitle {
      margin: 0 0 22px;
      color: rgba(255, 244, 232, 0.68);
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.24);
    }

    .stone-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .stone-list::-webkit-scrollbar {
      width: 5px;
    }

    .stone-list::-webkit-scrollbar-track {
      background: rgba(255, 250, 245, 0.04);
      border-radius: 999px;
    }

    .stone-list::-webkit-scrollbar-thumb {
      background: rgba(255, 250, 245, 0.24);
      border-radius: 999px;
    }

    .stone-option {
      width: 100%;
      border: none;
      background: transparent;
      color: #fffaf5;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .stone-option-inner {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 22px;
      border: 1px solid rgba(255, 250, 245, 0.14);
      background: rgba(255, 250, 245, 0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: 0.22s ease;
    }

    .stone-option:hover .stone-option-inner {
      background: rgba(255, 250, 245, 0.10);
      border-color: rgba(255, 250, 245, 0.28);
      transform: translateX(6px);
    }

    .stone-option.active .stone-option-inner {
      background: rgba(255, 250, 245, 0.16);
      border-color: rgba(255, 250, 245, 0.46);
    }

    .mini-preview {
      width: 58px;
      height: 72px;
      position: relative;
      display: flex;
      align-items: end;
      justify-content: center;
    }

    .mini-base {
      position: absolute;
      bottom: 0;
      width: 52px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #968d85, #625a53);
    }

    .mini-stone {
      position: absolute;
      bottom: 7px;
      width: 40px;
      height: 52px;
      background: linear-gradient(180deg, #ded8d0, #8c837b);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.22);
    }

    .mini-rounded {
      border-radius: 24px 24px 8px 8px;
    }

    .mini-square {
      border-radius: 10px;
    }

    .mini-arch {
      width: 42px;
      height: 60px;
      border-radius: 24px 24px 6px 6px;
    }

    .mini-small {
      width: 34px;
      height: 44px;
      border-radius: 18px 18px 8px 8px;
    }

    .mini-heart {
      width: 40px;
      height: 42px;
      border-radius: 12px 12px 8px 8px;
    }

    .mini-heart::before,
    .mini-heart::after {
      content: "";
      position: absolute;
      top: -13px;
      width: 21px;
      height: 21px;
      background: linear-gradient(180deg, #ded8d0, #a49b93);
      border-radius: 50%;
    }

    .mini-heart::before {
      left: 1px;
    }

    .mini-heart::after {
      right: 1px;
    }

    .option-name {
      margin: 0 0 4px;
      font-size: 14px;
      color: rgba(255, 250, 245, 0.92);
    }

    .option-desc {
      margin: 0;
      font-size: 12px;
      color: rgba(255, 244, 232, 0.58);
      line-height: 1.5;
    }

    .confirm-button {
      width: 100%;
      margin-top: 22px;
      border: none;
      background: rgba(255, 250, 245, 0.92);
      color: #4b3d35;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.16);
    }

    .confirm-button:hover {
      background: #fffaf5;
    }

    .center-area {
      position: relative;
      height: 100%;
    }

    .instruction {
      position: absolute;
      left: 50%;
      top: 42px;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      width: min(680px, 90vw);
      text-shadow: 0 3px 18px rgba(0,0,0,0.34);
      transition: opacity 0.45s ease;
    }

    .instruction h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      color: #fff8ef;
    }

    .instruction p {
      margin: 0;
      color: rgba(255, 244, 232, 0.76);
      font-size: 14px;
    }

    /*
      选择页：墓碑先很大、很近。
      点击确认后：缩小、后退、落到最终位置。
    */
    .center-stone-wrap {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%) scale(1.22);
      transform-origin: center bottom;
      width: 360px;
      height: 480px;
      display: flex;
      align-items: end;
      justify-content: center;
      z-index: 4;
      transition:
        top 1.25s cubic-bezier(0.2, 0.8, 0.2, 1),
        transform 1.25s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.35s ease;
    }

    .center-stone-wrap.changing {
      opacity: 0.72;
    }

    body.planting .center-stone-wrap {
      top: 54%;
      transform: translate(-50%, -50%) scale(0.86);
    }

    .center-stone-shadow {
      position: absolute;
      bottom: 6px;
      width: 290px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.36);
      filter: blur(14px);
      transition: width 1.25s ease, opacity 1.25s ease;
    }

    body.planting .center-stone-shadow {
      width: 240px;
      opacity: 0.85;
    }

    .center-stone {
      position: relative;
      width: 230px;
      min-height: 300px;
      padding: 36px 24px 30px;
      background:
        linear-gradient(
          180deg,
          #ddd8cf 0%,
          #b8afa5 52%,
          #80776f 100%
        );
      color: #514941;
      text-align: center;
      box-shadow:
        inset 0 5px 12px rgba(255,255,255,0.34),
        inset 0 -8px 16px rgba(55,48,42,0.18),
        0 26px 48px rgba(0,0,0,0.42);
      z-index: 2;
      transition: filter 1.25s ease;
    }

    body.planting .center-stone {
      filter: brightness(0.98);
    }

    .center-stone.rounded {
      border-radius: 115px 115px 26px 26px;
    }

    .center-stone.square {
      border-radius: 28px;
    }

    .center-stone.arch {
      width: 238px;
      min-height: 336px;
      border-radius: 120px 120px 18px 18px;
    }

    .center-stone.small {
      width: 192px;
      min-height: 248px;
      border-radius: 92px 92px 22px 22px;
    }

    .center-stone.heart {
      width: 226px;
      min-height: 270px;
      border-radius: 34px 34px 24px 24px;
      margin-top: 44px;
    }

    .center-stone.heart::before,
    .center-stone.heart::after {
      content: "";
      position: absolute;
      top: -56px;
      width: 112px;
      height: 112px;
      background:
        linear-gradient(
          180deg,
          #ddd8cf 0%,
          #b8afa5 70%,
          #9f968d 100%
        );
      border-radius: 50%;
      z-index: -1;
      box-shadow: inset 0 5px 12px rgba(255,255,255,0.26);
    }

    .center-stone.heart::before {
      left: 15px;
    }

    .center-stone.heart::after {
      right: 15px;
    }

    .stone-photo {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: rgba(255,250,245,0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 30px;
    }

    .stone-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .stone-name {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 500;
      color: #4d453f;
    }

    .stone-years {
      margin: 0 0 14px;
      font-size: 14px;
      color: #746b64;
    }

    .stone-words {
      margin: 0 auto;
      max-width: 168px;
      font-size: 14px;
      line-height: 1.6;
      color: #5f554e;
    }

    .stone-base {
      position: absolute;
      bottom: 0;
      width: 294px;
      height: 38px;
      border-radius: 20px 20px 10px 10px;
      background: linear-gradient(180deg, #968d85, #665d56);
      box-shadow:
        inset 0 3px 6px rgba(255,255,255,0.14),
        0 18px 34px rgba(0,0,0,0.32);
      z-index: 1;
      transition: width 1.25s ease;
    }

    body.planting .stone-base {
      width: 270px;
    }

    .right-space {
      pointer-events: none;
    }

    .planting-cover {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 18, 0);
      z-index: 100;
      pointer-events: none;
      transition: background 0.5s ease 1.0s;
    }

    body.planting .planting-cover {
      background: rgba(6, 10, 18, 0.18);
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .stone-select-page {
        padding: 24px;
      }

      .page-layout {
        height: auto;
        min-height: calc(100vh - 80px);
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .left-panel {
        order: 2;
        padding-top: 0;
      }

      .center-area {
        order: 1;
        height: 620px;
      }

      .right-space {
        display: none;
      }

      .instruction {
        top: 24px;
      }

      .instruction h1 {
        font-size: 26px;
      }

      .center-stone-wrap {
        top: 57%;
        transform: translate(-50%, -50%) scale(1);
      }

      body.planting .center-stone-wrap {
        top: 55%;
        transform: translate(-50%, -50%) scale(0.82);
      }

      .stone-list {
        max-height: none;
      }
    }
  </style>
</head>

<body>

  <main class="stone-select-page">

    <header class="top-bar">
      <a href="index.html" class="logo" data-key="logo">Starlit Pet Memorial Garden</a>
      <a href="create.html" class="back-link" data-key="backBtn">Back to edit</a>
    </header>

    <section class="page-layout">

      <aside class="left-panel">
        <h2 class="panel-title" data-key="panelTitle">Tombstone</h2>
        <p class="panel-subtitle" data-key="panelSubtitle">
          Choose one style. The stone in the garden will change immediately.
        </p>

        <div class="stone-list" id="stoneList">

          <button class="stone-option active" data-style="rounded" onclick="selectStone('rounded', this)">
            <div class="stone-option-inner">
              <div class="mini-preview">
                <div class="mini-stone mini-rounded"></div>
                <div class="mini-base"></div>
              </div>
              <div>
                <p class="option-name" data-key="roundedName">Rounded top</p>
                <p class="option-desc" data-key="roundedDesc">Gentle and classic.</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="square" onclick="selectStone('square', this)">
            <div class="stone-option-inner">
              <div class="mini-preview">
                <div class="mini-stone mini-square"></div>
                <div class="mini-base"></div>
              </div>
              <div>
                <p class="option-name" data-key="squareName">Soft square</p>
                <p class="option-desc" data-key="squareDesc">Simple and quiet.</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="heart" onclick="selectStone('heart', this)">
            <div class="stone-option-inner">
              <div class="mini-preview">
                <div class="mini-stone mini-heart"></div>
                <div class="mini-base"></div>
              </div>
              <div>
                <p class="option-name" data-key="heartName">Heart style</p>
                <p class="option-desc" data-key="heartDesc">Warm and soft.</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="arch" onclick="selectStone('arch', this)">
            <div class="stone-option-inner">
              <div class="mini-preview">
                <div class="mini-stone mini-arch"></div>
                <div class="mini-base"></div>
              </div>
              <div>
                <p class="option-name" data-key="archName">Tall arch</p>
                <p class="option-desc" data-key="archDesc">Calm and solemn.</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="small" onclick="selectStone('small', this)">
            <div class="stone-option-inner">
              <div class="mini-preview">
                <div class="mini-stone mini-small"></div>
                <div class="mini-base"></div>
              </div>
              <div>
                <p class="option-name" data-key="smallName">Small pet stone</p>
                <p class="option-desc" data-key="smallDesc">Tiny and gentle.</p>
              </div>
            </div>
          </button>

        </div>

        <button class="confirm-button" onclick="confirmStone()" data-key="confirmBtn">
          Use this tombstone
        </button>
      </aside>

      <section class="center-area">

        <div class="instruction">
          <h1 data-key="title">Choose a tombstone</h1>
          <p data-key="subtitle">Click a style on the left. The center stone will change.</p>
        </div>

        <div class="center-stone-wrap" id="centerStoneWrap">
          <div class="center-stone-shadow"></div>

          <div class="center-stone rounded" id="centerStone">
            <div class="stone-photo" id="stonePhoto">🐾</div>
            <h2 class="stone-name" id="stoneName">Luna</h2>
            <p class="stone-years" id="stoneYears">---- — ----</p>
            <p class="stone-words" id="stoneWords">You are loved, always.</p>
          </div>

          <div class="stone-base"></div>
        </div>

      </section>

      <div class="right-space"></div>

    </section>

  </main>

  <div class="planting-cover"></div>

  <script>
    let selectedStoneStyle = "rounded";

    const translations = {
      en: {
        logo: "Starlit Pet Memorial Garden",
        backBtn: "Back to edit",
        panelTitle: "Tombstone",
        panelSubtitle: "Choose one style. The stone in the garden will change immediately.",
        title: "Choose a tombstone",
        subtitle: "Click a style on the left. The center stone will change.",
        confirmBtn: "Use this tombstone",
        roundedName: "Rounded top",
        roundedDesc: "Gentle and classic.",
        squareName: "Soft square",
        squareDesc: "Simple and quiet.",
        heartName: "Heart style",
        heartDesc: "Warm and soft.",
        archName: "Tall arch",
        archDesc: "Calm and solemn.",
        smallName: "Small pet stone",
        smallDesc: "Tiny and gentle."
      },

      zh: {
        logo: "星眠宠物纪念园",

        squareName: "方角墓碑",

        archName: "高拱墓碑",
        archDesc: "安静、庄重。",
        smallName: "小型宠物墓碑",
        smallDesc: "小巧、轻柔。"
      },

      "zh-TW": {
        logo: "星眠寵物紀念園",
        backBtn: "返回修改",
        panelTitle: "墓碑樣式",
        panelSubtitle: "選擇一種樣式，中間的墓碑會立刻變化。",
        title: "選擇墓碑",
        subtitle: "點擊左側樣式，中間墓碑會跟著變化。",
        confirmBtn: "使用這個墓碑",
        roundedName: "圓頂墓碑",
        roundedDesc: "溫柔、經典。",
        squareName: "方角墓碑",
        squareDesc: "簡潔、安靜。",
        heartName: "愛心墓碑",
        heartDesc: "溫暖、柔和。",
        archName: "高拱墓碑",
        archDesc: "安靜、莊重。",
        smallName: "小型寵物墓碑",
        smallDesc: "小巧、輕柔。"
      },

      ja: {
        logo: "星眠ペット記念園",
        backBtn: "戻って編集",
        panelTitle: "墓碑スタイル",
        panelSubtitle: "スタイルを選ぶと、中央の墓碑がすぐに変わります。",
        title: "墓碑を選ぶ",
        subtitle: "左のスタイルをクリックすると、中央の墓碑が変わります。",
        confirmBtn: "この墓碑を使う",
        roundedName: "丸い墓碑",
        roundedDesc: "やさしく定番。",
        squareName: "角丸墓碑",
        squareDesc: "シンプルで静か。",
        heartName: "ハート型",
        heartDesc: "温かくやわらかい。",
        archName: "高いアーチ型",
        archDesc: "静かで厳か。",
        smallName: "小さな墓碑",
        smallDesc: "小さくやさしい。"
      },

      ko: {
        logo: "별잠 반려동물 추모정원",
        backBtn: "수정으로 돌아가기",
        panelTitle: "묘비 스타일",
        panelSubtitle: "스타일을 선택하면 가운데 묘비가 바로 바뀝니다.",
        title: "묘비 선택",
        subtitle: "왼쪽 스타일을 클릭하면 가운데 묘비가 바뀝니다.",
        confirmBtn: "이 묘비 사용",
        roundedName: "둥근 묘비",
        roundedDesc: "부드럽고 클래식.",
        squareName: "부드러운 사각형",
        squareDesc: "단순하고 조용함.",
        heartName: "하트 스타일",
        heartDesc: "따뜻하고 부드러움.",
        archName: "높은 아치형",
        archDesc: "차분하고 엄숙함.",
        smallName: "작은 묘비",
        smallDesc: "작고 다정함."
      }
    };

    function changeLanguage(lang) {
      const data = translations[lang] || translations.en;

      localStorage.setItem("siteLanguage", lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      document.querySelectorAll("[data-key]").forEach(function(item) {
        const key = item.getAttribute("data-key");
        if (data[key]) item.textContent = data[key];
      });
    }

    function loadLanguage() {
      const savedLanguage = localStorage.getItem("siteLanguage") || "en";
      changeLanguage(savedLanguage);
    }

    function loadMemorialPreview() {
      const data = JSON.parse(localStorage.getItem("myPetMemorial") || "{}");

      const stoneName = document.getElementById("stoneName");
      const stoneYears = document.getElementById("stoneYears");
      const stoneWords = document.getElementById("stoneWords");
      const stonePhoto = document.getElementById("stonePhoto");

      if (stoneName) stoneName.textContent = data.name || "Luna";

      if (stoneYears) {
        stoneYears.textContent =
          (data.birthDate || "----") + " — " + (data.leaveDate || "----");
      }

      if (stoneWords) {
        stoneWords.textContent = data.epitaph || data.memory || "You are loved, always.";
      }

      if (stonePhoto) {
        if (data.photo) {
          stonePhoto.innerHTML = '<img src="' + data.photo + '">';
        } else {
          stonePhoto.textContent = "🐾";
        }
      }

      if (data.tombstoneStyle) {
        selectedStoneStyle = data.tombstoneStyle;
        applyStoneStyle(selectedStoneStyle);

        const activeButton = document.querySelector('[data-style="' + selectedStoneStyle + '"]');

        if (activeButton) {
          document.querySelectorAll(".stone-option").forEach(function(btn) {
            btn.classList.remove("active");
          });

          activeButton.classList.add("active");
        }
      }
    }

    function applyStoneStyle(style) {
      const centerStone = document.getElementById("centerStone");
      if (!centerStone) return;
      centerStone.className = "center-stone " + style;
    }

    function selectStone(style, button) {
      const wrap = document.getElementById("centerStoneWrap");
      selectedStoneStyle = style;

      document.querySelectorAll(".stone-option").forEach(function(btn) {
        btn.classList.remove("active");
      });

      if (button) button.classList.add("active");

      if (wrap) {
        wrap.classList.add("changing");

        setTimeout(function() {
          applyStoneStyle(style);
          wrap.classList.remove("changing");
        }, 150);
      } else {
        applyStoneStyle(style);
      }
    }

    function confirmStone() {
      const data = JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
      data.tombstoneStyle = selectedStoneStyle;
      localStorage.setItem("myPetMemorial", JSON.stringify(data));

      document.body.classList.add("planting");

      setTimeout(function() {
        window.location.replace("cemetery.html");
      }, 1400);
    }

    window.addEventListener("load", function() {
      loadLanguage();
      loadMemorialPreview();
    });
  </script>

</body>
</html>
