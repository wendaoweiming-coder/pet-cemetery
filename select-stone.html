<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>选择墓碑</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #10140f;
      color: #fffaf5;
    }

    button, a, select, textarea {
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(6, 10, 18, 0.05) 0%,
          rgba(6, 10, 18, 0.12) 46%,
          rgba(6, 10, 18, 0.30) 100%
        ),
        url("cemetery-bg.png") center center / cover no-repeat;
      transform: scale(1.08);
      transform-origin: center center;
      z-index: 0;
    }

    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center 61%, rgba(255, 231, 190, 0.08), transparent 22%),
        radial-gradient(circle at center 64%, rgba(255, 255, 255, 0.04), transparent 34%);
      pointer-events: none;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      position: relative;
      z-index: 30;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 30px 34px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: rgba(255, 250, 245, 0.96);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.36);
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .soft-button,
    .language-select,
    .bottom-button {
      border: 1px solid rgba(255, 250, 245, 0.30);
      background: rgba(255, 250, 245, 0.08);
      color: #fffaf5;
      padding: 10px 16px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .soft-button:hover,
    .language-select:hover,
    .bottom-button:hover {
      background: rgba(255, 250, 245, 0.16);
      border-color: rgba(255, 250, 245, 0.42);
    }

    .language-select {
      min-width: 146px;
    }

    .language-select option {
      color: #2d2520;
      background: #fffaf5;
    }

    .main-layout {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 270px 1fr 270px;
      gap: 24px;
      align-items: center;
      padding: 20px 34px 116px;
    }

    .left-panel {
      position: relative;
      z-index: 20;
      align-self: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 23px;
      font-weight: 500;
      color: rgba(255, 250, 245, 0.95);
      text-shadow: 0 3px 16px rgba(0,0,0,0.34);
    }

    .panel-subtitle {
      margin: 0 0 20px;
      color: rgba(255, 244, 232, 0.68);
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }

    .stone-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stone-option {
      width: 100%;
      border: none;
      padding: 0;
      background: transparent;
      color: #fffaf5;
      cursor: pointer;
      text-align: left;
    }

    .stone-option-inner {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 13px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255, 250, 245, 0.13);
      background: rgba(255, 250, 245, 0.055);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: 0.22s ease;
    }

    .stone-option:hover .stone-option-inner {
      background: rgba(255, 250, 245, 0.11);
      border-color: rgba(255, 250, 245, 0.28);
      transform: translateX(5px);
    }

    .stone-option.active .stone-option-inner {
      background: rgba(255, 250, 245, 0.17);
      border-color: rgba(255, 250, 245, 0.48);
    }

    .mini-stone {
      width: 70px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 70%);
      font-size: 34px;
      color: rgba(255,250,245,0.62);
    }

    .option-name {
      margin: 0 0 4px;
      font-size: 14px;
      color: rgba(255, 250, 245, 0.93);
    }

    .option-desc {
      margin: 0;
      color: rgba(255, 244, 232, 0.58);
      font-size: 12px;
      line-height: 1.5;
    }

    .confirm-button {
      width: 100%;
      margin-top: 22px;
      border: 1px solid rgba(255, 250, 245, 0.52);
      background: rgba(255, 250, 245, 0.88);
      color: #4b3d35;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      transition: 0.22s ease;
    }

    .confirm-button:hover {
      background: rgba(255, 250, 245, 0.96);
      transform: translateY(-1px);
    }

    .center-area {
      position: relative;
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .instruction {
      position: absolute;
      top: 12px;
      left: 50%;
      width: min(720px, 90%);
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 3px 18px rgba(0,0,0,0.36);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .instruction h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      color: rgba(255, 248, 239, 0.96);
    }

    .instruction p {
      margin: 0;
      color: rgba(255, 244, 232, 0.72);
      font-size: 14px;
      line-height: 1.7;
    }

    .scene-wrap {
      position: relative;
      width: min(500px, 54vw);
      height: min(580px, 68vh);
      min-width: 320px;
      min-height: 430px;
      margin-top: 42px;
      transition:
        width 1.25s cubic-bezier(0.22, 0.82, 0.22, 1),
        height 1.25s cubic-bezier(0.22, 0.82, 0.22, 1),
        transform 1.25s cubic-bezier(0.22, 0.82, 0.22, 1);
    }

    #mainStoneScene {
      position: absolute;
      inset: 0;
      border-radius: 26px;
    }

    .model-loading {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      color: rgba(255,250,245,0.72);
      font-size: 14px;
      text-shadow: 0 3px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .right-spacer {
      min-height: 1px;
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(24px);
      z-index: 40;
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 999px;
      background: rgba(20, 22, 20, 0.36);
      border: 1px solid rgba(255, 250, 245, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    body.memorial-mode .bottom-dock {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    body.planting .top-bar .soft-button:first-child,
    body.memorial-mode .top-bar .soft-button:first-child {
      display: none;
    }

    body.planting .left-panel,
    body.memorial-mode .left-panel {
      opacity: 0;
      transform: translateX(-20px);
      pointer-events: none;
    }

    body.planting .instruction,
    body.memorial-mode .instruction {
      opacity: 0;
      transform: translateX(-50%) translateY(-12px);
    }

    body.planting .scene-wrap,
    body.memorial-mode .scene-wrap {
      width: min(350px, 43vw);
      height: min(445px, 55vh);
      transform: translate(-72px, 4px);
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background: rgba(5, 7, 8, 0.64);
    }

    .modal-layer.show { display: flex; }

    .modal-card {
      position: relative;
      width: min(760px, 92vw);
      max-height: 82vh;
      overflow-y: auto;
      padding: 30px;
      border-radius: 30px;
      background: rgba(255, 250, 245, 0.95);
      color: #4b3d35;
      box-shadow: 0 26px 80px rgba(0,0,0,0.45);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(75, 61, 53, 0.10);
      color: #4b3d35;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-card h2 {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 500;
      color: #4b3d35;
    }

    .modal-card p {
      margin: 0;
      line-height: 1.8;
      color: rgba(75, 61, 53, 0.75);
      font-size: 15px;
    }

    .photo-block { margin-bottom: 26px; }

    .photo-block h3 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 500;
      color: #4b3d35;
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .gallery-photo {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(120, 95, 70, 0.08);
      border: 1px solid rgba(134, 103, 75, 0.16);
      cursor: zoom-in;
    }

    .gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty-text {
      color: rgba(75, 61, 53, 0.46);
      font-size: 14px;
    }

    .gift-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gift-buttons button,
    .message-box button {
      border: none;
      background: #715843;
      color: #fffaf5;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .animal-status {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 18px;
      background: rgba(118, 91, 66, 0.08);
      color: rgba(75, 61, 53, 0.66);
      font-size: 13px;
      line-height: 1.6;
    }

    .placed-items {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 28px;
    }

    .placed-item-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(113, 88, 67, 0.10);
      color: rgba(75, 61, 53, 0.72);
      font-size: 13px;
    }

    .message-box textarea {
      width: 100%;
      height: 108px;
      border: 1px solid rgba(134, 103, 75, 0.22);
      background: rgba(255,255,255,0.72);
      color: #4b3d35;
      padding: 14px;
      border-radius: 18px;
      font-size: 14px;
      resize: none;
    }

    .message-list { margin-top: 14px; }

    .message-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(134, 103, 75, 0.14);
      color: rgba(75, 61, 53, 0.72);
      line-height: 1.6;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="page-bg"></div>

  <div class="page-shell">
    <header class="top-bar">
      <a href="index.html" class="logo" data-key="logo">星眠宠物纪念园</a>

      <div class="top-actions">
        <a href="create.html" class="soft-button" data-key="backBtn">返回修改</a>
        <button class="soft-button" onclick="editStoneAgain()" data-key="changeStoneBtn">更换墓碑</button>

        <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>
    </header>

    <main class="main-layout">
      <aside class="left-panel">
        <h2 class="panel-title" data-key="panelTitle">墓碑样式</h2>
        <p class="panel-subtitle" data-key="panelSubtitle">选择一个墓碑，中间预览会立刻变化。</p>

        <div class="stone-list">
          <button class="stone-option active" data-style="rounded" onclick="selectStone('rounded', this)">
            <div class="stone-option-inner">
              <div class="mini-stone">▰</div>
              <div>
                <p class="option-name" data-key="roundedName">圆顶墓碑</p>
                <p class="option-desc" data-key="roundedDesc">经典、温柔。</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="square" onclick="selectStone('square', this)">
            <div class="stone-option-inner">
              <div class="mini-stone">▰</div>
              <div>
                <p class="option-name" data-key="squareName">方角墓碑</p>
                <p class="option-desc" data-key="squareDesc">干净、安静。</p>
              </div>
            </div>
          </button>

          <button class="stone-option" data-style="arch" onclick="selectStone('arch', this)">
            <div class="stone-option-inner">
              <div class="mini-stone">▰</div>
              <div>
                <p class="option-name" data-key="archName">高拱墓碑</p>
                <p class="option-desc" data-key="archDesc">平静、庄重。</p>
              </div>
            </div>
          </button>
        </div>

        <button class="confirm-button" onclick="confirmStone()" data-key="confirmBtn">使用这个墓碑</button>
      </aside>

      <section class="center-area">
        <div class="instruction">
          <h1 data-key="title">选择墓碑</h1>
          <p data-key="subtitle">墓碑会慢慢转正，并安静地落到纪念园中。</p>
        </div>

        <div class="scene-wrap">
          <div id="mainStoneScene"></div>
          <div id="modelLoading" class="model-loading">正在加载墓碑模型...</div>
        </div>
      </section>

      <div class="right-spacer"></div>
    </main>
  </div>

  <div class="bottom-dock">
    <button class="bottom-button" onclick="openPanel('storyPanel')" data-key="storyBtn">故事</button>
    <button class="bottom-button" onclick="openPanel('photosPanel')" data-key="photosBtn">相册</button>
    <button class="bottom-button" onclick="openPanel('giftPanel')" data-key="giftBtn">礼物</button>
    <button class="bottom-button" onclick="openPanel('messagePanel')" data-key="messageBtnShort">留言</button>
  </div>

  <div class="modal-layer" id="storyPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="storyTitle">宠物故事</h2>
      <p id="petStoryDisplay" class="empty-text">还没有写下故事。</p>
    </div>
  </div>

  <div class="modal-layer" id="photosPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="photosTitle">回忆相册</h2>
      <div class="photo-block">
        <h3 data-key="publicPhotosTitle">公开回忆照片</h3>
        <div id="publicPhotosDisplay" class="photo-gallery"></div>
      </div>
      <div class="photo-block">
        <h3 data-key="privatePhotosTitle">私密回忆照片</h3>
        <p class="empty-text" style="margin-bottom:12px;" data-key="privatePhotosDesc">这些照片目前只会显示在你的浏览器演示中。</p>
        <div id="privatePhotosDisplay" class="photo-gallery"></div>
      </div>
    </div>
  </div>

  <div class="modal-layer" id="giftPanel" onclick="closePanels(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="giftTitle">放置一个小礼物</h2>
      <div class="gift-buttons">
        <button onclick="placeGift('can')" data-key="giftCan">放一个罐头</button>
        <button onclick="placeGift('ball')" data-key="giftBall">放一个球</button>
        <button onclick="placeGift('seed')" data-key="giftSeed">放一些鸟食</button>
        <button onclick="placeGift('flower')" data-key="giftFlower">放一些花</button>
      </div>
      <div class="animal-status" data-key="animalStatus">安静的小礼物，可能会吸引温柔的访客。</div>
      <div class="placed-items" id="placedItemsList"></div>
    </div>
  </div>

  <div class="modal-layer" id="messagePanel" onclick="closePanels(event)">
    <div class="modal-card message-box">
      <button class="modal-close" onclick="closeAllPanels()">×</button>
      <h2 data-key="messageTitle">留言</h2>
      <textarea id="messageInput" data-placeholder-key="messagePlaceholder" placeholder="写几句安静的话..."></textarea>
      <br><br>
      <button onclick="addMessage()" data-key="messageSendBtn">留下留言</button>
      <div id="messageList" class="message-list"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    function getText() {
      return translations[currentLang] || translations.zh;
    }

    function getMemorialData() {
      return JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
    }

    function saveMemorialData(data) {
      localStorage.setItem("myPetMemorial", JSON.stringify(data));
    }

    function changeLanguage(lang) {
      currentLang = translations[lang] ? lang : "zh";
      localStorage.setItem("siteLanguage", currentLang);

      const select = document.getElementById("languageSelect");
      if (select) select.value = currentLang;

      const text = getText();

      document.querySelectorAll("[data-key]").forEach(function(el) {
        const key = el.getAttribute("data-key");
        if (text[key]) el.textContent = text[key];
      });

      document.querySelectorAll("[data-placeholder-key]").forEach(function(el) {
        const key = el.getAttribute("data-placeholder-key");
        if (text[key]) el.placeholder = text[key];
      });

      updateStoneText();
      loadExtraMemorialInfo();
      renderPlacedItems();
    }

    function initScene() {
      const container = document.getElementById("mainStoneScene");

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        32,
        container.clientWidth / container.clientHeight,
        0.1,
        100
      );
      camera.position.set(0, 0.32, 7.6);

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.92;

      container.innerHTML = "";
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xc9c9bd, 0.75));

      const moonLight = new THREE.DirectionalLight(0xcbd9ff, 1.65);
      moonLight.position.set(-4.6, 6.6, 5.2);
      scene.add(moonLight);

      const warmLamp = new THREE.PointLight(0xffbd76, 1.15, 16, 2);
      warmLamp.position.set(-3.8, -1.4, 4.2);
      scene.add(warmLamp);

      const rightFill = new THREE.PointLight(0xffd2a0, 0.36, 16, 2);
      rightFill.position.set(3.0, -0.9, 4.0);
      scene.add(rightFill);

      const blueFill = new THREE.PointLight(0x8fa8da, 0.22, 18, 2);
      blueFill.position.set(2.5, 2.2, 5.0);
      scene.add(blueFill);

      createGroundShadow();
      loadTombstoneModel();

      window.addEventListener("resize", resizeScene);
      animate();
    }

    function createGroundShadow() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      const g = ctx.createRadialGradient(256, 256, 10, 256, 256, 220);
      g.addColorStop(0, "rgba(0,0,0,0.42)");
      g.addColorStop(0.42, "rgba(0,0,0,0.22)");
      g.addColorStop(0.75, "rgba(0,0,0,0.07)");
      g.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);

      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        opacity: 0.82
      });

      shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 1.25), mat);
      shadowPlane.position.set(0, -1.72, -0.48);
      scene.add(shadowPlane);
    }

    function loadTombstoneModel() {
      const loading = document.getElementById("modelLoading");
      const loader = new THREE.GLTFLoader();

      loader.load(
        MODEL_PATH,
        function(gltf) {
          stoneRoot = new THREE.Group();

          const model = gltf.scene;

          model.traverse(function(child) {
            if (child.isMesh) {
              child.castShadow = false;
              child.receiveShadow = false;

              if (child.material) {
                child.material.roughness = 0.94;
                child.material.metalness = 0;
                child.material.needsUpdate = true;
              }
            }
          });

          normalizeModel(model);

          stoneRoot.add(model);
          stoneRoot.scale.setScalar(PREVIEW_SCALE);
          stoneRoot.position.set(0, PREVIEW_Y, 0);
          stoneRoot.rotation.y = PREVIEW_ANGLE;

          scene.add(stoneRoot);

          addStoneText();
          applySavedState();

          if (loading) loading.style.display = "none";
        },
        function(xhr) {
          if (loading && xhr.total) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            loading.textContent = "正在加载墓碑模型..." + percent + "%";
          }
        },
        function(error) {
          console.error(error);
          if (loading) {
            loading.textContent = "模型加载失败，请检查 assets/models/tombstone.glb";
          }
        }
      );
    }

    function normalizeModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      model.position.x -= center.x;
      model.position.y -= center.y;
      model.position.z -= center.z;

      const maxSide = Math.max(size.x, size.y, size.z);
      const target = 2.35;
      const scale = target / maxSide;

      model.scale.setScalar(scale);

      const newBox = new THREE.Box3().setFromObject(model);
      model.position.y -= newBox.min.y;
      model.position.y -= 1.72;
    }

    function addStoneText() {
      if (!stoneRoot) return;

      const texture = createTextTexture();
      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        opacity: 0.66
      });

      textPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 1.80), mat);
      textPlane.position.set(0, -0.15, 0.72);
      stoneRoot.add(textPlane);
    }

    function updateStoneText() {
      if (!textPlane || !textPlane.material) return;

      if (textPlane.material.map) {
        textPlane.material.map.dispose();
      }

      textPlane.material.map = createTextTexture();
      textPlane.material.needsUpdate = true;
    }

    function createTextTexture() {
      const memorial = getMemorialData();
      const text = getText();

      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 1024, 1024);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = "rgba(20, 17, 15, 0.18)";
      ctx.font = "600 42px Arial";
      ctx.fillText("🐾", 512, 180);

      ctx.fillStyle = "rgba(18, 15, 13, 0.46)";
      ctx.font = "500 72px 'Microsoft YaHei', Arial";
      ctx.fillText(memorial.name || text.defaultName, 512, 408);

      ctx.fillStyle = "rgba(18, 15, 13, 0.34)";
      ctx.font = "400 32px 'Microsoft YaHei', Arial";
      const birth = memorial.birthDate || "----";
      const leave = memorial.leaveDate || "----";
      ctx.fillText(birth + " — " + leave, 512, 510);

      ctx.fillStyle = "rgba(18, 15, 13, 0.28)";
      ctx.font = "italic 30px 'Microsoft YaHei', Arial";
      drawWrappedText(ctx, memorial.epitaph || memorial.memory || text.defaultWords, 512, 635, 500, 42, 3);

      const texture = new THREE.CanvasTexture(canvas);
      texture.encoding = THREE.sRGBEncoding;
      texture.needsUpdate = true;
      return texture;
    }

    function drawWrappedText(ctx, value, x, y, maxWidth, lineHeight, maxLines) {
      const chars = String(value || "").split("");
      const lines = [];
      let current = "";

      for (let i = 0; i < chars.length; i++) {
        const test = current + chars[i];
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = chars[i];
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);

      const finalLines = lines.slice(0, maxLines);
      finalLines.forEach(function(line, index) {
        ctx.fillText(line, x, y + index * lineHeight);
      });
    }

    function resizeScene() {
      const container = document.getElementById("mainStoneScene");
      if (!container || !renderer || !camera) return;

      renderer.setSize(container.clientWidth, container.clientHeight);
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    function selectStone(style, button) {
      if (isPlanting) return;

      selectedStoneStyle = style;

      const data = getMemorialData();
      data.tombstoneStyle = selectedStoneStyle;
      data.tombstoneConfirmed = false;
      saveMemorialData(data);

      document.body.classList.remove("memorial-mode");

      document.querySelectorAll(".stone-option").forEach(function(btn) {
        btn.classList.remove("active");
      });

      if (button) button.classList.add("active");

      if (stoneRoot) {
        stoneRoot.scale.setScalar(PREVIEW_SCALE);
        stoneRoot.position.y = PREVIEW_Y;
        stoneRoot.rotation.y = PREVIEW_ANGLE;
      }
    }

    function applySavedState() {
      const data = getMemorialData();

      if (data.tombstoneConfirmed === true) {
        document.body.classList.add("memorial-mode");

        if (stoneRoot) {
          stoneRoot.scale.setScalar(FINAL_SCALE);
          stoneRoot.position.y = FINAL_Y;
          stoneRoot.rotation.y = FINAL_ANGLE;
        }
      }
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function confirmStone() {
      if (isPlanting || !stoneRoot) return;

      isPlanting = true;

      const data = getMemorialData();
      data.tombstoneStyle = selectedStoneStyle;
      data.tombstoneConfirmed = true;
      saveMemorialData(data);

      document.body.classList.add("planting");

      const start = performance.now();
      const duration = 1300;

      function frame(now) {
        const raw = Math.min((now - start) / duration, 1);
        const t = easeOutCubic(raw);

        const scale = PREVIEW_SCALE + (FINAL_SCALE - PREVIEW_SCALE) * t;
        const y = PREVIEW_Y + (FINAL_Y - PREVIEW_Y) * t;
        const angle = PREVIEW_ANGLE + (FINAL_ANGLE - PREVIEW_ANGLE) * t;

        stoneRoot.scale.setScalar(scale);
        stoneRoot.position.y = y;
        stoneRoot.rotation.y = angle;

        if (raw < 1) {
          requestAnimationFrame(frame);
        } else {
          document.body.classList.remove("planting");
          document.body.classList.add("memorial-mode");
          isPlanting = false;
          loadExtraMemorialInfo();
          renderPlacedItems();
        }
      }

      requestAnimationFrame(frame);
    }

    function editStoneAgain() {
      if (isPlanting) return;

      const data = getMemorialData();
      data.tombstoneConfirmed = false;
      saveMemorialData(data);

      document.body.classList.remove("memorial-mode", "planting");

      if (stoneRoot) {
        stoneRoot.scale.setScalar(PREVIEW_SCALE);
        stoneRoot.position.y = PREVIEW_Y;
        stoneRoot.rotation.y = PREVIEW_ANGLE;
      }
    }

    function openPanel(id) {
      closeAllPanels();
      const panel = document.getElementById(id);
      if (panel) panel.classList.add("show");
    }

    function closeAllPanels() {
      document.querySelectorAll(".modal-layer").forEach(function(panel) {
        panel.classList.remove("show");
      });
    }

    function closePanels(event) {
      if (event.target.classList.contains("modal-layer")) {
        closeAllPanels();
      }
    }

    function showPhotos(containerId, photos) {
      const container = document.getElementById(containerId);
      const text = getText();
      if (!container) return;

      container.innerHTML = "";

      if (!photos || photos.length === 0) {
        container.innerHTML = '<p class="empty-text">' + text.noPhotos + '</p>';
        return;
      }

      photos.forEach(function(photo) {
        const box = document.createElement("div");
        box.className = "gallery-photo";

        const img = document.createElement("img");
        img.src = photo;

        box.appendChild(img);
        container.appendChild(box);
      });
    }

    function loadExtraMemorialInfo() {
      const data = getMemorialData();
      const text = getText();

      const storyDisplay = document.getElementById("petStoryDisplay");

      if (storyDisplay) {
        if (data.story) {
          storyDisplay.textContent = data.story;
          storyDisplay.classList.remove("empty-text");
        } else {
          storyDisplay.textContent = text.noStory;
          storyDisplay.classList.add("empty-text");
        }
      }

      const publicPhotos = data.publicPhotos && data.publicPhotos.length ? data.publicPhotos : (data.photo ? [data.photo] : []);
      const privatePhotos = data.privatePhotos || [];

      showPhotos("publicPhotosDisplay", publicPhotos);
      showPhotos("privatePhotosDisplay", privatePhotos);

      renderMessages();
    }

    function getMessages() {
      return JSON.parse(localStorage.getItem("memorialMessages") || "[]");
    }

    function renderMessages() {
      const list = document.getElementById("messageList");
      const text = getText();
      if (!list) return;

      const messages = getMessages();
      list.innerHTML = "";

      if (!messages.length) {
        list.innerHTML = '<div class="message-item empty-text">' + text.noMessages + '</div>';
        return;
      }

      messages.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "message-item";
        div.textContent = item;
        list.appendChild(div);
      });
    }

    function addMessage() {
      const input = document.getElementById("messageInput");
      if (!input) return;

      const value = input.value.trim();
      if (!value) return;

      const messages = getMessages();
      messages.unshift(value);
      localStorage.setItem("memorialMessages", JSON.stringify(messages.slice(0, 20)));

      input.value = "";
      renderMessages();
    }

    function getPlacedItems() {
      return JSON.parse(localStorage.getItem("memorialPlacedItems") || "[]");
    }

    function renderPlacedItems() {
      const box = document.getElementById("placedItemsList");
      const text = getText();
      if (!box) return;

      const items = getPlacedItems();
      box.innerHTML = "";

      items.forEach(function(item) {
        const div = document.createElement("div");
        div.className = "placed-item-badge";

        if (item === "can") div.textContent = "🥫 " + text.placedCan;
        if (item === "ball") div.textContent = "🎾 " + text.placedBall;
        if (item === "seed") div.textContent = "🌾 " + text.placedSeed;
        if (item === "flower") div.textContent = "🌸 " + text.placedFlower;

        box.appendChild(div);
      });
    }

    function placeGift(type) {
      const items = getPlacedItems();
      items.unshift(type);
      localStorage.setItem("memorialPlacedItems", JSON.stringify(items.slice(0, 8)));
      renderPlacedItems();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeAllPanels();
      }
    });

    window.addEventListener("DOMContentLoaded", function() {
      const savedLanguage = localStorage.getItem("siteLanguage") || "zh";
      changeLanguage(savedLanguage);

      initScene();
      loadExtraMemorialInfo();
      renderPlacedItems();
    });
  </script>
