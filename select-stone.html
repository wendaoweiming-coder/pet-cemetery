<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择墓碑 - 星眠宠物纪念园</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #fffaf5;
      background: #07111d;
    }
    body {
      background:
        linear-gradient(180deg, rgba(5, 10, 18, 0.06) 0%, rgba(5, 10, 18, 0.24) 48%, rgba(5, 10, 18, 0.48) 100%),
        url("cemetery-bg.png") center center / cover no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center 63%, rgba(255, 220, 155, 0.10), transparent 24%),
        radial-gradient(circle at 50% 12%, rgba(170, 196, 232, 0.13), transparent 28%);
      pointer-events: none;
      z-index: 0;
    }
    button, select { font-family: inherit; }
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 30px 42px;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 3px 16px rgba(0,0,0,0.38);
    }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .glass-btn, .glass-select {
      height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(18, 22, 28, 0.38);
      color: rgba(255,255,255,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 12px 30px rgba(0,0,0,0.22);
      transition: 0.25s ease;
      font-size: 16px;
    }
    .glass-btn { padding: 0 20px; cursor: pointer; }
    .glass-select { min-width: 146px; padding: 0 18px; cursor: pointer; outline: none; }
    .glass-select option { color: #2d2925; background: #fffaf5; }
    .glass-btn:hover, .glass-select:hover {
      background: rgba(28, 32, 40, 0.48);
      border-color: rgba(255,255,255,0.32);
      transform: translateY(-1px);
    }
    .main {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 34px;
      align-items: center;
      min-height: 0;
    }
    .left-panel {
      position: relative;
      z-index: 6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding-left: 6px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .left-title {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 700;
      text-shadow: 0 3px 16px rgba(0,0,0,0.34);
    }
    .left-desc {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255,255,255,0.84);
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }
    .stone-option {
      width: 100%;
      min-height: 138px;
      padding: 18px 20px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.20);
      background: linear-gradient(180deg, rgba(17,23,30,0.30), rgba(17,23,30,0.20));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 14px 36px rgba(0,0,0,0.20);
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .stone-icon {
      width: 76px;
      height: 90px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stone-icon svg { width: 66px; height: 80px; display: block; }
    .stone-name { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.95); }
    .stone-subtitle { margin-top: 8px; font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.74); }
    .confirm-btn {
      margin-top: 8px;
      width: 100%;
      height: 68px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(246, 241, 235, 0.92);
      color: #5a5147;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 16px 32px rgba(0,0,0,0.20);
      transition: 0.25s ease;
    }
    .confirm-btn:hover { transform: translateY(-1px); background: rgba(250, 246, 241, 0.96); }
    .confirm-btn:disabled { opacity: 0.58; cursor: wait; transform: none; }
    .viewer-area {
      position: relative;
      z-index: 2;
      height: 100%;
      min-height: 690px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 1.25s cubic-bezier(0.22, 0.82, 0.22, 1);
    }
    .center-title {
      position: absolute;
      top: 24px;
      left: 50%;
      width: min(90%, 680px);
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .center-title h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 54px);
      line-height: 1.15;
      font-weight: 700;
      color: rgba(255,255,255,0.97);
      text-shadow: 0 4px 18px rgba(0,0,0,0.34);
    }
    .center-title p {
      margin: 14px auto 0;
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255,255,255,0.86);
      text-shadow: 0 2px 12px rgba(0,0,0,0.24);
    }
    .viewer-wrap {
      position: relative;
      width: min(100%, 920px);
      height: min(72vh, 760px);
      min-height: 540px;
    }
    .viewer-wrap::after {
      /* v13：关闭旧的前景遮挡层。它会把 GLB 底座“吃掉”，看起来像模型不完整。 */
      content: none;
    }
    #stoneCanvas { position: relative; z-index: 1; width: 100%; height: 100%; display: block; border-radius: 24px; background: transparent; }
    .status-text {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      z-index: 5;
      max-width: 92%;
      font-size: 18px;
      line-height: 1.8;
      color: rgba(255,255,255,0.92);
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.30);
      pointer-events: none;
    }
    .error-text { color: #ffd6d6; }
    body.planting .left-panel {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-18px);
    }
    body.planting .center-title {
      opacity: 0;
      transform: translateX(-50%) translateY(-12px);
    }
    @media (max-width: 1100px) {
      html, body { overflow-y: auto; }
      .page { min-height: 100vh; height: auto; padding: 20px 18px 28px; }
      .main { grid-template-columns: 1fr; gap: 20px; }
      .left-panel { order: 2; padding-left: 0; }
      .viewer-area { order: 1; min-height: 62vh; }
      .viewer-wrap { height: min(60vh, 560px); min-height: 430px; }
      .center-title { top: 8px; }
    }
    @media (max-width: 720px) {
      .topbar { flex-direction: column; align-items: stretch; gap: 12px; }
      .top-actions { justify-content: space-between; }
      .glass-btn, .glass-select { height: 44px; font-size: 15px; }
      .brand { font-size: 16px; }
      .left-title { font-size: 22px; }
      .stone-option { min-height: 124px; border-radius: 22px; padding: 16px; }
      .confirm-btn { height: 60px; font-size: 17px; }
      .center-title h1 { font-size: 34px; }
      .center-title p { font-size: 14px; }
      .viewer-wrap { height: 54vh; min-height: 380px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" id="brandText">星眠宠物纪念园</div>
      <div class="top-actions">
        <button class="glass-btn" id="backBtn">返回修改</button>
        <select id="languageSelect" class="glass-select" aria-label="language">
          <option value="zh">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </header>
    <section class="main">
      <aside class="left-panel">
        <div>
          <h2 class="left-title" id="leftTitle">墓碑样式</h2>
          <p class="left-desc" id="leftDesc">选择一个墓碑，中间预览会立刻变化。</p>
        </div>
        <div class="stone-option active" id="roundedOption">
          <div class="stone-icon">
            <svg viewBox="0 0 90 110" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="stoneThumbGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#d9d4cc"/>
                  <stop offset="55%" stop-color="#bdb6ab"/>
                  <stop offset="100%" stop-color="#8c867d"/>
                </linearGradient>
              </defs>
              <path d="M18 96H72V84H18V96Z" fill="url(#stoneThumbGrad)" opacity="0.95"/>
              <path d="M24 83H66V30C66 18.9543 57.0457 10 46 10H44C32.9543 10 24 18.9543 24 30V83Z" fill="url(#stoneThumbGrad)"/>
              <path d="M24 83H66" stroke="#7E786F" stroke-width="1.6" opacity="0.45"/>
            </svg>
          </div>
          <div class="stone-meta">
            <div class="stone-name" id="optionName">圆顶墓碑</div>
            <div class="stone-subtitle" id="optionDesc">真实石材圆顶墓碑。</div>
          </div>
        </div>
        <button class="confirm-btn" id="useStoneBtn" disabled>模型加载中...</button>
      </aside>
      <div class="viewer-area">
        <div class="center-title">
          <h1 id="mainTitle">选择墓碑</h1>
          <p id="mainDesc">墓碑会慢慢转正，并安静地落到纪念园中。</p>
        </div>
        <div class="viewer-wrap">
          <canvas id="stoneCanvas"></canvas>
          <div class="status-text" id="statusText">正在加载墓碑模型...</div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const MODEL_URL = "assets/models/tombstone-real.glb?v=13";

    const MODEL_VIEW_CONFIG = {
      // v13：只校准 GLB 模型的展示位置，不再改页面布局。
      // targetHeight 控制模型自身大小；previewX/previewY 控制模型在画面中的位置。
      targetHeight: 4.42,
      modelBottomY: -1.96,

      // 按用户红线：整体往左收，保持当前大小，角度沿用已认可方向。
      previewX: -1.72,
      previewY: 0.16,
      previewZ: 0,
      previewScale: 0.94,
      previewRotYDeg: -16,

      // 确认后的落位同步向左，避免动画结束又偏回去。
      finalX: -0.72,
      finalY: -0.90,
      finalZ: -0.08,
      finalScale: 0.56,
      finalRotYDeg: 0,

      cameraX: 0,
      cameraY: 1.24,
      cameraZ: 9.8,
      shadowY: -1.92
    };

    const ENGRAVING_CONFIG = {
      // v13：刻字层不再跑到墓碑外，改为较小的正面刻字区。
      planeWidth: 0.76,
      planeHeight: 0.98,
      planeX: -0.04,
      planeY: -0.20,
      planeZ: 0.108,
      opacity: 0.88,
      canvasWidth: 1400,
      canvasHeight: 1400,
      nameFontSize: 136,
      dateFontSize: 54,
      epitaphFontSize: 58,
      lineGap: 20,
      maxEpitaphLines: 3,
      textColor: "rgba(28, 32, 35, 0.76)",
      darkShadow: "rgba(4, 5, 6, 0.22)",
      softHighlight: "rgba(245, 248, 246, 0.060)",
      wearAmount: 0.008
    };

    const I18N = {
      zh: {
        brand: "星眠宠物纪念园", back: "返回修改", leftTitle: "墓碑样式",
        leftDesc: "选择一个墓碑，中间预览会立刻变化。", mainTitle: "选择墓碑",
        mainDesc: "墓碑会慢慢转正，并安静地落到纪念园中。", optionName: "圆顶墓碑",
        optionDesc: "真实石材圆顶墓碑。", useStone: "使用这个墓碑",
        loading: "正在加载墓碑模型...", loadingPercent: "正在加载墓碑模型：", modelReady: "",
        loadError: "墓碑模型加载失败。请检查 assets/models/tombstone-real.glb 是否已经上传成功。"
      },
      "zh-TW": {
        brand: "星眠寵物紀念園", back: "返回修改", leftTitle: "墓碑樣式",
        leftDesc: "選擇一個墓碑，中間預覽會立刻變化。", mainTitle: "選擇墓碑",
        mainDesc: "墓碑會慢慢轉正，並安靜地落到紀念園中。", optionName: "圓頂墓碑",
        optionDesc: "真實石材圓頂墓碑。", useStone: "使用這個墓碑",
        loading: "正在載入墓碑模型...", loadingPercent: "正在載入墓碑模型：", modelReady: "",
        loadError: "墓碑模型載入失敗。請檢查 assets/models/tombstone-real.glb 是否已經上傳成功。"
      },
      en: {
        brand: "Starlit Pet Memorial Garden", back: "Back to Edit", leftTitle: "Stone Style",
        leftDesc: "Choose a stone and the preview updates immediately.", mainTitle: "Choose a Memorial Stone",
        mainDesc: "The stone will gently turn forward and settle into the garden.", optionName: "Rounded Stone",
        optionDesc: "A realistic rounded stone in natural stone material.", useStone: "Use This Stone",
        loading: "Loading tombstone model...", loadingPercent: "Loading tombstone model: ", modelReady: "",
        loadError: "Failed to load the tombstone model. Please check assets/models/tombstone-real.glb."
      },
      ja: {
        brand: "星眠ペット記念園", back: "修正に戻る", leftTitle: "墓碑スタイル",
        leftDesc: "墓碑を選ぶと中央プレビューがすぐ変わります。", mainTitle: "墓碑を選ぶ",
        mainDesc: "墓碑はゆっくり正面を向き、静かに記念園へ収まります。", optionName: "ラウンド墓碑",
        optionDesc: "自然な石材のリアルなラウンド墓碑です。", useStone: "この墓碑を使う",
        loading: "墓碑モデルを読み込み中...", loadingPercent: "墓碑モデルを読み込み中：", modelReady: "",
        loadError: "墓碑モデルの読み込みに失敗しました。assets/models/tombstone-real.glb を確認してください。"
      }
    };

    const state = {
      lang: localStorage.getItem("siteLanguage") || "zh",
      memorial: null,
      scene: null,
      camera: null,
      renderer: null,
      loader: null,
      stoneRoot: null,
      modelRoot: null,
      engravingMesh: null,
      engravingCanvas: null,
      engravingContext: null,
      engravingTexture: null,
      isLoaded: false,
      isAnimating: false,
      previewClock: 0
    };

    const els = {
      brandText: document.getElementById("brandText"),
      backBtn: document.getElementById("backBtn"),
      languageSelect: document.getElementById("languageSelect"),
      leftTitle: document.getElementById("leftTitle"),
      leftDesc: document.getElementById("leftDesc"),
      mainTitle: document.getElementById("mainTitle"),
      mainDesc: document.getElementById("mainDesc"),
      optionName: document.getElementById("optionName"),
      optionDesc: document.getElementById("optionDesc"),
      useStoneBtn: document.getElementById("useStoneBtn"),
      statusText: document.getElementById("statusText"),
      canvas: document.getElementById("stoneCanvas")
    };

    function t() { return I18N[state.lang] || I18N.zh; }

    function safeJsonParse(value, fallback) {
      try { return value ? JSON.parse(value) : fallback; } catch (error) { return fallback; }
    }

    function normalizeDate(value) {
      if (!value) return "";
      return String(value).trim().replace(/\//g, ".").replace(/-/g, ".");
    }

    function getMemorialData() {
      const data = safeJsonParse(localStorage.getItem("myPetMemorial"), {});
      return Object.assign({}, data, {
        name: data.name || data.petName || data.pet || "豆豆",
        birthDate: normalizeDate(data.birthDate || data.birthday || data.birth || "2015.08.20"),
        deathDate: normalizeDate(data.deathDate || data.passingDate || data.leaveDate || data.death || "2026.05.12"),
        epitaph: data.epitaph || data.message || data.words || data.memory || "谢谢你陪我走过这段人生"
      });
    }

    function setStatus(message, isError) {
      els.statusText.textContent = message || "";
      els.statusText.classList.toggle("error-text", !!isError);
      els.statusText.style.display = message ? "block" : "none";
    }

    function applyLanguage() {
      const text = t();
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : state.lang;
      els.brandText.textContent = text.brand;
      els.backBtn.textContent = text.back;
      els.leftTitle.textContent = text.leftTitle;
      els.leftDesc.textContent = text.leftDesc;
      els.mainTitle.textContent = text.mainTitle;
      els.mainDesc.textContent = text.mainDesc;
      els.optionName.textContent = text.optionName;
      els.optionDesc.textContent = text.optionDesc;
      els.languageSelect.value = state.lang;
      els.useStoneBtn.textContent = state.isLoaded ? text.useStone : text.loading;
      if (!state.isLoaded) setStatus(text.loading, false);
      updateEngravingTexture();
    }

    function initThree() {
      if (!window.THREE || !THREE.GLTFLoader) {
        setStatus("Three.js 或 GLTFLoader 没有加载成功，请刷新页面。", true);
        return false;
      }

      const canvas = els.canvas;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
      camera.position.set(MODEL_VIEW_CONFIG.cameraX, MODEL_VIEW_CONFIG.cameraY, MODEL_VIEW_CONFIG.cameraZ);

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(canvas.clientWidth || 800, canvas.clientHeight || 600, false);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      scene.add(new THREE.AmbientLight(0xcfd9e8, 1.38));

      const hemi = new THREE.HemisphereLight(0x9fb7d7, 0x4c4132, 1.25);
      hemi.position.set(0, 10, 0);
      scene.add(hemi);

      const moonLight = new THREE.DirectionalLight(0xbfd0ea, 1.25);
      moonLight.position.set(-4.5, 7.5, 7.2);
      moonLight.castShadow = true;
      moonLight.shadow.mapSize.width = 2048;
      moonLight.shadow.mapSize.height = 2048;
      moonLight.shadow.camera.near = 0.1;
      moonLight.shadow.camera.far = 30;
      moonLight.shadow.camera.left = -8;
      moonLight.shadow.camera.right = 8;
      moonLight.shadow.camera.top = 8;
      moonLight.shadow.camera.bottom = -8;
      scene.add(moonLight);

      const warmLeft = new THREE.PointLight(0xf2cd8a, 0.82, 18, 2);
      warmLeft.position.set(-3.5, 1.25, 2.6);
      scene.add(warmLeft);

      const warmRight = new THREE.PointLight(0xf0c57f, 0.92, 18, 2);
      warmRight.position.set(3.7, 1.25, 2.8);
      scene.add(warmRight);

      const backFill = new THREE.PointLight(0x86a2cf, 0.42, 22, 2);
      backFill.position.set(0, 3.6, -4.8);
      scene.add(backFill);

      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 10),
        new THREE.ShadowMaterial({ opacity: 0.15 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.set(0, MODEL_VIEW_CONFIG.shadowY, 0.5);
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      const stoneRoot = new THREE.Group();
      stoneRoot.position.set(MODEL_VIEW_CONFIG.previewX, MODEL_VIEW_CONFIG.previewY, MODEL_VIEW_CONFIG.previewZ);
      stoneRoot.rotation.y = THREE.MathUtils.degToRad(MODEL_VIEW_CONFIG.previewRotYDeg);
      stoneRoot.scale.setScalar(MODEL_VIEW_CONFIG.previewScale);
      scene.add(stoneRoot);

      state.scene = scene;
      state.camera = camera;
      state.renderer = renderer;
      state.loader = new THREE.GLTFLoader();
      state.stoneRoot = stoneRoot;
      resizeScene();
      return true;
    }

    function resizeScene() {
      if (!state.renderer || !state.camera) return;
      const canvas = els.canvas;
      const width = canvas.clientWidth || 800;
      const height = canvas.clientHeight || 600;
      state.camera.aspect = width / Math.max(height, 1);
      state.camera.updateProjectionMatrix();
      state.renderer.setSize(width, height, false);
    }

    function disposeObject(obj) {
      if (!obj) return;
      obj.traverse(function(child) {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(function(mat) {
            if (mat.map) mat.map.dispose();
            if (mat.normalMap) mat.normalMap.dispose();
            if (mat.roughnessMap) mat.roughnessMap.dispose();
            mat.dispose();
          });
        }
      });
    }

    function clearOldStone() {
      if (!state.stoneRoot) return;
      while (state.stoneRoot.children.length) {
        const child = state.stoneRoot.children[0];
        state.stoneRoot.remove(child);
        disposeObject(child);
      }
      state.modelRoot = null;
      state.engravingMesh = null;
    }

    function createEngravingCanvas() {
      if (state.engravingCanvas) return;
      state.engravingCanvas = document.createElement("canvas");
      state.engravingCanvas.width = ENGRAVING_CONFIG.canvasWidth;
      state.engravingCanvas.height = ENGRAVING_CONFIG.canvasHeight;
      state.engravingContext = state.engravingCanvas.getContext("2d");
      state.engravingTexture = new THREE.CanvasTexture(state.engravingCanvas);
      state.engravingTexture.encoding = THREE.sRGBEncoding;
      state.engravingTexture.needsUpdate = true;
    }

    function wrapText(ctx, text, maxWidth, maxLines) {
      const value = String(text || "").trim();
      if (!value) return [];
      const hasSpace = /\s/.test(value);
      const units = hasSpace ? value.split(/\s+/) : Array.from(value);
      const lines = [];
      let current = "";

      for (let i = 0; i < units.length; i++) {
        const unit = units[i];
        const test = hasSpace ? (current ? current + " " + unit : unit) : current + unit;
        if (ctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = unit;
          if (lines.length >= maxLines) break;
        } else {
          current = test;
        }
      }
      if (current && lines.length < maxLines) lines.push(current);

      if (lines.length > maxLines) lines.length = maxLines;
      if (lines.length === maxLines) {
        let last = lines[lines.length - 1];
        while (ctx.measureText(last + "…").width > maxWidth && last.length > 1) {
          last = last.slice(0, -1);
        }
        if (last !== lines[lines.length - 1]) lines[lines.length - 1] = last + "…";
      }
      return lines;
    }

    function drawEngravedText(ctx, text, x, y, font) {
      if (!text) return;
      ctx.save();
      ctx.font = font;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = ENGRAVING_CONFIG.softHighlight;
      ctx.fillText(text, x - 1.2, y - 1.1);

      ctx.fillStyle = ENGRAVING_CONFIG.darkShadow;
      ctx.fillText(text, x + 1.4, y + 1.6);

      ctx.globalAlpha = 1;
      ctx.fillStyle = ENGRAVING_CONFIG.textColor;
      ctx.fillText(text, x, y);

      ctx.globalAlpha = 0.22;
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.fillText(text, x + 0.5, y + 0.6);
      ctx.restore();
    }

    function applyTextWear(ctx, width, height, amount) {
      const image = ctx.getImageData(0, 0, width, height);
      const data = image.data;
      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];
        if (alpha > 16) {
          const r = Math.random();
          if (r < amount) data[i + 3] = Math.floor(alpha * 0.42);
          else if (r < amount * 1.8) data[i + 3] = Math.floor(alpha * 0.72);
        }
      }
      ctx.putImageData(image, 0, 0);
    }

    function updateEngravingTexture() {
      if (!window.THREE) return;
      createEngravingCanvas();
      const data = state.memorial || getMemorialData();
      const ctx = state.engravingContext;
      const canvas = state.engravingCanvas;
      if (!ctx || !canvas) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const topY = 300;
      const fontFamily = "'Noto Serif SC','Noto Serif TC','Noto Serif JP','Microsoft YaHei','PingFang SC','Hiragino Sans',serif";
      const nameFont = "700 " + ENGRAVING_CONFIG.nameFontSize + "px " + fontFamily;
      const dateFont = "500 " + ENGRAVING_CONFIG.dateFontSize + "px " + fontFamily;
      const epitaphFont = "500 " + ENGRAVING_CONFIG.epitaphFontSize + "px " + fontFamily;

      const dateLine = [data.birthDate, data.deathDate].filter(Boolean).join(" - ");

      drawEngravedText(ctx, data.name, centerX, topY, nameFont);
      drawEngravedText(ctx, dateLine, centerX, topY + 130, dateFont);

      ctx.font = epitaphFont;
      const lines = wrapText(ctx, data.epitaph, canvas.width * 0.42, ENGRAVING_CONFIG.maxEpitaphLines);
      const step = ENGRAVING_CONFIG.epitaphFontSize + ENGRAVING_CONFIG.lineGap;
      const startY = topY + 300 - ((lines.length - 1) * step) / 2;
      lines.forEach(function(line, index) {
        drawEngravedText(ctx, line, centerX, startY + index * step, epitaphFont);
      });

      applyTextWear(ctx, canvas.width, canvas.height, ENGRAVING_CONFIG.wearAmount);
      state.engravingTexture.needsUpdate = true;
    }

    function prepareModelMaterial(mesh) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      if (!mesh.material) return;
      const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      materials.forEach(function(mat) {
        if (mat.map) mat.map.encoding = THREE.sRGBEncoding;
        mat.roughness = Math.max(mat.roughness || 0.7, 0.82);
        mat.metalness = 0;
        mat.needsUpdate = true;
      });
    }

    function fitModelToScene(root) {
      const firstBox = new THREE.Box3().setFromObject(root);
      const firstSize = new THREE.Vector3();
      firstBox.getSize(firstSize);
      const targetHeight = MODEL_VIEW_CONFIG.targetHeight;
      const scale = targetHeight / Math.max(firstSize.y, 0.001);
      root.scale.setScalar(scale);

      const box = new THREE.Box3().setFromObject(root);
      const center = new THREE.Vector3();
      box.getCenter(center);
      root.position.x -= center.x;
      root.position.z -= center.z;
      root.position.y -= box.min.y - MODEL_VIEW_CONFIG.modelBottomY;
    }

    function attachEngraving(root) {
      createEngravingCanvas();
      updateEngravingTexture();

      const geometry = new THREE.PlaneGeometry(
        ENGRAVING_CONFIG.planeWidth,
        ENGRAVING_CONFIG.planeHeight
      );
      const material = new THREE.MeshBasicMaterial({
        map: state.engravingTexture,
        transparent: true,
        opacity: ENGRAVING_CONFIG.opacity,
        depthWrite: false,
        depthTest: true,
        side: THREE.FrontSide,
        alphaTest: 0.01,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2
      });
      const plane = new THREE.Mesh(geometry, material);
      plane.name = "dynamicCanvasEngraving";
      plane.renderOrder = 8;
      plane.position.set(
        ENGRAVING_CONFIG.planeX,
        ENGRAVING_CONFIG.planeY,
        ENGRAVING_CONFIG.planeZ
      );
      root.add(plane);
      state.engravingMesh = plane;
    }

    function loadStoneModel() {
      if (!state.loader) return;
      clearOldStone();
      state.isLoaded = false;
      els.useStoneBtn.disabled = true;
      els.useStoneBtn.textContent = t().loading;
      setStatus(t().loading, false);

      const timeout = setTimeout(function() {
        if (!state.isLoaded) {
          setStatus("模型还在加载。如果一直停在这里，请直接打开 assets/models/tombstone-real.glb 测试模型文件能否下载。", false);
        }
      }, 10000);

      state.loader.load(
        MODEL_URL,
        function(gltf) {
          clearTimeout(timeout);
          const root = gltf.scene || (gltf.scenes && gltf.scenes[0]);
          if (!root) {
            setStatus(t().loadError, true);
            return;
          }
          root.traverse(function(obj) {
            if (obj.isMesh) prepareModelMaterial(obj);
          });
          fitModelToScene(root);
          state.stoneRoot.add(root);
          state.modelRoot = root;
          attachEngraving(root);
          state.isLoaded = true;
          els.useStoneBtn.disabled = false;
          els.useStoneBtn.textContent = t().useStone;
          setStatus("", false);
        },
        function(xhr) {
          if (state.isLoaded) return;
          if (xhr.lengthComputable && xhr.total > 0) {
            const pct = Math.max(1, Math.min(99, Math.round((xhr.loaded / xhr.total) * 100)));
            setStatus(t().loadingPercent + pct + "%", false);
          } else {
            setStatus(t().loading, false);
          }
        },
        function(error) {
          clearTimeout(timeout);
          console.error(error);
          state.isLoaded = false;
          els.useStoneBtn.disabled = true;
          els.useStoneBtn.textContent = t().loading;
          setStatus(t().loadError, true);
        }
      );
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (!state.renderer || !state.scene || !state.camera) return;
      state.previewClock += 0.01;
      if (state.stoneRoot && state.isLoaded && !state.isAnimating) {
        const target = THREE.MathUtils.degToRad(MODEL_VIEW_CONFIG.previewRotYDeg) + Math.sin(state.previewClock) * 0.006;
        state.stoneRoot.rotation.y = THREE.MathUtils.lerp(state.stoneRoot.rotation.y, target, 0.06);
      }
      state.renderer.render(state.scene, state.camera);
    }

    function animateConfirm() {
      if (!state.stoneRoot || !state.isLoaded || state.isAnimating) return;
      state.isAnimating = true;
      document.body.classList.add("planting");
      els.useStoneBtn.disabled = true;

      const start = {
        x: state.stoneRoot.position.x,
        y: state.stoneRoot.position.y,
        z: state.stoneRoot.position.z,
        scale: state.stoneRoot.scale.x,
        rotY: state.stoneRoot.rotation.y
      };
      const end = {
        x: MODEL_VIEW_CONFIG.finalX,
        y: MODEL_VIEW_CONFIG.finalY,
        z: MODEL_VIEW_CONFIG.finalZ,
        scale: MODEL_VIEW_CONFIG.finalScale,
        rotY: THREE.MathUtils.degToRad(MODEL_VIEW_CONFIG.finalRotYDeg)
      };
      const duration = 1250;
      const begin = performance.now();
      function ease(t) { return 1 - Math.pow(1 - t, 3); }
      function step(now) {
        const raw = Math.min(1, (now - begin) / duration);
        const k = ease(raw);
        state.stoneRoot.position.x = THREE.MathUtils.lerp(start.x, end.x, k);
        state.stoneRoot.position.y = THREE.MathUtils.lerp(start.y, end.y, k);
        state.stoneRoot.position.z = THREE.MathUtils.lerp(start.z, end.z, k);
        state.stoneRoot.scale.setScalar(THREE.MathUtils.lerp(start.scale, end.scale, k));
        state.stoneRoot.rotation.y = THREE.MathUtils.lerp(start.rotY, end.rotY, k);
        if (raw < 1) {
          requestAnimationFrame(step);
        } else {
          const data = getMemorialData();
          data.tombstoneStyle = "rounded-real-glb";
          data.tombstoneModel = "assets/models/tombstone-real.glb";
          data.tombstoneConfirmed = true;
          localStorage.setItem("myPetMemorial", JSON.stringify(data));
          localStorage.setItem("selectedStoneModel", "assets/models/tombstone-real.glb");
          window.location.href = "cemetery.html";
        }
      }
      requestAnimationFrame(step);
    }

    function bindEvents() {
      window.addEventListener("resize", resizeScene);
      els.backBtn.addEventListener("click", function() { window.location.href = "create.html"; });
      els.useStoneBtn.addEventListener("click", animateConfirm);
      els.languageSelect.addEventListener("change", function(event) {
        state.lang = event.target.value;
        localStorage.setItem("siteLanguage", state.lang);
        applyLanguage();
      });
      window.addEventListener("storage", function(event) {
        if (event.key === "myPetMemorial") {
          state.memorial = getMemorialData();
          updateEngravingTexture();
        }
        if (event.key === "siteLanguage") {
          state.lang = localStorage.getItem("siteLanguage") || "zh";
          applyLanguage();
        }
      });
    }

    function init() {
      state.memorial = getMemorialData();
      applyLanguage();
      bindEvents();
      if (initThree()) {
        loadStoneModel();
        renderLoop();
      }
    }

    init();
  </script>
</body>
</html>
