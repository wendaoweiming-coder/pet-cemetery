<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Tombstone</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #10140f;
      color: #fffaf5;
      overflow: hidden;
    }

    button, a, select {
      outline: none;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    .hero-stage {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #0f1411;
    }

    .hero-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(
          180deg,
          rgba(6, 10, 18, 0.06) 0%,
          rgba(6, 10, 18, 0.10) 40%,
          rgba(6, 10, 18, 0.24) 100%
        ),
        url("cemetery-bg.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transform: scale(1.12);
      transform-origin: center center;
      filter: saturate(1.03);
    }

    .top-bar {
      position: relative;
      z-index: 30;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 38px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: opacity 0.35s ease;
    }

    .logo {
      color: rgba(255, 250, 245, 0.95);
      text-decoration: none;
      font-size: 18px;
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .back-link {
      color: rgba(255, 244, 232, 0.78);
      text-decoration: none;
      font-size: 14px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }

    .language-select {
      border: 1px solid rgba(255, 250, 245, 0.32);
      background: rgba(255, 250, 245, 0.12);
      color: #fffaf5;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .language-select option {
      color: #2d2520;
      background: #fffaf5;
    }

    .stage-inner {
      position: relative;
      z-index: 5;
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 140px;
    }

    .center-stage {
      position: relative;
      width: 100%;
      max-width: 1280px;
      min-height: 720px;
    }

    .left-panel {
      position: absolute;
      left: 38px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      width: 245px;
      transition: opacity 0.35s ease;
    }

    body.planting .top-bar,
    body.planting .left-panel,
    body.planting .instruction {
      opacity: 0;
      pointer-events: none;
    }

    .panel-title {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 500;
      color: rgba(255, 250, 245, 0.94);
      text-shadow: 0 3px 16px rgba(0,0,0,0.3);
    }

    .panel-subtitle {
      margin: 0 0 22px;
      color: rgba(255, 244, 232, 0.68);
      font-size: 13px;
      line-height: 1.7;
      text-shadow: 0 2px 12px rgba(0,0,0,0.24);
    }

    .stone-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .stone-option {
      width: 100%;
      border: none;
      background: transparent;
      color: #fffaf5;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .stone-option-inner {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 22px;
      border: 1px solid rgba(255, 250, 245, 0.14);
      background: rgba(255, 250, 245, 0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: 0.22s ease;
    }

    .stone-option:hover .stone-option-inner {
      background: rgba(255, 250, 245, 0.10);
      border-color: rgba(255, 250, 245, 0.28);
      transform: translateX(6px);
    }

    .stone-option.active .stone-option-inner {
      background: rgba(255, 250, 245, 0.16);
      border-color: rgba(255, 250, 245, 0.46);
    }

    .mini-preview {
      width: 58px;
      height: 72px;
      position: relative;
      display: flex;
      align-items: end;
      justify-content: center;
    }

    .mini-base {
      position: absolute;
      bottom: 0;
      width: 52px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #968d85, #625a53);
    }

    .mini-stone {
      position: absolute;
      bottom: 7px;
      width: 40px;
      height: 52px;
      background: linear-gradient(180deg, #ded8d0, #8c837b);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.22);
    }

    .mini-rounded { border-radius: 24px 24px 8px 8px; }
    .mini-square { border-radius: 10px; }

    .mini-arch {
      width: 42px;
      height: 60px;
      border-radius: 24px 24px 6px 6px;
    }

    .mini-small {
      width: 34px;
      height: 44px;
      border-radius: 18px 18px 8px 8px;
    }

    .mini-heart {
      width: 40px;
      height: 42px;
      border-radius: 12px 12px 8px 8px;
    }

    .mini-heart::before,
    .mini-heart::after {
      content: "";
      position: absolute;
      top: -13px;
      width: 21px;
      height: 21px;
      background: linear-gradient(180deg, #ded8d0, #a49b93);
      border-radius: 50%;
    }

    .mini-heart::before { left: 1px; }
    .mini-heart::after { right: 1px; }

    .option-name {
      margin: 0 0 4px;
      font-size: 14px;
      color: rgba(255, 250, 245, 0.92);
    }

    .option-desc {
      margin: 0;
      font-size: 12px;
      color: rgba(255, 244, 232, 0.58);
      line-height: 1.5;
    }

    .confirm-button {
      width: 100%;
      margin-top: 22px;
      border: none;
      background: rgba(255, 250, 245, 0.92);
      color: #4b3d35;
      padding: 13px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.16);
    }

    .instruction {
      position: absolute;
      left: 50%;
      top: 34px;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      width: min(680px, 90vw);
      text-shadow: 0 3px 18px rgba(0,0,0,0.34);
      transition: opacity 0.35s ease;
    }

    .instruction h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      color: #fff8ef;
    }

    .instruction p {
      margin: 0;
      color: rgba(255, 244, 232, 0.76);
      font-size: 14px;
    }

    .center-stone-wrap {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 360px;
      height: 480px;
      display: flex;
      align-items: end;
      justify-content: center;
      z-index: 10;
      transform-origin: center bottom;
      transform: translate(-50%, -50%) scale(1.22);
      transition: transform 1.35s cubic-bezier(0.22, 0.82, 0.22, 1);
    }

    body.planting .center-stone-wrap {
      transform: translate(-50%, -50%) scale(1);
    }

    .center-stone-shadow {
      position: absolute;
      bottom: 6px;
      width: 290px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.36);
      filter: blur(14px);
    }

    .memorial-stone {
      position: relative;
      width: 230px;
      min-height: 300px;
      padding: 36px 24px 30px;
      background: linear-gradient(180deg, #ddd8cf 0%, #b8afa5 52%, #80776f 100%);
      color: #514941;
      text-align: center;
      box-shadow:
        inset 0 5px 12px rgba(255,255,255,0.34),
        inset 0 -8px 16px rgba(55,48,42,0.18),
        0 26px 48px rgba(0,0,0,0.42);
      z-index: 2;
    }

    .memorial-stone-rounded { border-radius: 115px 115px 26px 26px; }
    .memorial-stone-square { border-radius: 28px; }

    .memorial-stone-arch {
      width: 238px;
      min-height: 336px;
      border-radius: 120px 120px 18px 18px;
    }

    .memorial-stone-small {
      width: 192px;
      min-height: 248px;
      border-radius: 92px 92px 22px 22px;
    }

    .memorial-stone-heart {
      width: 226px;
      min-height: 270px;
      border-radius: 34px 34px 24px 24px;
      margin-top: 44px;
    }

    .memorial-stone-heart::before,
    .memorial-stone-heart::after {
      content: "";
      position: absolute;
      top: -56px;
      width: 112px;
      height: 112px;
      background: linear-gradient(180deg, #ddd8cf 0%, #b8afa5 70%, #9f968d 100%);
      border-radius: 50%;
      z-index: -1;
      box-shadow: inset 0 5px 12px rgba(255,255,255,0.26);
    }

    .memorial-stone-heart::before { left: 15px; }
    .memorial-stone-heart::after { right: 15px; }

    .stone-base {
      position: absolute;
      bottom: 0;
      width: 294px;
      height: 38px;
      border-radius: 20px 20px 10px 10px;
      background: linear-gradient(180deg, #968d85, #665d56);
      box-shadow:
        inset 0 3px 6px rgba(255,255,255,0.14),
        0 18px 34px rgba(0,0,0,0.32);
      z-index: 1;
    }

    .visibility-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.42);
      color: #5d5048;
      font-size: 12px;
    }

    .stone-photo {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: rgba(255,250,245,0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 30px;
    }

    .stone-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .stone-name {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 500;
      color: #4d453f;
    }

    .stone-years {
      margin: 0 0 14px;
      font-size: 14px;
      color: #746b64;
    }

    .stone-words {
      margin: 0 auto;
      max-width: 168px;
      font-size: 14px;
      line-height: 1.6;
      color: #5f554e;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }

      .top-bar {
        padding: 22px 20px 0;
        align-items: flex-start;
      }

      .top-actions {
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .left-panel {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: 100%;
        max-width: 420px;
        margin: 0 auto 24px;
      }

      .center-stage {
        min-height: 620px;
      }

      .center-stone-wrap {
        transform: translate(-50%, -50%) scale(1);
      }

      body.planting .center-stone-wrap {
        transform: translate(-50%, -50%) scale(0.86);
      }
    }
  </style>
</head>

          <option value="it">Italiano</option>
          <option value="th">ไทย</option>
          <option value="vi">Tiếng Việt</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="hi">हिन्दी</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>

    <div class="stage-inner">
      <div class="center-stage">

        <aside class="left-panel">
          <h2 class="panel-title" data-key="panelTitle">Tombstone style</h2>
          <p class="panel-subtitle" data-key="panelSubtitle">
            Choose one tombstone. The large stone in the center will change immediately.
          </p>

          <div class="stone-list">

            <button class="stone-option active" data-style="rounded" onclick="selectStone('rounded', this)">
              <div class="stone-option-inner">
                <div class="mini-preview">
                  <div class="mini-stone mini-rounded"></div>
                  <div class="mini-base"></div>
                </div>
                <div>
                  <p class="option-name" data-key="roundedName">Rounded top</p>
                  <p class="option-desc" data-key="roundedDesc">Gentle and classic.</p>
                </div>
              </div>
            </button>

            <button class="stone-option" data-style="square" onclick="selectStone('square', this)">
              <div class="stone-option-inner">
                <div class="mini-preview">
                  <div class="mini-stone mini-square"></div>
                  <div class="mini-base"></div>
                </div>
                <div>
                  <p class="option-name" data-key="squareName">Soft square</p>
                  <p class="option-desc" data-key="squareDesc">Simple and quiet.</p>
                </div>
              </div>
            </button>

            <button class="stone-option" data-style="heart" onclick="selectStone('heart', this)">
              <div class="stone-option-inner">
                <div class="mini-preview">
                  <div class="mini-stone mini-heart"></div>
                  <div class="mini-base"></div>
                </div>
                <div>
                  <p class="option-name" data-key="heartName">Heart style</p>
                  <p class="option-desc" data-key="heartDesc">Warm and soft.</p>
                </div>
              </div>
            </button>

            <button class="stone-option" data-style="arch" onclick="selectStone('arch', this)">
              <div class="stone-option-inner">
                <div class="mini-preview">
                  <div class="mini-stone mini-arch"></div>
                  <div class="mini-base"></div>
                </div>
                <div>
                  <p class="option-name" data-key="archName">Tall arch</p>
                  <p class="option-desc" data-key="archDesc">Calm and solemn.</p>
                </div>
              </div>
            </button>

            <button class="stone-option" data-style="small" onclick="selectStone('small', this)">
              <div class="stone-option-inner">
                <div class="mini-preview">
                  <div class="mini-stone mini-small"></div>
                  <div class="mini-base"></div>
                </div>
                <div>
                  <p class="option-name" data-key="smallName">Small pet stone</p>
                  <p class="option-desc" data-key="smallDesc">Tiny and gentle.</p>
                </div>
              </div>
            </button>

          </div>

          <button class="confirm-button" onclick="confirmStone()" data-key="confirmBtn">
            Use this tombstone
          </button>
        </aside>

        <div class="instruction">
          <h1 data-key="title">Choose a tombstone</h1>
          <p data-key="subtitle">After confirmation, the stone will shrink into its final position.</p>
        </div>

        <div class="center-stone-wrap" id="stoneWrap">
          <div class="center-stone-shadow"></div>

          <div class="memorial-stone memorial-stone-rounded" id="memorialStone">
            <div class="visibility-badge" id="visibilityDisplay">Public</div>
            <div class="stone-photo" id="petPhotoDisplay">🐾</div>
            <h1 class="stone-name" id="petNameDisplay">Luna</h1>
            <p class="stone-years" id="petYearsDisplay">---- — ----</p>
            <p class="stone-words" id="petMemoryDisplay">You are loved, always.</p>
          </div>

          <div class="stone-base"></div>
        </div>

      </div>
    </div>

  </section>

    function getText() {
      return translations[currentLang] || translations.en;
    }

    function changeLanguage(lang) {
      currentLang = translations[lang] ? lang : "en";
      localStorage.setItem("siteLanguage", currentLang);

      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      const select = document.getElementById("languageSelect");
      if (select) select.value = currentLang;

      const text = getText();

      document.querySelectorAll("[data-key]").forEach(function(el) {
        const key = el.getAttribute("data-key");
        if (text[key]) el.textContent = text[key];
      });

      renderStone();
    }

    function renderStone() {
      const data = JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
      const text = getText();

      selectedStoneStyle = data.tombstoneStyle || selectedStoneStyle || "rounded";

      const stone = document.getElementById("memorialStone");
      const name = document.getElementById("petNameDisplay");
      const years = document.getElementById("petYearsDisplay");
      const words = document.getElementById("petMemoryDisplay");
      const photo = document.getElementById("petPhotoDisplay");
      const visibility = document.getElementById("visibilityDisplay");

      if (stone) stone.className = "memorial-stone memorial-stone-" + selectedStoneStyle;
      if (name) name.textContent = data.name || text.defaultName;
      if (years) years.textContent = (data.birthDate || "----") + " — " + (data.leaveDate || "----");
      if (words) words.textContent = data.epitaph || data.memory || text.defaultWords;

      if (photo) {
        if (data.photo) {
          photo.innerHTML = '<img src="' + data.photo + '">';
        } else {
          photo.textContent = "🐾";
        }
      }

      if (visibility) {
        if (data.visibility === "private") {
          visibility.textContent = text.privateText;
        } else if (data.visibility === "invite") {
          visibility.textContent = text.inviteText;
        } else {
          visibility.textContent = text.publicText;
        }
      }

      const activeButton = document.querySelector('[data-style="' + selectedStoneStyle + '"]');
      if (activeButton) {
        document.querySelectorAll(".stone-option").forEach(btn => btn.classList.remove("active"));
        activeButton.classList.add("active");
      }
    }

    function selectStone(style, button) {
      selectedStoneStyle = style;

      document.querySelectorAll(".stone-option").forEach(btn => btn.classList.remove("active"));
      if (button) button.classList.add("active");

      const stone = document.getElementById("memorialStone");
      if (stone) stone.className = "memorial-stone memorial-stone-" + style;
    }

    function confirmStone() {
      const data = JSON.parse(localStorage.getItem("myPetMemorial") || "{}");
      data.tombstoneStyle = selectedStoneStyle;
      localStorage.setItem("myPetMemorial", JSON.stringify(data));

      document.body.classList.add("planting");

      setTimeout(function() {
        window.location.replace("cemetery.html");
      }, 1750);
    }

    window.addEventListener("DOMContentLoaded", function() {
      const savedLanguage = localStorage.getItem("siteLanguage") || "en";
      changeLanguage(savedLanguage);
    });
  </script>
